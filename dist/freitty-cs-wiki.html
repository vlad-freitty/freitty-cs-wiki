function netSwitchTab(tab) {
  netCurrentTab = tab;
  document.querySelectorAll('.net-tab').forEach(b => b.classList.toggle('on', b.dataset.nettab === tab));
  document.querySelectorAll('.net-tab-content').forEach(c => c.classList.toggle('on', c.id === `net-tab-${tab}`));
  if (tab === 'map') {
    netInitMap();
  }
}

// ─── FILTERING ────────────────────────────────────────

function netToggleType(t) {
  if (netActiveTypes.has(t)) netActiveTypes.delete(t);
  else netActiveTypes.add(t);
  document.querySelectorAll('.net-chip-type').forEach(c => c.classList.toggle('on', netActiveTypes.has(c.dataset.type)));
  netApplyFilters();
}

function netToggleSvc(s) {
  if (netActiveServices.has(s)) netActiveServices.delete(s);
  else netActiveServices.add(s);
  document.querySelectorAll('.net-chip-svc').forEach(c => c.classList.toggle('on', netActiveServices.has(c.dataset.svc)));
  netApplyFilters();
}

function netApplyFilters() {
  const q = (document.getElementById('net-search')?.value || '').trim().toLowerCase();
  const cards = document.querySelectorAll('.net-card');
  let visible = 0, ownVis = 0, partVis = 0;
  cards.forEach(card => {
    const name = card.dataset.name;
    const type = card.dataset.type;
    const svcStr = card.dataset.services;
    const services = svcStr.split(' ');
    const matchSearch = !q || name.includes(q);
    const matchSvc = netActiveServices.size === 0 || [...netActiveServices].every(s => services.includes(s));
    const matchType = netActiveTypes.size === 0 || netActiveTypes.has(type);
    const ok = matchSearch && matchSvc && matchType;
    card.style.display = ok ? '' : 'none';
    if (ok) {
      visible++;
      if (type === 'own') ownVis++;
      else partVis++;
    }
  });
  const cnt = document.getElementById('net-count');
  if (cnt) cnt.innerHTML = `<b>${visible}</b> з ${cards.length}`;
  const dOwn = document.getElementById('net-div-own');
  const gOwn = document.getElementById('net-grid-own');
  const dPar = document.getElementById('net-div-partner');
  const gPar = document.getElementById('net-grid-partner');
  if (dOwn) dOwn.style.display = ownVis === 0 ? 'none' : '';
  if (gOwn) gOwn.style.display = ownVis === 0 ? 'none' : '';
  if (dPar) dPar.style.display = partVis === 0 ? 'none' : '';
  if (gPar) gPar.style.display = partVis === 0 ? 'none' : '';
  const empty = document.getElementById('net-empty');
  if (empty) empty.classList.toggle('on', visible === 0);
}

<h2>Принцип 2 — Ціна не таємниця</h2>

<p>Ціна озвучується <strong>одразу після того як зрозумів що потрібен cross-dock або storage</strong> — до збору компанії, до MC, до будь-яких деталей. Це факт, не питання.</p>

<p>Після ціни клієнт розслабляється і готовий говорити про деталі. Crisis клієнт після ціни отримує embedded ask. Standard клієнт — природні питання про локацію і дату.</p>

<h2 style="margin-top:24px"><span class="bdg bg-g">🟦 ЕТАП 4</span> DEAL — Rule of 4</h2>

/* ---------------- search index ---------------- */
const norm = s => String(s||'').toLowerCase().replace(/[ʼ’'`]/g,"'").replace(/ё/g,'е');

let IDX = null;
function buildIndex(){
  IDX = [];
  for (const c of ALL_CODES){
    const r = REG[c];
    IDX.push({route:'doc-'+slug(c), label:c, title:docTitle(c), where: TYPES[TYPE_OF(c)]||'', text: norm([c, docTitle(c), r.owner, r.note, r.stream].join(' ')), raw:[c, docTitle(c), r.note].filter(Boolean).join(' · '), boost:3});
    const d = D.docs[c];
    if (d){ let sec = '';
      d.blocks.forEach((b, i) => {
        if (b.t === 'h') { sec = b.text; return; }
        const txt = b.t === 'table' ? b.rows.map(r => r.join(' · ')).join(' / ') : b.text;
        const pm = b.t==='p' && b.text.match(/^(\d+(?:\.\d+)+)\.?\s/);
        IDX.push({route:'doc-'+slug(c) + (pm ? '--p-'+pm[1].replace(/\./g,'-') : '--b-'+i), label:c, title:docTitle(c), where:sec, text:norm(txt), raw:txt, boost:0});
      }); }
  }
  MAT.forEach(m => { const body = strip(legacyRaw('old', m.p)); IDX.push({route:'doc-'+slug(m.to)+'--m-'+m.p, label:m.to, title:legTitle('old', m.p), where:'Робочий матеріал', text:norm(legTitle('old', m.p)+' '+legKeys('old', m.p)+' '+body), raw:body, boost:1}); });
  TOOLS.forEach(t => IDX.push({route:'tool-'+t.p, label:'Інструмент', title:legTitle('tool', t.p), where:t.docs.join(', '), text:norm(legTitle('tool', t.p)+' '+legKeys('tool', t.p)), raw:legKeys('tool', t.p), boost:2}));
  REFS.forEach(r => { const body = r.kind==='old' ? strip(legacyRaw('old', r.p)) : ''; IDX.push({route:'ref-'+r.id, label:'Довідник', title:legTitle(r.kind, r.p), where:'', text:norm(legTitle(r.kind, r.p)+' '+legKeys(r.kind, r.p)+' '+body), raw:body || legKeys(r.kind, r.p), boost:1}); });
  D.proposals.forEach(p => IDX.push({route:'prop-'+p.id, label:'Пропозиція', title:p.title, where:(p.for||[]).join(', '), text:norm(p.title+' '+p.blocks.map(b=>b.text||(b.rows||[]).map(r=>r.join(' ')).join(' ')).join(' ')), raw:p.title, boost:1}));
  D.decisions.forEach(r => IDX.push({route:'decisions', label:'Рішення '+r.n, title:r.topic, where:r.status, text:norm(r.topic+' '+r.text), raw:r.text, boost:0}));
}
function search(q){
  if (!IDX) buildIndex();
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const res = [];
  for (const it of IDX){
    if (!words.every(w => it.text.includes(w))) continue;
    res.push({it, score: it.boost + (norm(it.title).includes(words[0]) ? 2 : 0) + (norm(it.label) === norm(q) ? 10 : 0)});
  }
  res.sort((a,b) => b.score - a.score);
  return res.slice(0, 40).map(r => r.it);
}
function snippet(raw, q){
  const words = norm(q).split(/\s+/).filter(Boolean); const n = norm(raw);
  const i = Math.max(0, n.indexOf(words[0])); const s = Math.max(0, i - 50);
  let h = esc((s ? '…' : '') + raw.slice(s, i + 140) + (i + 140 < raw.length ? '…' : ''));
  for (const w of words){ if (w.length < 2) continue; h = h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<mark>${m}</mark>`); }
  return h;
}

function perm(code, qi, n){ const idx = [...Array(n).keys()]; let h = 7; for (const ch of code + ':' + qi) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  for (let i = n - 1; i > 0; i--){ h = (Math.imul(h, 1103515245) + 12345) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function refLink(code, ref){ const [k, n] = String(ref).split(':'); return k === 'p' ? `<a href="#doc-${slug(code)}--p-${n.replace(/\./g,'-')}">п. ${esc(n)}</a>` : `<a href="#doc-${slug(code)}--s-${esc(n)}">розділ ${esc(n)}</a>`; }
function quizHtml(code){
  const qz = QUIZ[code]; const st = QZ[code] || (QZ[code] = {ans:{}, res:null, tries:0});
  return `<p class="small">Перевірка розуміння: ${qz.length} питання. Щоб відмітити ознайомлення, дайте правильні відповіді на всі. Неправильні можна виправити й перевірити ще раз.</p>
  <div class="quiz">${qz.map((q, qi) => { const r = st.res?.[qi];
    return `<fieldset class="${r === true ? 'good' : r === false ? 'bad' : ''}"><legend>${qi + 1}. ${esc(q.q)}</legend>${perm(code, qi, q.o.length).map(oi => `<label><input type="radio" name="qz-${slug(code)}-${qi}" data-qz="${esc(code)}|${qi}|${oi}" ${st.ans[qi] === oi ? 'checked' : ''}><span>${esc(q.o[oi])}</span></label>`).join('')}${r === false ? `<div class="small">Не так. Перечитайте ${refLink(code, q.ref)}.</div>` : ''}</fieldset>`; }).join('')}</div>
  <p class="small muted" style="margin:0">Питання — проєкт, підготовлений разом зі створенням вікі; власник документа їх перевіряє.</p>
  <div class="row"><button class="kb pri" data-qcheck="${esc(code)}">Перевірити і відмітити ознайомлення</button>${st.tries ? `<span class="small muted">Спроба ${st.tries + 1}</span>` : ''}</div>`;

function checkQuiz(code){
  const qz = QUIZ[code]; const st = QZ[code] || (QZ[code] = {ans:{}, res:null, tries:0});
  if (qz.some((q, qi) => st.ans[qi] === undefined)){ toast('Дайте відповідь на всі питання'); return; }
  st.tries++; st.res = qz.map((q, qi) => st.ans[qi] === 0);
  if (st.res.every(Boolean)){ const quiz = {score:qz.length, total:qz.length, tries:st.tries}; delete QZ[code]; sign(code, quiz); }
  else { render(); toast(`Правильно ${st.res.filter(Boolean).length} з ${qz.length}. Виправте позначені питання.`); }
}

function blockKey(b){ if (b.t === 'h') return 'h:' + b.text.replace(/^\d+\.\s*/, ''); if (b.t === 'p'){ const m = b.text.match(/^(\d+(?:\.\d+)+)\.?\s/); if (m) return 'p:' + m[1]; }
  if (b.t === 'table') return 't:' + (b.rows[0] || []).join('|'); return 'x:' + (b.text || '').slice(0, 80); }
const blockText = b => b.t === 'table' ? b.rows.map(r => r.join(' | ')).join('\n') : (b.text || '');
function wordDiff(a, b){
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/); const n = A.length, m = B.length;
  if (n * m > 600000) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const dp = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = '';
  while (i < n && j < m){ if (A[i] === B[j]){ out += esc(A[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out += `<del>${esc(A[i++])}</del>`; else out += `<ins>${esc(B[j++])}</ins>`; }
  while (i < n) out += `<del>${esc(A[i++])}</del>`; while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return out;
}
function diffHtml(oldB, newB){
  const om = new Map(); oldB.filter(b => !b.passport).forEach(b => om.set(blockKey(b), b));
  const seen = new Set(); let add = 0, rem = 0, chg = 0, h = '', pendingH = '';
  newB.filter(b => !b.passport).forEach(b => {
    const k = blockKey(b); seen.add(k);
    if (b.t === 'h'){ pendingH = `<h3>${esc(b.text)}</h3>`; return; }
    const o = om.get(k); const t = blockText(b); let piece = '';
    if (!o){ add++; piece = `<div class="dblk add"><div class="small">Додано</div><div style="white-space:pre-wrap">${esc(t)}</div></div>`; }
    else if (blockText(o) !== t){ chg++; piece = `<div class="dblk chg"><div class="small">Змінено</div><div class="diff" style="white-space:pre-wrap">${wordDiff(blockText(o), t)}</div></div>`; }
    if (piece){ h += pendingH + piece; pendingH = ''; }
  });
  const removed = [...om.entries()].filter(([k]) => !seen.has(k) && !k.startsWith('h:'));
  if (removed.length) h += `<h3>Видалено</h3>` + removed.map(([, b]) => { rem++; return `<div class="dblk rem"><div style="white-space:pre-wrap">${esc(blockText(b))}</div></div>`; }).join('');
  return `<div class="row" style="margin:8px 0 14px"><span class="chip ok">+${add} додано</span><span class="chip warn">${chg} змінено</span><span class="chip crit">−${rem} видалено</span></div>` + (add + chg + rem ? h : '<div class="empty">Текст не змінився.</div>');
}
function viewOldVersion(code, anchor){

  if (!old) return `<div class="wrap"><div class="empty">Версії v${esc(vs)} документа ${esc(code)} немає в архіві. <a href="#doc-${slug(code)}">До поточної версії</a></div></div>`;
  const head = `<div class="eyebrow"><a href="#doc-${slug(code)}">${code}</a> · <a href="#archive">архів версій</a></div><h1 class="ptitle">${esc(old.title || docTitle(code))}</h1>
  <div class="note crit"><b>Архівна версія v${esc(vs)} — не чинна.</b> ${cur ? `Поточна версія: <a href="#doc-${slug(code)}">v${esc(cur.version)}</a>.` : ''} ${kind === 'ver' ? `<a href="#doc-${slug(code)}--diff-${vslug(vs)}">Що змінилось у поточній</a>` : `<a href="#doc-${slug(code)}--ver-${vslug(vs)}">Повний текст v${esc(vs)}</a>`}</div>`;
  if (kind === 'ver') return `<div class="wrap"><article class="read">${head}${foldBar}<div class="body">${blocksHtml(old.blocks, {}, 'old-')}</div></article></div>`;

const sgOpen = store.get('sg') || {};
function sideHtml(route){
  const own = S.own?.docs || {}; const req = new Set(reqFor(myRole(), myItems()));
  const item = (href, label, code, extra='') => {
    const on = route === href || (code && route.startsWith('doc-'+slug(code)+'--')) ? 'on' : '';
    let dot = '';
    if (code && req.has(code)) { const st = ackState(code, own); dot = `<span class="dot ${st}" title="${st==='ok'?'Ознайомлений(а)':st==='re'?'Нова версія — ознайомтесь знову':'Потрібне ознайомлення'}"></span>`; }
    else if (extra) dot = `<span class="mt">${extra}</span>`;
    return `<a class="${on}" href="#${href}">${code?`<span class="c">${code}</span>`:''}<span>${esc(label)}</span>${dot}</a>`;
  };
  const group = (id, label, inner, count) => `<details class="sg" data-sg="${id}" ${sgOpen[id] === false ? '' : 'open'}><summary class="sgh">${esc(label)}${count?`<span class="n">${count}</span>`:''}</summary>${inner}</details>`;
  let h = group('work', 'Робота', item('home','Що робити, коли…') + item('me','Мої ознайомлення') + item('newbie','Шлях новачка') + item('questions','Відкриті питання і блокери') + item('flags','Позначки до пунктів', null, String(allFlags().filter(f => f.status === 'open').length || '')));
  if (S.admin) h += group('admin', 'Адміністрування', item('team','Команда і призначення') + item('journal','Журнал ознайомлень (REG-13)') + item('roles','Ролі і доступи'));
  if (LEG_OK) h += group('tools', 'Інструменти', TOOLS.map(t => item('tool-'+t.p, legTitle('tool', t.p))).join(''), TOOLS.length);
  for (const t of Object.keys(TYPES)){
    const list = ALL_CODES.filter(c => TYPE_OF(c) === t && hasAny(c));
    if (!list.length) continue;
    h += group('t-'+t, TYPES[t], list.map(c => item('doc-'+slug(c), docTitle(c), c, !hasText(c) ? 'мат.' : '')).join(''), list.length);
  }
  if (LEG_OK) h += group('ref', 'Довідник', REFS.map(r => item('ref-'+r.id, legTitle(r.kind, r.p))).join(''), REFS.length);
  h += group('kb', 'База знань', item('registry','Реєстр документів') + (S.admin?'':item('roles','Ролі і доступи')) + item('core','Ядро v1') + item('ready','Готовність бази') + item('streams','Потоки') + item('proposals','Пропозиції змін') + item('decisions','Журнал рішень') + item('archive','Архів версій') + item('demand','Знімок попиту') + item('legend','Як влаштована база'));
  return h;
}

const COLLAPSED = /Паспорт|Пов.?язані документи|Відкриті питання|Історія версій/;
function blocksHtml(blocks, ctx, prefix=''){
  let h = '', list = null, inSec = false, k = 0;
  const closeList = () => { if (list){ h += `</${list}>`; list = null; } };
  blocks.forEach((b, i) => {
    if (b.t !== 'li') closeList();
    if (b.passport) return;
    if (b.t === 'h'){
      if (inSec) h += '</div></details>';
      const m = b.text.match(/^(\d+)\./); const id = prefix + (m ? 's-'+m[1] : 'h-'+(k++));
      h += `<details class="sec" id="${id}" ${COLLAPSED.test(b.text)?'':'open'}><summary><h2>${inline(b.text, ctx)}</h2></summary><div class="sec-b">`;
      inSec = true; return;
    }
    if (b.t === 'h3') h += `<h3>${inline(b.text, ctx)}</h3>`;
    else if (b.t === 'p'){
      const m = b.text.match(/^(\d+(?:\.\d+)+)\.?\s+(.*)$/s);
      if (m){ const pid = 'p-' + m[1].replace(/\./g,'-');
        let fb = '';
        if (ctx && ctx.flags){ const n = openFlagsFor(ctx.code, pid).length; fb = `<button class="flag-btn${n?' has':''}" data-flag="${esc(ctx.code)}|${pid}" title="Позначити пункт: застаріло, незрозуміло, на практиці інакше" aria-label="Позначити пункт ${m[1]}">⚑${n?' '+n:''}</button>`; }
        h += `<p class="np${b.indent?' ind':''}" id="${prefix}${pid}"><span class="n">${m[1]}</span><span>${inline(m[2], ctx)}</span>${fb}</p>`;
        if (ctx && ctx.flags && FLAG.open === ctx.code + '|' + pid) h += flagBox(ctx.code, pid); }
      else h += `<p id="${prefix}b-${i}" class="${b.indent?'ind':''}${/:$/.test(b.text)?' sub':''}">${inline(b.text, ctx)}</p>`;
    }
    else if (b.t === 'li'){ const t = b.ord ? 'ol' : 'ul'; if (list !== t){ closeList(); h += `<${t}>`; list = t; } h += `<li>${inline(b.text, ctx)}</li>`; }
    else if (b.t === 'quote') h += `<blockquote>${inline(b.text, ctx)}</blockquote>`;

function openQuestions(code){
  const d = D.docs[code]; if (!d) return [];
  let on = false, sub = ''; const items = [];
  for (const b of d.blocks){
    if (b.t === 'h'){ if (on) break; on = /Відкриті питання/.test(b.text); continue; }
    if (!on || b.t !== 'p') continue;
    const m = b.text.match(/^(\d+(?:\.\d+)+)\.?\s+(.*)$/s);
    if (m) items.push({n:m[1], text:m[2], sub}); else sub = b.text;
  }
  return items;
}

function journalEvents(){
  const ev = [];
  Object.entries(S.team.acks).forEach(([uid, a]) => {
    const log = a.log && a.log.length ? a.log : Object.entries(a.docs || {}).map(([c, x]) => ({t:'ack', c, v:x.v, at:x.at}));
    log.forEach(e => ev.push({...e, who:uid, by:uid, self:true}));
  });
  S.audit.forEach(e => ev.push(e));
  allFlags().forEach(f => { ev.push({t:'flag', who:f.uid, by:f.uid, self:true, c:f.c, p:f.p, at:f.at, text:f.text});
    if (f.ansAt) ev.push({t:'flag-answer', who:f.uid, by:f.ansBy, c:f.c, p:f.p, at:f.ansAt, text:f.answer}); });
  ev.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  return ev;
}
function evText(e){
  if (e.t === 'ack') return `${docLinkTxt(e.c)}${e.v?' v'+esc(e.v):''}${e.quiz?` · перевірка ${e.quiz.score}/${e.quiz.total}, спроба ${e.quiz.tries}`:''}`;
  if (e.t === 'flag' || e.t === 'flag-answer') return `${docLinkTxt(e.c)} п. ${esc(String(e.p||'').replace(/^p-/,'').replace(/-/g,'.'))}: ${esc(String(e.text||'').slice(0, 120))}`;
  if (e.t === 'assign') return `${docLinkTxt(e.c)}${e.due?' · термін '+fmtDay(e.due):''}`;

  if (e.t === 'matrix') return `${docLinkTxt(e.c)} → ${esc(ROLE_NAME[e.role]||e.role)}: ${e.on?'обов\'язковий':'не обов\'язковий'}`;
  return '';
}

let lastRoute = null;
function parseRoute(){
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  if (h.startsWith('doc-')){ const [base, anchor] = h.slice(4).split('--'); return {view:'doc', code:unslug(base), anchor}; }
  if (h.startsWith('prop-')) return {view:'prop', id:h.slice(5)};
  let m = h.match(/^tool-(\d+)$/); if (m) return {view:'tool', p:+m[1]};
  m = h.match(/^ref-([\w]+)$/); if (m) return {view:'ref', id:m[1]};
  m = h.match(/^old-(\d+)$/); if (m) return {view:'old', p:+m[1]};
  return {view:h};
}
function render(){
  const r = parseRoute(); const route = decodeURIComponent(location.hash.slice(1)) || 'home';

  if (t.id === 'menuBtn'){ toggleSide(); return; }
  if (t.classList.contains('srch-it')){ $('#sres').hidden = true; $('#si').value = ''; }
  if (!e.target.closest('.srch')) $('#sres').hidden = true;
});
const isNarrow = () => window.matchMedia('(max-width:900px)').matches;
if (store.get('noside') === true) document.body.classList.add('noside');
function toggleSide(){
  if (!isNarrow()){ const hide = !document.body.classList.contains('noside'); document.body.classList.toggle('noside', hide); store.set('noside', hide); return; }
  const s = $('#side'); const open = !s.classList.contains('open'); s.classList.toggle('open', open);
  let sc = $('.scrim'); if (open && !sc){ sc = document.createElement('div'); sc.className = 'scrim'; sc.onclick = closeDrawer; document.body.appendChild(sc); } if (!open && sc) sc.remove();
}
function closeDrawer(){ $('#side').classList.remove('open'); const sc = $('.scrim'); if (sc) sc.remove(); }

/* search box */
const si = $('#si'), sres = $('#sres'); let sel = -1;
si.addEventListener('input', () => {
  const q = si.value.trim(); sel = -1;
  if (q.length < 2){ sres.hidden = true; return; }
  const res = search(q);
  if (!res.length && q.length >= 3) logGap(q);
  sres.innerHTML = res.length ? `<div class="cnt">Знайдено: ${res.length}${res.length===40?'+':''}</div>` + res.map(it => `<a class="srch-it" href="#${it.route}"><div class="l">${esc(it.label)} · ${esc(it.title)}${it.where?' · '+esc(it.where):''}</div><div class="s">${snippet(it.raw, q)}</div></a>`).join('') : `<div class="cnt">Нічого не знайдено. Спробуйте інше слово або код документа.</div>`;
  sres.hidden = false;
});
si.addEventListener('keydown', e => {
  const items = [...sres.querySelectorAll('.srch-it')];
  if (e.key === 'Escape'){ sres.hidden = true; si.blur(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(0, Math.min(items.length-1, sel + (e.key==='ArrowDown'?1:-1))); items.forEach((x,i) => x.classList.toggle('on', i===sel)); items[sel]?.scrollIntoView({block:'nearest'}); }
  if (e.key === 'Enter'){ const it = items[Math.max(sel,0)]; if (it){ location.hash = it.getAttribute('href'); sres.hidden = true; si.value = ''; si.blur(); } }
});
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); si.focus(); si.select(); } });

render();
initShared().catch(() => { S.ready = true; S.noAccess = true; render(); });
})();
</script>
