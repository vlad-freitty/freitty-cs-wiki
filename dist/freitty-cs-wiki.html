етка","version":"0.1","approved":null,"next_review":null,"related":["POL-07","POL-08","POL-16","POL-17","POL-20","STD-01","STD-03","STD-09","STD-11","STD-18","STD-19","STD-20","PRC-4.0","PRC-7.0","SOP-1.6","TPL-05","REG-04","REG-10"],"note":"v0.1 від 09.09.2026. Ескалація без строку реакції не є ескалацією. Строк реакції — це строк відповіді, а не вирішення. При відсутності реакції перехід на наступний рівень без повторного очікування; агент, який ескалював вчасно, за затримку не відповідає. Чотири рівні E1-E4. БЛОКУЄ: строки не підтверджені адресатами; роль чергового по зміні (E1) не визначена; TPL-05 не створено"},{"code":"STD-13","title":"Строки зберігання за типами записів","level":"L2 Стандарт","stream":"Право і безпека","tier":"1 - операційний","owner":"Andy Havryliuk","format":"Сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["POL-01","POL-02","POL-04","POL-11","POL-12","POL-17","STD-05","STD-15","PRC-E.2","SOP-E.3","SOP-6.7","WI-02","REG-01","REG-03","REG-04","REG-05","REG-07","REG-08"],"note":"v0.1 від 09.09.2026, ВЛАСНИК Andy Havryliuk. Каркас з операційної логіки БЕЗ юридичної перевірки — усі строки є пропозицією. Дві межі строку: короткий позбавляє захисту в претензії, довгий створює ризик персональних даних. Записи для претензії живуть довше за записи для роботи. Заморожування має пріоритет над строком; резервні копії підпадають під ті самі строки. БЛОКУЄ: юридичне підтвердження; не визначено, які джурисдикції (США/Канада/Україна) до яких записів"},{"code":"STD-14","title":"Перелік вантажів за категоріями приймання","level":"L2 Стандарт","stream":"Операції","tier":"0 - критичний","owner":"Уточнити","format":"Сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["POL-16","POL-17","POL-19","POL-20","STD-04","STD-09","STD-18","STD-19","STD-20","PRC-8.0","SOP-2.5","SOP-3.1","SOP-3.4","SOP-3.7","SOP-4.6","TPL-01"],"note":"v0.1 від 09.09.2026. Каркас БЕЗ переліку вантажів. Чотири категорії, включно з D («стоп і з'ясування», яка не є відмовою). Правило «сумнів трактується на користь відмови» без винятків. Ознаки, що дають D або C незалежно від котирування. Мета документа: щоб агент о третій ночі міг відповісти, не питаючи нікого. БЛОКУЄ: поіменний перелік по категоріях (потрібна робоча сесія: транспорт + склади + Havryliuk); власник не визначений; SOP-4.6 не створено"},{"code":"STD-15","title":"Строк заявлення претензії клієнтом","level":"L2 Стандарт","stream":"Право і безпека","tier":"0 - критичний","owner":"Andy Havryliuk","format":"Сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["POL-16","POL-17","POL-18","POL-19","STD-02","STD-09","STD-11","STD-13","STD-14","PRC-8.0","SOP-3.4","SOP-4.5","TPL-04","REG-03"],"note":"v0.1 від 09.09.2026, ВЛАСНИК Andy Havryliuk. Каркас БЕЗ строків — вони визначаються договором перевезення й застосовним правом США/Канади. Ключове: прийняти й визнати претензію — різні дії, CS приймає будь-яку претензію незалежно від строку і не повідомляє клієнту про сплив строку. БЛОКУЄ: юридичне визначення строків; SOP-3.4 не створено — без переліку документів чистий POD робить претензію по видимому пошкодженню недоказовою; не звірено зі строками, які carrier'и і страховики застосовують до нас"},{"code":"STD-16","title":"Оплата Stripe, комісії, строки скасування і повернення","level":"L2 Стандарт","stream":"Комерція","tier":"0 - критичний","owner":"Oksana / Billing","format":"Сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.2","approved":null,"next_review":null,"related":["POL-18","POL-03","STD-09","TPL-01","SOP-2.5"],"note":"Драфт v0.2 від 06.09.2026 як ТОЧКА ЗБОРУ чисел для POL-18. Заповнено: єдиний спосіб оплати Stripe; норма 10 хвилин на кожну внутрішню реакцію при розбіжності обсягу в restack, включно з повідомленням складу при відсутності відповіді клієнта. Порожні: комісія Stripe і чи перекладається, межа коротке/long term у днях, критерії case by case, часові межі скасування за сервісами, розмір утримання, періодичність оновлень для складу, повернення (заповнює Billing)"},{"code":"STD-17","title":"Критерій ключового клієнта","level":"L2 Стандарт","stream":"Комерція","tier":"0 - критичний","owner":"Oleh Hevko / Andy Pylypiv","format":"Сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["POL-03","POL-20","STD-06","STD-08","STD-09","PRC-2.0","PRC-7.0","SOP-2.7","SOP-7.2","SOP-7.3","TPL-09","TPL-14","REG-08","REG-09"],"note":"v0.1 від 09.09.2026. Каркас БЕЗ порогів. Ключове рішення: поріг виводиться з ресурсу ранкової зміни, а не з бажаної суворості — спочатку встановлюється максимальна кількість клієнтів зі статусом, потім решта порогів під неї. Статус має бути втрачуваним. Стратегічна цінність вимагає письмового обґрунтування і має власну межу частки. Показники Win Rate (98% Consolidators, 57->75% L2R) перенесені з POL-20 як числові цілі. БЛОКУЄ POL-20: пороги не заповнені (потрібен розподіл клієнтів за оборотом і частотою); база розрахунку Win Rate не визначена (SOP-7.3)"},{"code":"STD-18","title":"Строки вирішення, частота оновлень і закриття звернення","level":"L2 Стандарт","stream":"Сервіс","tier":"0 - критичний","owner":"Oksana","format":"Сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["STD-02","STD-19","STD-20","STD-07","POL-08","PRC-7.0","SOP-1.6","SOP-1.8","TPL-06","REG-08"],"note":"v0.1 від 09.09.2026. Закриває розрив після першої відповіді. Замість строку вирішення компанія зобовʼязується ритмом оновлень: 10 хв у гарячій фазі, 30 хв у затяжній, узгоджений інтервал у тривалій. Оновлення з трьох елементів (що змінилося / що робимо / коли наступне). Ескалація за часом. Обмеження: одна гаряча ситуація на агента. Заборона тихого закриття. БЛОКУЄ: немає складу чергування для підключення поза зміною (REG-10)"},{"code":"STD-19","title":"Пріоритезація при одночасному навантаженні","level":"L2 Стандарт","stream":"Сервіс","tier":"0 - критичний","owner":"Oksana","format":"Сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["STD-01","STD-02","STD-18","STD-20","STD-06","POL-08","POL-16","SOP-1.1","SOP-1.7","SOP-7.4"],"note":"v0.1 від 09.09.2026. Закриває конфлікт норм STD-01, STD-02 і STD-18 при одному агенті. Пріоритет визначає зміст звернення, а не канал: сім рівнів черговості, дзвінок і письмове P1 на одному рівні, за рівного рівня спершу дзвінок (незворотність втрати). Правило одного рядка зі строком перед відкладенням. Фіксація перевантаження як даних для SOP-7.4, а не як провини. БЛОКУЄ: п. 11.1 — немає складу чергування (REG-10)"},{"code":"STD-20","title":"Підключення ресурсу поза зміною","level":"L2 Стандарт","stream":"Сервіс","tier":"0 - критичний","owner":"Oksana","format":"Сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.2","approved":null,"next_review":null,"related":["POL-08","POL-02","POL-19","STD-06","STD-09","STD-18","STD-19","SOP-E.4","SOP-1.6","REG-10","TPL-14"],"note":"v0.2 від 09.09.2026. Закритий перелік підстав для підняття людини поза її годинами, чотири сходинки з переходом за 10 хв, дзвінок а не повідомлення, заборона виражати незадоволення в момент підняття, фіксація без розбору з агентом. Netcor покриває вечірні зміни і вихідні; ніч не покрита. БЛОКУЄ: чи оплачується чергування (А. Кулик); REG-10 не створено; нічна транспортна підтримка"},{"code":"PRC-1.0","title":"Contact-to-Resolution","level":"L2 Процес","stream":"1.0 Звернення","tier":"0 - критичний","owner":"Oksana","format":"Схема + сторінка","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.5","approved":null,"next_review":null,"related":["SOP-1.1..1.8"],"note":"Наскрізний процес обробки звернення"},{"code":"PRC-2.0","title":"Lead-to-Order","l "Сервіс","tier":"0 - критичний","owner":"Oksana","format":"Excel","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["STD-20 (Додаток А)","STD-18","STD-19","POL-02","POL-08","SOP-E.4","PRC-E.3"],"note":"v0.1 від 09.09.2026 — файл створено, ПОРОЖНІЙ. 13 полів. Один рядок — одна РОЛЬ, не одна людина; кожна роль має основну і резервну. Контакт для ДЗВІНКА (повідомлення вночі не будить). Має бути доступний офлайн. НЕВІДОМО: хто резервний CS уночі; чи є черговий по транспорту вночі (Netcor покриває вечір і вихідні); ЧИ ОПЛАЧУЄТЬСЯ ЧЕРГУВАННЯ — рішення А. Кулика. БЛОКУЄ STD-20, STD-18 (п.5.5), STD-19 (п.6.3)"},{"code":"REG-11","title":"Картки партнерських SLA","level":"L5 Запис","stream":"Партнери","tier":"0 - критичний","owner":"Andrew","format":"Excel","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["STD-03 (Додаток А)","POL-14","PRC-5.0","SOP-2.4","SOP-3.5","REG-01"],"note":"v0.1 від 09.09.2026 — файл створено, ПОРОЖНІЙ. 19 полів. Одна картка — одна локація; партнер без картки працює БЕЗ SLA. Адресат — названа людина, спільна скринька адресатом не є. Часовий пояс і календар свят локації обов'язкові: свята США і Канади не збігаються з українськими, без цих полів порушення нараховуються хибно в обидва боки. Аварійний контакт: якщо його немає — записується прямо. БЛОКУЄ STD-03 і SOP-2.4"},{"code":"REG-12","title":"Реєстр доступів та інструментів","level":"L5 Запис","stream":"Управління","tier":"0 - критичний","owner":"IT + Oksana","format":"Excel","storage":"Notion / Freitty CS","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["PRC-E.2","PRC-E.3","POL-04","POL-11","STD-13","SOP-6.1","SOP-6.7","WI-01 — WI-07","REG-05"],"note":"v0.1 від 09.09.2026 — файл створено, два аркуші: «Доступи» (порожній) і «Інструменти» (попередньо заповнений дев'ятьма відомими системами). Центральний артефакт PRC-E.2. Доступ, знайдений у системі без запису тут, ПРИЗУПИНЯЄТЬСЯ, а не легалізується записом. При зміні ролі фіксується і що знімається. Доступ до спільних скриньок відкликається окремо. У аркуші «Інструменти» вже позначено: Dialpad — правова підстава запису розмов не зафіксована (POL-01); Teams — статус клієнтського каналу не визначений; respond.io — виведений, згадки залишились у SOP-1.3 і WI-06"},{"code":"POL-21","title":"Політика ролей і ознайомлення з базою знань","level":"L1 Політика","stream":"Люди","tier":"1 - операційний","owner":"Oksana","format":"Сторінка","storage":"Freitty CS Wiki","status":"Чернетка","version":"0.1","approved":null,"next_review":null,"related":["POL-04","POL-10","POL-13","SOP-6.2","SOP-6.4","REG-13"],"note":"Новий код, запропонований у вікі 17.11.2026. Потрібно внести рядок у реєстр і затвердити власника."},{"code":"REG-13","title":"Журнал ознайомлень з документами","level":"L5 Запис","stream":"6.0 Люди","tier":"1 - операційний","owner":"Oksana","format":"Журнал у вікі","storage":"Freitty CS Wiki","status":"Чинний","version":"1.0","approved":null,"next_review":null,"related":["POL-21","SOP-6.4","REG-02"],"note":"Новий код, запропонований у вікі 17.11.2026. Журнал веде вікі автоматично: кожне ознайомлення, призначення і зміна ролі."}],"core":[{"code":"STD-06","why":"Склад змін не відповідає попиту США"},{"code":"STD-01","why":"Головна метрика мандату"},{"code":"STD-19","why":"Пріоритет телефону, листів, передзвонів"},{"code":"SOP-1.1","why":"Вхідний дзвінок"},{"code":"SOP-1.6","why":"Передача зміни + спільна черга"},{"code":"SOP-1.7","why":"~100 абонентів на тиждень без розмови"},{"code":"STD-02","why":"Письмові звернення, ~125 листів на будній день"},{"code":"SOP-1.2","why":"Спільна скринька"},{"code":"SOP-2.5","why":"Котирування"},{"code":"SOP-2.6","why":"Відкладена квота, 21% часу розмов"},{"code":"PRC-3.0","why":"Життєвий цикл ордера"},{"code":"SOP-3.2","why":"Проактивні статуси, ~205 дзвінків на тиждень"},{"code":"TPL-15","why":"Тексти операційних повідомлень"},{"code":"POL-18","why":"Оплата і реліз трака"},{"code":"POL-16","why":"Приймання вантажу"},{"code":"STD-14","why":"Перелік вантажів, hazmat"},{"code":"SOP-4.6","why":"Стоп-процедура hazmat"},{"code":"SOP-7.1","why":"Логування"},{"code":"STD-07","why":"Таксономія причин"},{"code":"STD-04","why":"Поріг якості (CAE) — після POL-11"},{"code":"TPL-07","why":"Форма скорингу"},{"code":"WI-07","why":"Навігатор «що робити, коли…»"}],"docs":{"POL-01":{"code":"POL-01","title":"Політика запису розмов і згоди сторін","source":"pdf","meta":{"Код":"POL-01","Рівень":"L1 Політика","Зона":"Право і безпека","Tier":"0 — критичний","Власник":"Andy Havryliuk","Підготувала":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.1","Перегляд":"Раз на рік або при зміні законодавства чи телефонії"},"status":"Чернетка","version":"0.1","date":"Nov 8, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-01"],["Рівень","L1 Політика"],["Зона","Право і безпека"],["Tier","0 — критичний"],["Власник","Andy Havryliuk"],["Підготувала","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.1"],["Перегляд","Раз на рік або при зміні законодавства чи телефонії"]],"passport":true},{"t":"p","text":"1.1. Документ підготовлено як СТРУКТУРУ. Позиція і зобовʼязання сформульовані з операційної логіки. Юридичну перевірку по штатах США і провінціях Канади не проведено.","indent":false},{"t":"p","text":"1.2. До висновку юриста документ не затверджується. Розділи, які прямо залежать від висновку, позначені в розділі 12.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Кожна записана розмова Freitty має законну підставу і може бути використана в претензії, навчанні та контролі якості. Запис без підстави не захищає компанію, а створює ризик.","indent":false},{"t":"p","text":"2.2. Документ дає одне правило для всієї команди. Агент не визначає штат чи провінцію співрозмовника і не вирішує, чи можна записувати. Правило однакове для кожного дзвінка.","indent":false},{"t":"p","text":"2.3. Політика є юридичною підставою для POL-10 (оцінка якості), STD-04 (поріг якості), SOP-6.5 (скоринг) і WI-02 (Dialpad). Поки POL-01 не затверджено, оцінювання записів спирається на непідтверджену підставу.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на всі голосові розмови, які веде команда CS від імені Freitty: вхідні й вихідні дзвінки в Dialpad, дзвінки клієнтам, партнерським локаціям, carrier`ам, водіям і брокерам.","indent":false},{"t":"p","text":"3.2. Політика поширюється на голосові дзвінки та голосові повідомлення в Telegram і Teams, якщо вони ведуться по ордеру або з клієнтом. Такі розмови не записуються, доки для них не визначено підставу і місце зберігання (розділ 12).","indent":false},{"t":"p","text":"3.3. Політика поширюється на всіх, хто веде розмови від імені CS: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist і підрядника Netcor.","indent":false},{"t":"p","text":"3.4. Політика НЕ визначає строки зберігання записів. Це STD-13 і POL-12.","indent":false},{"t":"p","text":"3.5. Політика НЕ визначає, хто і як оцінює записи. Це POL-10, STD-04 і SOP-6.5.","indent":false},{"t":"p","text":"3.6. Політика НЕ визначає, які дані з розмови можна передавати в зовнішні сервіси, зокрема AI-транскрипцію. Це POL-11 і POL-02.","indent":false},{"t":"p","text":"3.7. Політика НЕ регулює внутрішні розмови команди між собою, наради та співбесіди.","indent":false},{"t":"h","text":"4. Позиція компанії"},{"t":"p","text":"4.1. Freitty повідомляє про запис КОЖНОГО співрозмовника на початку КОЖНОЇ розмови, незалежно від його штату чи провінції. Компанія застосовує найсуворішу норму як єдину, а не визначає норму по кожному дзвінку.","indent":false},{"t":"p","text":"4.2. Обґрунтування: частина штатів США вимагає згоди всіх сторін, а співрозмовник може перебувати не там, де зареєстрована його компанія. Агент не може надійно визначити місцеперебування людини, тому правило не має від цього залежати.","indent":false},{"t":"p","text":"4.3. Згодою вважається продовження розмови після повідомлення. Окреме «так» не вимагається, якщо юрист не встановить інше (розділ 12).","indent":false},{"t":"p","text":"4.4. Співрозмовник має право відмовитися від запису. Відмова від запису не є відмовою в обслуговуванні.","indent":false},{"t":"p","text":"4.5. Запис робиться для трьох цілей: захист сторін у претензії, навчання команди, контроль якості. Інше використання запису потребує окремого рішення власника політики.","indent":false},{"t":"p","text":"4.6. Співробітники CS знають, що їхні робочі розмови записуються. Це фіксується письмово при прийомі на роботу, а не повідомляється усно.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Агент озвучує повідомлення про запис першою або другою реплікою розмови, до того як співрозмовник назве будь-які дані. Текст повідомлення живе в TPL-01, а не в цій політиці.","indent":false},{"t":"p","text":"5.2. Повідомлення звучить і на вихідних дзвінках. Вихідний дзвінок не є винятком, навіть якщо людина сама залишала заявку.","indent":false},{"t":"p","text":"5.3. На вхідній лінії Dialpad повідомлення про запис звучить автоматично, до зʼєднання з агентом. Автоматичне повідомлення не скасовує обовʼязку агента на вихідних дзвінках.","indent":false},{"t":"p","text":"5.4. Якщо співрозмовник відмовився від запису, агент вимикає запис у Dialpad і продовжує розмову. Відмова фіксується в нотатці HubSpot по контакту одним рядком.","indent":false},{"t":"p","text":"5.5. Розмова без запису ведеться так само повно. Усі домовленості з неї агент підтверджує клієнту письмово того ж дня, бо доказу в голосі немає.","indent":false},{"t":"p","text":"5.6. Перед початком роботи кожен співробітник і підрядник CS підписує ознайомлення з тим, що його робочі розмови записуються і для чого.","indent":false},{"t":"p","text":"5.7. Доступ до записів має лише коло людей, визначене в WI-02 і REG-12. Доступ надається за роллю, а не за проханням.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено записувати розмову, про запис якої співрозмовника не повідомлено.","indent":false},{"t":"p","text":"6.2. Заборонено записувати розмову на особистий телефон, диктофон або будь-який засіб поза Dialpad.","indent":false},{"t":"p","text":"6.3. Заборонено продовжувати запис після того, як співрозмовник від нього відмовився.","indent":false},{"t":"p","text":"6.4. Заборонено пересилати, викачувати або показувати запис людям поза колом доступу, зокрема в особисті чати Telegram.","indent":false},{"t":"p","text":"6.5. Заборонено використовувати запис проти клієнта поза претензією. Запис не цитується клієнту як «доказ» у звичайній суперечці без рішення Andy Havryliuk.","indent":false},{"t":"p","text":"6.6. Заборонено використовувати запис для покарання агента без процедури POL-10. Право агента оскаржити оцінку зберігається.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Повідомлення про запис не пропускається через навантаження, збій чи спішність. Якщо в режимі деградації за STD-10 немає часу на повідомлення, запис вимикається, а не ведеться без повідомлення.","indent":false},{"t":"p","text":"7.2. При переході на резервну телефонію (мобільний звʼязок, особистий номер за SOP-E.4) розмова не записується взагалі. Домовленості підтверджуються письмово.","indent":false},{"t":"p","text":"7.3. Право співрозмовника відмовитися від запису діє в будь-якому режимі роботи.","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Співрозмовник погрожує позовом через запис, вимагає видалити запис або надати його копію: агент не обіцяє і не відмовляє, фіксує вимогу і передає Andy Havryliuk того ж дня за POL-08.","indent":false},{"t":"p","text":"8.2. Запит на запис від третьої сторони (страховик, юрист, правоохоронний орган): передається Andy Havryliuk. Агент запис не надає.","indent":false},{"t":"p","text":"8.3. Виявлено запис без повідомлення або запис поза Dialpad: агент або супервайзер повідомляє Andy Havryliuk того ж дня. Запис не видаляється самостійно до рішення, бо може підпадати під юридичне утримання за POL-12.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із повідомлення про запис немає.","indent":false},{"t":"p","text":"9.2. Виняток із запису (розмова без запису на прохання співрозмовника) є правом співрозмовника, а не винятком із політики. У REG-04 не фіксується.","indent":false},{"t":"p","text":"9.3. Будь-яке інше відхилення затверджує лише Andy Havryliuk письмово і фіксується в REG-04 зі строком дії.","indent":false},{"t":"h","text":"10. Відповідальність"},{"t":"p","text":"10.1. Andy Havryliuk: власник політики, правова підстава запису, рішення за розділами 8 і 9, звʼязок із юристом.","indent":false},{"t":"p","text":"10.2. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"10.3. Oksana: впровадження в CS, текст повідомлення в TPL-01, ознайомлення команди за п. 5.6, контроль виконання через вибірку записів.","indent":false},{"t":"p","text":"10.4. IT: налаштування автоматичного повідомлення і прав доступу в Dialpad за WI-02 і REG-12.","indent":false},{"t":"p","text":"10.5. Агент: повідомлення в кожній розмові, вимкнення запису на прохання, фіксація відмови в HubSpot.","indent":false},{"t":"h","text":"11. Повʼязані документи"},{"t":"p","text":"11.1. Політики: POL-02 (персональні дані), POL-04 (доступи), POL-08 (ескалація), POL-10 (якість), POL-11 (AI-інструменти), POL-12 (зберігання і видалення).","indent":false},{"t":"p","text":"11.2. Стандарти: STD-04 (поріг якості), STD-06 (години роботи), STD-10 (деградація), STD-13 (строки зберігання).","indent":false},{"t":"p","text":"11.3. Процедури та інструкції: SOP-1.1 (вхідний дзвінок), SOP-6.5 (скоринг), SOP-E.4 (відключення світла), WI-02 (Dialpad).","indent":false},{"t":"p","text":"11.4. Шаблони та записи: TPL-01 (текст повідомлення), REG-04 (винятки), REG-12 (доступи).","indent":false},{"t":"h","text":"12. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"12.1. Висновок юриста: чи достатньо повідомлення плюс продовження розмови як згоди в усіх штатах США і провінціях Канади, з якими працює Freitty. Відповідає Andy Havryliuk.","indent":true},{"t":"p","text":"12.2. Чи поширюються на команду в Україні вимоги українського законодавства про персональні дані щодо запису власних співробітників. Відповідає Andy Havryliuk.","indent":true},{"t":"p","text":"12.3. Чи налаштовано в Dialpad автоматичне повідомлення про запис на вхідній лінії і чи можна вимкнути запис посеред розмови. Відповідає IT.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"12.4. Чи містить чинний TPL-01 повідомлення про запис. TPL-01 уже має статус «Потребує оновлення» — додати в ту саму правку.","indent":true},{"t":"p","text":"12.5. Чи записуються голосові дзвінки в Telegram і Teams фактично. Якщо так","indent":true},{"t":"p","text":"— де живуть записи.","indent":true},{"t":"p","text":"12.6. Чи підписували чинні співробітники і Netcor ознайомлення за п. 5.6.","indent":true},{"t":"h","text":"13. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.1","08.11.2026","Oksana","Перший драфт як структура. Позиція: єдина норма повідомлення для всіх співрозмовників. Юридична перевірка не проведена."]]}]},"POL-02":{"code":"POL-02","title":"Політика роботи з персональними даними","source":"pdf","meta":{"Код":"POL-02","Рівень":"L1 Політика","Зона":"Право і безпека","Tier":"0 — критичний","Власник":"Andy Havryliuk","Підготувала":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.1","Перегляд":"Раз на рік або при зміні законодавства, систем чи складу команди"},"status":"Чернетка","version":"0.1","date":"Nov 8, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-02"],["Рівень","L1 Політика"],["Зона","Право і безпека"],["Tier","0 — критичний"],["Власник","Andy Havryliuk"],["Підготувала","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.1"],["Перегляд","Раз на рік або при зміні законодавства, систем чи складу команди"]],"passport":true},{"t":"p","text":"1.1. Документ підготовлено як СТРУКТУРУ з операційної логіки CS. Юридичну перевірку щодо США, Канади та України не проведено.","indent":false},{"t":"p","text":"1.2. Особливість Freitty: дані клієнтів зі США і Канади обробляє команда в Україні та підрядник Netcor. Це передача даних за межі країни клієнта в кожній розмові, а не виняток.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Персональні дані, які CS отримує в роботі, живуть лише в системах компанії, використовуються лише для виконання замовлення і доступні лише тим, кому вони потрібні для ролі.","indent":false},{"t":"p","text":"2.2. Головний ризик Freitty не в зловмиснику, а в розпорошенні: дані клієнтів лежать в особистих чатах, скріншотах і пересланих листах, де компанія не може їх ні знайти, ні видалити, ні захистити.","indent":false},{"t":"p","text":"2.3. Політика є підставою для POL-11 (AI-інструменти), POL-12 (зберігання), SOP-1.4 (верифікація клієнта), STD-13 (строки) і PRC-E.2 (доступи).","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Персональні дані в цій політиці — будь-яка інформація, за якою можна визначити конкретну людину: імʼя, телефон, email, голос на записі, номер водійського посвідчення, номер авто водія, адреса, фото з обличчям.","indent":false},{"t":"p","text":"3.2. Політика поширюється на дані чотирьох груп: контактні особи клієнтів (carrier`и, брокери, консолідатори, L2R), водії, працівники партнерських локацій і самі співробітники CS.","indent":false},{"t":"p","text":"3.3. Політика поширюється на всіх, хто працює з цими даними від імені CS: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist і Netcor.","indent":false},{"t":"p","text":"3.4. Дані компаній (назва, MC, DOT, юридична адреса) не є персональними даними. Політика на них не поширюється, якщо вони не повʼязані з конкретною людиною.","indent":false},{"t":"p","text":"3.5. Політика НЕ визначає строки зберігання і порядок видалення. Це POL-12 і STD-13.","indent":false},{"t":"p","text":"3.6. Політика НЕ визначає технічні засоби захисту (MFA, паролі, ролі в системах). Це POL-04.","indent":false},{"t":"p","text":"3.7. Політика НЕ регулює запис розмов. Це POL-01.","indent":false},{"t":"p","text":"3.8. Платіжні дані (номери карток, рахунків) CS не обробляє взагалі: оплата приймається лише через Stripe (POL-18). Політика фіксує це як заборону, а не як порядок роботи з ними.","indent":false},{"t":"h","text":"4. Позиція компанії"},{"t":"p","text":"4.1. Збираємо мінімум. CS запитує лише ті дані, без яких неможливо виконати замовлення. Дані «про всяк випадок» не збираються.","indent":false},{"t":"p","text":"4.2. Одна мета — одне використання. Дані, отримані для замовлення, використовуються для замовлення і повʼязаної з ним комунікації. Маркетингове використання потребує окремої підстави.","indent":false},{"t":"p","text":"4.3. Дані живуть у системах компанії. Джерело істини по клієнту — HubSpot, по ордеру — Freitty Hub. Копія даних поза системами компанії вважається витоком, навіть якщо її ніхто не побачив.","indent":false},{"t":"p","text":"4.4. Доступ за роллю. Людина бачить дані, потрібні для її ролі, і втрачає доступ у день зміни ролі або виходу.","indent":false},{"t":"p","text":"4.5. Компанія відповідає за дані, які обробляє підрядник від її імені. Netcor працює з даними на тих самих умовах, що й штатна команда, і це закріплюється в договорі.","indent":false},{"t":"p","text":"4.6. Людина має право знати, які її дані зберігає Freitty, виправити їх і вимагати видалення в межах закону. Такі запити не відкидаються і не ігноруються, а передаються власнику політики.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Агент фіксує дані клієнта лише в HubSpot і Freitty Hub. Нотатка, чат чи документ поза ними не є місцем зберігання.","indent":false},{"t":"p","text":"5.2. Перед тим як повідомити будь-яку інформацію по ордеру, агент верифікує співрозмовника за SOP-1.4. Дані по ордеру не повідомляються людині, яку не верифіковано.","indent":false},{"t":"p","text":"5.3. Комунікація по ордеру ведеться в Order chat (POL-09). Telegram і Teams допускаються лише в робочих акаунтах, визначених у REG-12, і все дублюється в Order chat.","indent":false},{"t":"p","text":"5.4. Фото документів (BOL, POD) і вантажу завантажуються в систему, а з пристрою агента видаляються після завантаження.","indent":false},{"t":"p","text":"5.5. Дані в зовнішні сервіси, зокрема AI-інструменти і транскрипцію, передаються лише за POL-11 і лише в сервіси з переліку REG-12.","indent":false},{"t":"p","text":"5.6. Кожен співробітник і Netcor підписують зобовʼязання щодо конфіденційності до отримання першого доступу.","indent":false},{"t":"p","text":"5.7. Підозра на витік повідомляється Andy Havryliuk протягом однієї години з моменту виявлення, незалежно від часу доби і впевненості в тому, що витік стався.","indent":false},{"t":"p","text":"5.8. Запит людини щодо її даних (доступ, виправлення, видалення) агент фіксує в HubSpot і передає Andy Havryliuk того ж дня. Агент сам не видаляє і не надає дані за таким запитом.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено приймати номери карток, банківських рахунків, CVV чи паролі клієнтів у будь-якому каналі. Якщо клієнт надіслав їх сам, агент не використовує дані, видаляє повідомлення, якщо канал це дозволяє, і направляє клієнта на інвойс Stripe.","indent":false},{"t":"p","text":"6.2. Заборонено вести ордери і листування з клієнтами в особистих акаунтах Telegram, WhatsApp чи інших месенджерів.","indent":false},{"t":"p","text":"6.3. Заборонено пересилати дані клієнтів на особисту пошту, в особисті хмари і на особисті пристрої без MDM.","indent":false},{"t":"p","text":"6.4. Заборонено вставляти дані клієнтів у публічні AI-сервіси (ChatGPT, Claude, Gemini тощо) з особистих акаунтів.","indent":false},{"t":"p","text":"6.5. Заборонено обговорювати конкретного клієнта чи водія з іменем у загальних каналах, де є люди без ролі для цього клієнта.","indent":false},{"t":"p","text":"6.6. Заборонено передавати дані одного клієнта іншому, зокрема телефон водія","indent":false},{"t":"p","text":"— клієнту без потреби для ордера, і контакти клієнта — партнеру понад те, що потрібно для виконання.","indent":false},{"t":"p","text":"6.7. Заборонено передавати дані третім сторонам (страховики, юристи, правоохоронці) без рішення Andy Havryliuk.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Заборона приймати платіжні дані діє в будь-якому режимі. Навіть при збої Stripe оплата не приймається іншим способом без рішення Billing.","indent":false},{"t":"p","text":"7.2. При відключенні світла та інтернету (SOP-E.4) експорт активних ордерів зберігається лише на робочому пристрої і видаляється після відновлення. Друк, фото екрана на особистий телефон і пересилання собі заборонені.","indent":false},{"t":"p","text":"7.3. Верифікація співрозмовника перед розкриттям даних ордера не пропускається через навантаження.","indent":false},{"t":"p","text":"7.4. Строк повідомлення про підозру на витік — одна година — діє в нічну зміну, вихідні і в режимі деградації за STD-10.","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Підозра на витік (дані надіслано не тому адресату, втрачено пристрій, виявлено доступ стороннього): агент негайно повідомляє Andy Havryliuk дзвінком і фіксує подію. Самостійно клієнту про витік не повідомляє.","indent":false},{"t":"p","text":"8.2. Запит людини щодо її даних або вимога видалити: передається Andy Havryliuk за POL-08 того ж дня.","indent":false},{"t":"p","text":"8.3. Запит від третьої сторони (страховик, юрист, поліція, державний орган): агент не підтверджує і не заперечує наявність даних, передає Andy Havryliuk.","indent":false},{"t":"p","text":"8.4. Виявлено дані клієнтів поза системами компанії (особистий чат, особиста пошта): повідомляється Oksana і Andy Havryliuk. Дані не видаляються самостійно до рішення, бо можуть підпадати під юридичне утримання за POL-12.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із заборони на платіжні дані (п. 6.1) немає.","indent":false},{"t":"p","text":"9.2. Тимчасове використання каналу поза REG-12 (наприклад, клієнт працює лише через WhatsApp) затверджує Andy Havryliuk письмово. Виняток фіксується в REG-04 зі строком дії, і канал додається в REG-12 або закривається до кінця строку.","indent":false},{"t":"p","text":"9.3. Будь-яке інше відхилення затверджує лише Andy Havryliuk і фіксується в REG-04.","indent":false},{"t":"h","text":"10. Відповідальність"},{"t":"p","text":"10.1. Andy Havryliuk: власник політики, правова підстава обробки, рішення щодо витоків, запитів людей і третіх сторін, договірні умови з Netcor.","indent":false},{"t":"p","text":"10.2. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"10.3. Oksana: впровадження в CS, підписання зобовʼязань командою, контроль того, що дані живуть у системах компанії.","indent":false},{"t":"p","text":"10.4. IT: технічне забезпечення за POL-04, ведення REG-12.","indent":false},{"t":"p","text":"10.5. Агент: фіксація даних лише в системах компанії, верифікація співрозмовника, повідомлення про підозру на витік протягом години.","indent":false},{"t":"h","text":"11. Повʼязані документи"},{"t":"p","text":"11.1. Політики: POL-01 (запис розмов), POL-04 (доступи і безпека), POL-08 (ескалація), POL-09 (комунікація, Order chat), POL-11 (AI-інструменти), POL-12 (зберігання і видалення), POL-18 (оплата Stripe).","indent":false},{"t":"p","text":"11.2. Стандарти: STD-10 (деградація), STD-13 (строки зберігання).","indent":false},{"t":"p","text":"11.3. Процеси і процедури: PRC-E.2 (доступи), SOP-1.4 (верифікація клієнта), SOP-6.1 і SOP-6.7 (видача і відкликання доступів), SOP-E.4 (відключення світла).","indent":false},{"t":"p","text":"11.4. Записи: REG-04 (винятки), REG-12 (доступи та інструменти).","indent":false},{"t":"h","text":"12. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"12.1. Яке право застосовується: законодавство штатів США, PIPEDA (Канада), українське законодавство щодо команди. Чи досягає Freitty порогів державних законів США про приватність. Відповідає Andy Havryliuk з юристом.","indent":true},{"t":"p","text":"12.2. Чи є в договорі з Netcor умови щодо конфіденційності й обробки даних. Відповідає Andy Havryliuk.","indent":true},{"t":"p","text":"12.3. Telegram-чати ордерів в особистих акаунтах уже існують (той самий блокер, що в POL-12). Потрібне рішення: перенесення в робочі акаунти чи закриття каналу. Відповідає Andy Havryliuk і Oksana.","indent":true},{"t":"p","text":"12.4. Транскрипти з іменами клієнтів уже проходять через зовнішні AI-сервіси (той самий блокер, що в POL-11). Політика буде порушена в момент затвердження без рішення щодо вже переданих даних.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"12.5. Чи потрібно повідомлення про обробку даних (privacy notice) на сайті і в Instabook, і хто його веде.","indent":true},{"t":"p","text":"12.6. Перелік даних водіїв, які CS реально запитує: чи потрібні номер посвідчення і фото, чи достатньо імені й телефону.","indent":true},{"t":"p","text":"12.7. SOP-1.4 (верифікація клієнта) ще не створено — п. 5.2 поки не виконуваний.","indent":true},{"t":"h","text":"13. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.1","08.11.2026","Oksana","Перший драфт як структура. Позиція: мінімум даних, лише системи компанії, доступ за роллю, CS не обробляє платіжні дані. Юридична перевірка не проведена."]]}]},"POL-03":{"code":"POL-03","title":"Політика ціноутворення і розкриття зборів","source":"pdf","meta":{"Код":"POL-03","Рівень":"L1 Політика","Зона":"Комерція","Tier":"0 — критичний","Власник":"Andrew Cherniavskyi","Узгоджує":"Andy Havryliuk (правовий бік розкриття)","Підготувала":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.6","Перегляд":"Раз на рік або при зміні прайсу, способу оплати чи переліку послуг"},"status":"Чернетка","version":"0.6","date":null,"blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-03"],["Рівень","L1 Політика"],["Зона","Комерція"],["Tier","0 — критичний"],["Власник","Andrew Cherniavskyi"],["Узгоджує","Andy Havryliuk (правовий бік розкриття)"],["Підготувала","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.6"],["Перегляд","Раз на рік або при зміні прайсу, способу оплати чи переліку послуг"]],"passport":true},{"t":"p","text":"1.1. Версію 0.6 написано заново в L1-форматі. Текст драфту 0.5 до цієї версії не залучено — його зміст звіряється при узгодженні (розділ 13).","indent":false},{"t":"p","text":"1.2. Питання двох власників закрито: власник один, правовий бік розкриття узгоджує Andy Havryliuk.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Клієнт знає повну суму до того, як погоджується. Кожен збір, який може зʼявитися в інвойсі, названо до підтвердження замовлення, а не після виконання.","indent":false},{"t":"p","text":"2.2. Кожна названа клієнту ціна має джерело: прайс у Freitty Hub, оцінку локації або квоту transport team. Ціна з памʼяті агента чи «як минулого разу» джерелом не є.","indent":false},{"t":"p","text":"2.3. Неочікуваний рядок в інвойсі коштує дорожче за сам збір: він створює скаргу, оскарження платежу через банк і втрату клієнта. Політика прибирає це джерело звернень, а не вчить на нього відповідати.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на всі послуги, які CS продає або підтверджує: cross-dock, reload, storage, restack/rework, транспорт (delivery, pick up), а також додаткові послуги та збори до них.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, хто називає клієнту ціну: агентів CS, команду ключових клієнтів, Customer Experience Specialist, Netcor і transport team у частині квот.","indent":false},{"t":"p","text":"3.3. Політика поширюється на всі канали: дзвінок, email, Order chat, Telegram, Teams, лист-підтвердження та інвойс.","indent":false},{"t":"p","text":"3.4. Політика НЕ встановлює самі ціни і тарифи. Їх встановлює Andrew Cherniavskyi у прайсі Freitty Hub.","indent":false},{"t":"p","text":"3.5. Політика НЕ визначає способи оплати, комісії платіжної системи, умови скасування і повернення. Це POL-18 і STD-16.","indent":false},{"t":"p","text":"3.6. Політика НЕ визначає, які знижки і компенсації може дати агент. Це STD-09.","indent":false},{"t":"p","text":"3.7. Політика НЕ визначає індивідуальні умови ключових клієнтів. Це POL-20; ця політика лише вимагає, щоб такі умови були записані.","indent":false},{"t":"h","text":"4. Позиція компанії"},{"t":"p","text":"4.1. Ціна в Freitty має три режими, і кожен має одне джерело.","indent":false},{"t":"table","rows":[["Режим","Послуги","Джерело ціни","Коли клієнт чує ціну"],["Миттєва","Cross-dock, reload, storage","Прайс Freitty Hub по локації","Під час дзвінка"],["Після огляду","Restack, rework","Оцінка локації після огляду вантажу","До початку робіт, письмово"],["Відкладена","Транспорт (delivery, pick up)","Квота transport team","Після квоти, письмово"]]},{"t":"p","text":"4.2. Розкриття — це повна сума, а не базова ставка. Ставка за паллету без названих зборів не вважається розкритою ціною, якщо збори можуть зʼявитися.","indent":false},{"t":"p","text":"4.3. Збір існує лише тоді, коли він є в прайсі Freitty Hub з назвою, сумою або формулою і умовою, за якої застосовується. Збір, якого немає в прайсі, клієнту не виставляється.","indent":false},{"t":"p","text":"4.4. Якщо ціну неможливо назвати остаточно до виконання (restack, транспорт), клієнт отримує письмово, від чого залежить ціна і що він погодить її до початку робіт. Робота понад погоджене не починається без нового погодження (POL-18).","indent":false},{"t":"p","text":"4.5. Індивідуальна ціна для клієнта можлива, але лише записана: у REG-09 або картці клієнта TPL-14, з тим, хто її погодив. Усна домовленість про ціну не існує для білінгу.","indent":false},{"t":"p","text":"4.6. Однакова послуга за однакових умов коштує однаково для всіх клієнтів без індивідуальних умов. Агент не змінює ціну за відчуттям від розмови.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Агент бере ціну лише з джерела за режимом (п. 4.1) і в момент розмови, а не з памʼяті чи попереднього ордера.","indent":false},{"t":"p","text":"5.2. До підтвердження замовлення агент називає всі збори, які можуть застосуватися до цього замовлення за його умовами: after-hours, понаднормове зберігання, додаткові паллети, очікування тощо — за переліком у прайсі.","indent":false},{"t":"p","text":"5.3. Агент робить recap перед підтвердженням: послуга, дата, кількість, ставка, можливі збори, умова передплати. Recap звучить у дзвінку і повторюється письмово.","indent":false},{"t":"p","text":"5.4. Лист-підтвердження (TPL-02) містить ставку і кожен можливий збір окремим рядком. Збір не ховається в примітці чи посиланні.","indent":false},{"t":"p","text":"5.5. Для режиму «після огляду» оцінка локації передається клієнту письмово в Order chat або email і погоджується ним до початку робіт (SOP-3.7).","indent":false},{"t":"p","text":"5.6. Для режиму «відкладена» агент не називає ціну до квоти. Він називає строк, коли клієнт отримає квоту, і тримає клієнта в курсі за STD-18.","indent":false},{"t":"p","text":"5.7. Перед інвойсом клієнт отримує склад позицій (SOP-3.6). Позиція без підстави в погодженні до інвойса не потрапляє.","indent":false},{"t":"p","text":"5.8. Про зміну прайсу Andrew Cherniavskyi повідомляє CS до дати набуття чинності. Нова ціна не застосовується до вже підтверджених замовлень.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено вигадувати або «прикидати» ціну. Якщо джерела немає під рукою, агент називає строк, коли повідомить ціну, а не орієнтовну цифру.","indent":false},{"t":"p","text":"6.2. Заборонено називати ціну на транспорт до квоти transport team, зокрема «приблизно» чи «зазвичай».","indent":false},{"t":"p","text":"6.3. Заборонено розкривати збір уперше після підтвердження замовлення або в інвойсі.","indent":false},{"t":"p","text":"6.4. Заборонено виставляти збір, якого немає в прайсі Freitty Hub, або за умови, яку не названо клієнту.","indent":false},{"t":"p","text":"6.5. Заборонено змінювати ціну чи давати знижку поза межами STD-09 і поза записаними індивідуальними умовами.","indent":false},{"t":"p","text":"6.6. Заборонено вказувати ціни, ставки і комісії в скриптах і шаблонах як константи. Скрипт містить змінну [PRICE], сума береться з джерела.","indent":false},{"t":"p","text":"6.7. Заборонено називати клієнту способи оплати, відмінні від Stripe (POL-18), і пропонувати оплату на локації.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Розкриття всіх можливих зборів до підтвердження не пропускається через навантаження, нічну зміну чи режим деградації за STD-10.","indent":false},{"t":"p","text":"7.2. Якщо Freitty Hub недоступний і ціну перевірити неможливо, замовлення не підтверджується з ціною з памʼяті. Клієнт отримує строк, коли ціну буде підтверджено.","indent":false},{"t":"p","text":"7.3. Запис погодженої ціни в ордері зберігається в будь-якому режимі. Ордер без запису ціни не передається в білінг.","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Клієнт оскаржує збір, який, на його думку, не було розкрито: агент не підтверджує і не скасовує збір, а перевіряє запис розмови, лист-підтвердження і Order chat. Якщо розкриття не підтверджується документами, ситуація передається за POL-08 і STD-09.","indent":false},{"t":"p","text":"8.2. У прайсі немає ставки або збору для ситуації, що виникла: агент не вигадує суму, а запитує Andrew Cherniavskyi. Поза годинами — повідомляє клієнту строк відповіді.","indent":false},{"t":"p","text":"8.3. Оцінка локації (restack) суттєво відрізняється від очікувань клієнта або від звичної для цієї локації: передається Andrew Cherniavskyi до погодження з клієнтом.","indent":false},{"t":"p","text":"8.4. Клієнт посилається на ціну, названу раніше іншим співробітником, і її немає в записах: передається Andrew Cherniavskyi. Агент не підтверджує і не заперечує таку ціну.","indent":false},{"t":"p","text":"8.5. Оскарження платежу через банк (chargeback) через нерозкритий збір передається Andy Havryliuk і Billing того ж дня.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із розкриття зборів до підтвердження (п. 5.2, 6.3) немає.","indent":false},{"t":"p","text":"9.2. Індивідуальна ціна для клієнта не є винятком, якщо вона записана за п. 4.5.","indent":false},{"t":"p","text":"9.3. Разове відхилення від прайсу затверджує Andrew Cherniavskyi письмово. Воно фіксується в REG-04 з номером ордера; повторне таке відхилення для того самого клієнта означає, що потрібна індивідуальна умова за п. 4.5.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи отримав клієнт інвойс, якого очікував, а не кількістю названих цін.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Інвойси без оскарженого збору","Частка інвойсів за місяць, де клієнт не оскаржив жоден рядок збору","Встановлює власник після 3 місяців вимірювання"],["Повне розкриття до підтвердження","Частка підтверджень у вибірці (запис розмови + TPL-02), де названо всі збори, що потім зʼявилися в інвойсі","100%"],["Розбіжність ціни","Частка ордерів, де сума в інвойсі відрізняється від погодженої без нового погодження","0%"],["Оскарження платежу через нерозкритий збір","Кількість chargeback за місяць, причиною яких є збір","0"],["Звернення про ціну на ордер","Частка звернень із причиною «ціна / збір» за класифікатором STD-07 до кількості ордерів","Без цілі; має знижуватися"]]},{"t":"p","text":"10.2. Останній показник — це CPX за однією причиною. Кожне таке звернення означає, що ціна була незрозумілою або неочікуваною, тобто клієнт звертається через нашу ваду, а не через свою потребу.","indent":false},{"t":"p","text":"10.3. Показники з ціллю 0% і 100% описують норму: кожне відхилення є подією для розбору за SOP-4.8, а не відсотком, який терплять.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Andrew Cherniavskyi: власник політики, прайс і перелік зборів у Freitty Hub, рішення за розділами 8 і 9, повідомлення CS про зміни прайсу.","indent":false},{"t":"p","text":"11.2. Andy Havryliuk: узгодження правового боку розкриття, рішення щодо оскаржень платежів.","indent":false},{"t":"p","text":"11.3. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"11.4. Oksana: впровадження в CS, відповідність скриптів і шаблонів політиці, контроль розкриття через вибірку записів.","indent":false},{"t":"p","text":"11.5. Transport team: квота з повною сумою і переліком можливих зборів, письмово.","indent":false},{"t":"p","text":"11.6. Агент: ціна з джерела, розкриття всіх зборів до підтвердження, recap і лист-підтвердження.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-06 (обслуговування клієнта), POL-08 (ескалація), POL-18 (передплата, скасування, повернення), POL-20 (ключові клієнти).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-09 (ліміти повноважень), STD-10 (деградація), STD-16 (Stripe, комісії), STD-18 (оновлення клієнту).","indent":false},{"t":"p","text":"12.3. Процеси і процедури: PRC-2.0 (Lead-to-Order), SOP-2.5 (котирування і розкриття зборів), SOP-3.6 (закриття і передача в білінг), SOP-3.7 (розбіжність обсягу робіт).","indent":false},{"t":"p","text":"12.4. Шаблони і записи: TPL-01 (скрипти дзвінка), TPL-02 (лист-підтвердження), TPL-14 (картка ключового клієнта), TPL-15 (склад позицій до інвойса), REG-04 (винятки), REG-09 (ключові клієнти).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. Чи є в Freitty Hub перелік зборів з назвою, сумою і умовою застосування (п. 4.3). Якщо ні — п. 5.2 не виконуваний, агент не може назвати те, чого ніде немає. Відповідає Andrew Cherniavskyi.","indent":true},{"t":"p","text":"13.2. Скрипти суперечать POL-18. Storage: «we'll request payment at the warehouse for the reload». Restack: «prepaid at the warehouse… they'll give you the estimate». Обидва пропонують оплату на локації замість Stripe. Додається до правки TPL-01.","indent":true},{"t":"p","text":"13.3. Звірити з драфтом 0.5: що з нього не потрапило у v0.6. Відповідає Oksana.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.4. Чи містить квота transport team перелік можливих зборів (очікування, after-hours, додаткова зупинка), чи лише базову суму.","indent":true},{"t":"p","text":"13.5. Чи потрібні умови розкриття (terms) на сайті та в Instabook для клієнтів, які замовляють самостійно без агента.","indent":true},{"t":"p","text":"13.6. SOP-2.5 у чернетці 0.5 — звірити з п. 5.1–5.4 цієї політики.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.6","08.11.2026","Oksana","Переписано в L1-форматі. Один власник — Andrew Cherniavskyi, узгоджує Andy Havryliuk. Три режими ціни, повна сума до підтвердження, збір існує лише в прайсі. Виявлено суперечності скриптів Storage і Restack із POL-18. Додано розділ 10 «Показники результату», розділи 10–13 перенумеровано на 11–14."],["0.5","—","Oksana","Драфт на основі скриптів."]]}]},"POL-04":{"code":"POL-04","title":"Політика доступів і безпеки","source":"pdf","meta":{"Код":"POL-04","Рівень":"L1 Політика","Зона":"Право і безпека","Tier":"0 — критичний","Власник":"Andy Havryliuk","Виконання":"IT (SOP-6.1, SOP-6.7, REG-12)","Підготувала":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.1","Перегляд":"Раз на рік, при підключенні нової системи або після інциденту доступу"},"status":"Чернетка","version":"0.1","date":null,"blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-04"],["Рівень","L1 Політика"],["Зона","Право і безпека"],["Tier","0 — критичний"],["Власник","Andy Havryliuk"],["Виконання","IT (SOP-6.1, SOP-6.7, REG-12)"],["Підготувала","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.1"],["Перегляд","Раз на рік, при підключенні нової системи або після інциденту доступу"]],"passport":true},{"t":"p","text":"1.1. Політика визначає, ЩО має бути правдою про доступи. Як саме це виконується в кожній системі — PRC-E.2, SOP-6.1, SOP-6.7 і WI-01…WI-07.","indent":false},{"t":"p","text":"1.2. Документ написано так, щоб його міг виконувати не лише IT, а й автоматизований агент: доступ має закритий перелік станів, кожен перехід має тригер, виконавця і строк.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. У кожен момент компанія може відповісти на три питання: хто має доступ до якої системи, на якій підставі і до коли. Доступ, про який ніхто не знає, неможливо відкликати.","indent":false},{"t":"p","text":"2.2. Людина, яка пішла з компанії або змінила роль, втрачає доступ, що їй більше не потрібен, у той самий день, а не «коли згадаємо».","indent":false},{"t":"p","text":"2.3. Компрометація одного акаунта не дає доступу до даних усіх клієнтів.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на всі системи, через які CS працює з клієнтами, ордерами чи даними: HubSpot, Freitty Hub, Dialpad, Outlook і спільні скриньки, Teams, Telegram (робочі акаунти), ClickUp, Notion, Google Drive, Stripe (у частині доступу CS), а також на будь-яку нову систему з дня її підключення.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, хто отримує доступ для роботи CS: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist, Netcor і тимчасових людей.","indent":false},{"t":"p","text":"3.3. Повний перелік систем і доступів веде REG-12. Система, якої немає в REG-12, вважається невідомою (п. 4.4).","indent":false},{"t":"p","text":"3.4. Політика НЕ визначає, які дані можна обробляти і де їх зберігати. Це POL-02.","indent":false},{"t":"p","text":"3.5. Політика НЕ визначає порядок натискань у кожній системі. Це SOP-6.1, SOP-6.7 і WI-01…WI-07.","indent":false},{"t":"p","text":"3.6. Політика НЕ регулює доступ до систем поза контуром CS (бухгалтерія, розробка), крім випадків, коли співробітник CS має такий доступ.","indent":false},{"t":"h","text":"4. Позиція компанії: стани доступу"},{"t":"p","text":"4.1. Кожен доступ у будь-який момент перебуває рівно в одному з пʼяти станів. Стан фіксується в REG-12.","indent":false},{"t":"table","rows":[["Стан","Що означає","Як потрапляє в стан","Хто переводить","Строк"],["Запитано","Є заявка з роллю і системою","Заявка керівника за SOP-6.1","Керівник","—"],["Активний","Доступ видано і записано в REG-12","Видача після підпису зобовʼязань (POL-02 п. 5.6)","IT","До першої зміни людини"],["Призупинено","Доступ заблоковано, акаунт збережено","Підозра на компрометацію, тривала відсутність понад 30 днів, доступ без запису в REG-12","IT негайно після тригера","У день тригера"],["Змінено","Роль змінилась, права переглянуто","Зміна ролі","IT за заявкою керівника","У день зміни ролі"],["Відкликано","Доступу немає, акаунт закрито або передано","Вихід людини, завершення договору з підрядником","IT за SOP-6.7","У день виходу, до кінця останньої зміни"]]},{"t":"p","text":"4.2. Доступ надається за роллю, а не за людиною. Роль визначає набір систем і прав; людина отримує набір своєї ролі і нічого понад нього.","indent":false},{"t":"p","text":"4.3. Мінімально необхідний доступ. Права адміністратора в системі має не більше двох людей, і жоден з них не є агентом на лінії.","indent":false},{"t":"p","text":"4.4. Доступ, знайдений у системі без запису в REG-12, переводиться в стан «Призупинено», а не легалізується записом заднім числом.","indent":false},{"t":"p","text":"4.5. Кожен акаунт персональний. Спільний логін на кількох людей не існує, крім спільних скриньок, де доступ видається кожній людині окремо.","indent":false},{"t":"p","text":"4.6. Вхід у кожну систему, яка це підтримує, захищений двофакторною автентифікацією (MFA).","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Керівник людини подає заявку на доступ за SOP-6.1 із зазначенням ролі. Доступ без заявки не видається.","indent":false},{"t":"p","text":"5.2. IT видає доступ лише після підпису зобовʼязань щодо конфіденційності та ознайомлення з POL-01 і POL-02.","indent":false},{"t":"p","text":"5.3. Про вихід людини або завершення договору з підрядником керівник повідомляє IT не пізніше ніж за один робочий день. При виході з конфліктом — відкликання виконується ДО повідомлення людині.","indent":false},{"t":"p","text":"5.4. При відкликанні доступ до спільних скриньок, груп Teams і Telegram-чатів ордерів відкликається окремо від персональної пошти. Це найчастіше пропущений пункт.","indent":false},{"t":"p","text":"5.5. Раз на квартал IT і Oksana звіряють REG-12 з фактичними користувачами в кожній системі. Розбіжність усувається за п. 4.4.","indent":false},{"t":"p","text":"5.6. Співробітник негайно повідомляє IT про втрату пристрою, підозру на зламаний пароль або отримання коду MFA, якого він не запитував.","indent":false},{"t":"p","text":"5.7. Нова система підключається до роботи CS лише після запису в REG-12 з власником системи і переліком ролей.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено передавати свій логін, пароль чи код MFA будь-кому, зокрема колезі на зміні «на хвилинку».","indent":false},{"t":"p","text":"6.2. Заборонено працювати в системах CS під чужим акаунтом, навіть з дозволу власника акаунта.","indent":false},{"t":"p","text":"6.3. Заборонено зберігати паролі у відкритому вигляді: у чатах, нотатках, таблицях, на папірці біля робочого місця.","indent":false},{"t":"p","text":"6.4. Заборонено видавати доступ «тимчасово» без запису в REG-12 і без строку дії.","indent":false},{"t":"p","text":"6.5. Заборонено залишати активним доступ людини після її виходу, зокрема «на випадок питань» або для передачі справ.","indent":false},{"t":"p","text":"6.6. Заборонено підключати до роботи з даними клієнтів сторонні застосунки, розширення браузера та інтеграції без запису в REG-12.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Відкликання доступу при виході виконується в день виходу в будь-якому режимі роботи, зокрема у вихідні та в нічну зміну.","indent":false},{"t":"p","text":"7.2. При відключенні світла та інтернету (SOP-E.4) перехід на резервний пристрій чи мобільний інтернет не скасовує персональних акаунтів і MFA. Робота під чужим акаунтом не допускається навіть у кризі.","indent":false},{"t":"p","text":"7.3. Призупинення доступу при підозрі на компрометацію не чекає підтвердження: спершу блокування, потім зʼясування.","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Підозра на компрометацію акаунта, втрата пристрою, підозріла активність: співробітник дзвонить IT негайно. Якщо IT недоступний протягом 15 хвилин — дзвонить Andy Havryliuk. Подія фіксується в REG-07.","indent":false},{"t":"p","text":"8.2. Виявлено доступ без запису в REG-12 або доступ людини, що пішла: IT призупиняє доступ і повідомляє Andy Havryliuk і Oksana того ж дня.","indent":false},{"t":"p","text":"8.3. Компрометація, що могла торкнутися даних клієнтів, обробляється також як підозра на витік за POL-02 п. 5.7 — повідомлення протягом години.","indent":false},{"t":"p","text":"8.4. Керівник вимагає доступ понад набір ролі: рішення приймає Andy Havryliuk, рішення фіксується в REG-04.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із персональності акаунтів (п. 4.5, 6.1, 6.2) і з відкликання в день виходу (п. 7.1) немає.","indent":false},{"t":"p","text":"9.2. Система, яка технічно не підтримує MFA, допускається лише за письмовим рішенням Andy Havryliuk із записом у REG-12 і REG-04 та планом заміни.","indent":false},{"t":"p","text":"9.3. Доступ понад набір ролі видається на строк не довше 30 днів, фіксується в REG-04 і автоматично повертається до набору ролі після строку.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи правдивий REG-12, а не кількістю виданих доступів.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Відкликання в день виходу","Частка виходів, де всі доступи відкликано до кінця останньої зміни","100%"],["Точність REG-12","Частка фактичних акаунтів, що збігаються з REG-12 при квартальній звірці","100%; кожна розбіжність — подія за п. 4.4"],["Покриття MFA","Частка систем із REG-12, де MFA увімкнено для всіх користувачів CS","100% або виняток за п. 9.2"],["Доступи понад роль","Кількість активних винятків за п. 9.3 на дату звірки","Без цілі; зростання — сигнал, що набір ролі неправильний"]]},{"t":"p","text":"10.2. Цілі 100% тут не є амбіцією, а описом норми: кожне відхилення є подією, яку розбирають, а не відсотком, який терплять.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Andy Havryliuk: власник політики, рішення за розділами 8 і 9, розслідування інцидентів доступу.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"11.3. IT: видача, зміна, призупинення і відкликання доступів, ведення REG-12, налаштування MFA.","indent":false},{"t":"p","text":"11.4. Oksana: заявки і повідомлення про вихід по команді CS, квартальна звірка разом з IT, контроль доступів Netcor.","indent":false},{"t":"p","text":"11.5. Керівник людини: заявка з роллю, повідомлення про зміну ролі або вихід у строк.","indent":false},{"t":"p","text":"11.6. Співробітник: персональність акаунта, MFA, негайне повідомлення про підозру.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-01 (запис розмов), POL-02 (персональні дані), POL-11 (AI-інструменти), POL-12 (зберігання і видалення).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-10 (деградація), STD-13 (строки зберігання).","indent":false},{"t":"p","text":"12.3. Процеси і процедури: PRC-E.2 (управління доступами та інструментами), PRC-E.3 (безперервність), SOP-6.1 (видача доступів), SOP-6.7 (відкликання при виході), SOP-E.4 (відключення світла).","indent":false},{"t":"p","text":"12.4. Інструкції та записи: WI-01…WI-07, REG-04 (винятки), REG-07 (технічні збої), REG-12 (доступи та інструменти).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. Хто конкретно є «IT» для CS: названа людина і резерв. Без цього п. 7.1 і 8.1 не мають адресата. Відповідає Андрій Кулик.","indent":true},{"t":"p","text":"13.2. Аркуш «Доступи» в REG-12 порожній. Потрібна первинна інвентаризація всіх акаунтів CS по всіх системах — до затвердження, інакше п. 4.4 призупинить половину команди в перший день.","indent":true},{"t":"p","text":"13.3. Telegram-чати ордерів в особистих акаунтах (той самий блокер, що в POL-02 і POL-12): особистий акаунт неможливо відкликати при виході.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.4. Які системи підтримують MFA на поточних тарифах (HubSpot Starter, Dialpad, Freitty Hub).","indent":true},{"t":"p","text":"13.5. Чи є в договорі з Netcor умова про персональні акаунти і повідомлення про вихід їхніх людей.","indent":true},{"t":"p","text":"13.6. Ролі CS з наборами систем: Sales & Service Representative, Key Clients Representative, CX Specialist, Head of Customer Support, Netcor. Визначаються в PRC-E.2.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.1","08.11.2026","Oksana","Перший драфт. П’ять станів доступу з тригерами і строками, доступ за роллю, відкликання в день виходу. Додано розділ показників результату."]]}]},"POL-05":{"code":"POL-05","title":"Політика безперервності роботи (BCP)","source":"pdf","meta":{"Код":"POL-05","Рівень":"L1 Політика","Зона":"Стійкість","Tier":"0 — критичний","Власник":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.3","Перегляд":"Раз на рік, після кожного збою рівня «Криза» або при зміні складу змін"},"status":"Чернетка","version":"0.3","date":"Nov 8, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-05"],["Рівень","L1 Політика"],["Зона","Стійкість"],["Tier","0 — критичний"],["Власник","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.3"],["Перегляд","Раз на рік, після кожного збою рівня «Криза» або при зміні складу змін"]],"passport":true},{"t":"p","text":"1.1. Версію 0.3 написано заново в L1-форматі. Дві позиції драфту 0.2 збережено: клієнт отримує наслідок для свого вантажу, а не причину збою; рішення про розкриття причини і паузу на прийом замовлень приймає CS супервайзер. Решту тексту 0.2 треба звірити (розділ 13).","indent":false},{"t":"p","text":"1.2. Особливість Freitty: команда працює з України, клієнти — у США і Канаді. Найімовірніші збої — відключення світла, інтернету, повітряна тривога — відбуваються на боці команди, а клієнт про них не знає і не повинен знати.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Вантаж клієнта рухається, а клієнт отримує відповідь, навіть коли у команди немає світла, інтернету чи людей. Збій — подія для команди, а не для клієнта.","indent":false},{"t":"p","text":"2.2. Рішення в момент збою не вигадується, а вибирається з наперед визначених режимів. Хто оголошує режим, що робиться і як повертатися назад — відомо до збою.","indent":false},{"t":"p","text":"2.3. Політика встановлює рамку. Конкретні дії по кожному типу збою — у PRC-E.3, SOP-E.x і STD-10.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на всі збої, що заважають CS приймати звернення, вести ордери або відповідати клієнтам: відключення світла та інтернету, недоступність систем (Dialpad, HubSpot, Freitty Hub, Outlook), повітряна тривога, різкий пік звернень, нестача людей на зміні.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, хто веде лінію CS: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist і Netcor.","indent":false},{"t":"p","text":"3.3. Політика НЕ визначає години роботи і покриття змін. Це STD-06.","indent":false},{"t":"p","text":"3.4. Політика НЕ описує дії по кожному типу збою. Це PRC-E.3, SOP-E.4 (відключення світла) і SOP-E.x для інших сценаріїв.","indent":false},{"t":"p","text":"3.5. Політика НЕ регулює збої на складах і в transport team (поломка навантажувача, відсутність водія). Це операційні інциденти за PRC-4.0; CS лише повідомляє клієнта за STD-18.","indent":false},{"t":"p","text":"3.6. Політика НЕ регулює інциденти доступу і витоки даних. Це POL-04 і POL-02.","indent":false},{"t":"h","text":"4. Позиція компанії: режими роботи"},{"t":"p","text":"4.1. Лінія CS у будь-який момент працює рівно в одному з трьох режимів. Поточний режим видно всій команді в робочому каналі зміни.","indent":false},{"t":"table","rows":[["Режим","Тригер","Хто оголошує","Що змінюється","Повернення"],["Норма","—","—","Робота за STD-06 і SLA","—"],["Деградація","Один агент або одна система недоступні понад 15 хв; черга понад норму STD-10; тривога, що зачіпає частину зміни","Будь-який агент на зміні, повідомляючи супервайзера","Пріоритет активних ордерів над новими лідами; скорочені відповіді за TPL-15; SLA за STD-10","Супервайзер, коли тригера немає 30 хв"],["Криза","Більшість зміни без звʼязку; недоступна телефонія або Freitty Hub понад 30 хв; деградація понад 2 год","CS супервайзер","Пауза на прийом нових замовлень (за рішенням супервайзера); лише вантажі в дорозі і на складі; повідомлення клієнтам з активними ордерами","Супервайзер; розбір за SOP-4.8 протягом 2 робочих днів"]]},{"t":"p","text":"4.2. Режим оголошується за тригером, а не за відчуттям. Агент, який бачить тригер, оголошує деградацію сам і не чекає дозволу.","indent":false},{"t":"p","text":"4.3. Клієнт отримує наслідок для свого вантажу, а не причину збою. «Ваш вантаж буде відвантажено о 14:00, підтвердження до 13:00» — так. «У нас немає світла» — ні.","indent":false},{"t":"p","text":"4.4. Рішення розкрити клієнту причину збою і рішення поставити паузу на прийом нових замовлень делеговано CS супервайзеру на зміні. Погодження з керівництвом для цього не потрібне — лише повідомлення після.","indent":false},{"t":"p","text":"4.5. Пріоритет у будь-якому режимі, крім норми: вантаж на складі або в дорозі → підтверджені ордери на сьогодні → звернення клієнтів з активними ордерами → нові ліди.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Кожен співробітник, який веде лінію, має резервне живлення і резервний інтернет на робочому місці або в погодженому місці роботи. Мінімальні вимоги","indent":false},{"t":"p","text":"— у PRC-E.3.","indent":false},{"t":"p","text":"5.2. На кожній зміні визначено супервайзера, який може оголосити кризу. Якщо супервайзер недоступний — повноваження переходять до наступного за списком у графіку зміни.","indent":false},{"t":"p","text":"5.3. Агент, який втратив звʼязок, повідомляє зміну протягом 5 хвилин з будь-якого доступного каналу (мобільний звʼязок, SMS). Його активні ордери забирає інший агент.","indent":false},{"t":"p","text":"5.4. При переході в деградацію чи кризу агент фіксує в Order chat активних ордерів, хто їх веде, щоб клієнт не залишився без відповідального.","indent":false},{"t":"p","text":"5.5. Кожен випадок кризи і кожна деградація понад 1 годину фіксуються в REG-07 з часом початку, тригером, рішеннями і часом повернення.","indent":false},{"t":"p","text":"5.6. Раз на квартал Oksana перевіряє готовність: тест переходу на резервний звʼязок, актуальність списку супервайзерів і контактів у PRC-E.3.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено пояснювати клієнту затримку відключенням світла, тривогою, війною чи місцем перебування команди без рішення супервайзера за п. 4.4.","indent":false},{"t":"p","text":"6.2. Заборонено обіцяти клієнту строк, якого команда не може виконати в поточному режимі. Краще пізніший строк, який виконано, ніж ранній, який зірвано.","indent":false},{"t":"p","text":"6.3. Заборонено мовчки «зникати» з лінії. Агент без звʼязку повідомляє зміну за п. 5.3, навіть якщо звʼязок, за його оцінкою, повернеться за хвилину.","indent":false},{"t":"p","text":"6.4. Заборонено ставити паузу на прийом замовлень без оголошеної кризи, зокрема «бо зараз завал».","indent":false},{"t":"p","text":"6.5. Заборонено обходити POL-02 і POL-04 в будь-якому режимі: працювати під чужим акаунтом, переносити дані клієнтів в особисті канали, записувати розмови поза Dialpad.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Відповідь клієнту, чий вантаж зараз на складі або в дорозі. Строк відповіді може зрости за STD-10, але відповідь не скасовується.","indent":false},{"t":"p","text":"7.2. Повідомлення клієнту з підтвердженим ордером, якщо строк по ньому зсувається. Клієнт дізнається про зсув від нас, а не на воротах складу.","indent":false},{"t":"p","text":"7.3. Розкриття зборів до підтвердження (POL-03), заборона приймати платіжні дані (POL-02), повідомлення про запис (POL-01) і персональність акаунтів (POL-04).","indent":false},{"t":"p","text":"7.4. Безпека людей. Під час повітряної тривоги співробітник іде в укриття; робота з укриття — лише якщо це безпечно і можливо. Жодний ордер не є причиною лишатися на місці.","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Деградація понад 2 години переходить у кризу автоматично. Супервайзер оголошує кризу або письмово фіксує в REG-07, чому ні.","indent":false},{"t":"p","text":"8.2. Криза понад 4 години або криза, що зачіпає ключових клієнтів: супервайзер повідомляє Oksana і команду ключових клієнтів (Andriy Pylypiv). Ключові клієнти отримують повідомлення від свого менеджера, а не від лінії.","indent":false},{"t":"p","text":"8.3. Криза понад 8 годин або одночасна недоступність більшості команди: Oksana повідомляє Андрія Кулика. Рішення про залучення Netcor понад графік або перерозподіл ордерів на інші команди — за Андрієм Куликом.","indent":false},{"t":"p","text":"8.4. Зрив підтвердженого ордера через збій на боці CS обробляється як інцидент за PRC-4.0 і STD-09; компенсація не обіцяється на лінії.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із п. 7.4 (безпека людей) немає.","indent":false},{"t":"p","text":"9.2. Розкриття причини збою клієнту не є винятком: це повноваження супервайзера за п. 4.4. Воно фіксується в REG-07 разом із кризою, а не в REG-04.","indent":false},{"t":"p","text":"9.3. Співробітник, який тимчасово не може забезпечити резервне живлення чи інтернет за п. 5.1, працює за винятком у REG-04 зі строком і планом. Такий співробітник не стоїть сам на зміні.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи помітив клієнт збій, а не тим, скільки збоїв було. Кількість відключень світла від команди не залежить; наслідок для клієнта — залежить.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Ордери, зірвані через збій CS","Кількість підтверджених ордерів, строк яких зірвано через збій на боці CS","0"],["Попередження про зсув","Частка ордерів зі зсувом строку під час збою, де клієнта повідомили до того, як він звернувся сам","100%"],["Дотримання SLA в деградації","Частка звернень, на які відповіли в межах SLA режиму деградації за STD-10","Встановлює власник після 3 місяців вимірювання"],["Час повернення до норми","Медіана від оголошення деградації до повернення в норму, за REG-07","Без цілі; має знижуватися"],["Звернення «де мій вантаж» під час збою","Частка таких звернень до кількості активних ордерів у період збою","Без цілі; кожне таке звернення означає, що клієнт дізнався про проблему не від нас"]]},{"t":"p","text":"10.2. Показники з ціллю 0 і 100% описують норму: кожне відхилення є подією для розбору за SOP-4.8.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, квартальна перевірка готовності, розбір кризових випадків, звʼязок з керівництвом при ескалації.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики, рішення за п. 8.3.","indent":false},{"t":"p","text":"11.3. CS супервайзер на зміні: оголошення кризи, пауза на прийом замовлень, рішення про розкриття причини, повернення до норми, запис у REG-07.","indent":false},{"t":"p","text":"11.4. Команда ключових клієнтів: повідомлення своїх клієнтів під час кризи.","indent":false},{"t":"p","text":"11.5. Агент: оголошення деградації за тригером, повідомлення про втрату звʼязку за 5 хвилин, резервне живлення і інтернет на робочому місці.","indent":false},{"t":"p","text":"11.6. Netcor: виконання режимів на тих самих умовах; умови залучення понад графік визначаються в договорі.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-01 (запис розмов), POL-02 (персональні дані), POL-03 (розкриття зборів), POL-04 (доступи), POL-06 (обслуговування клієнта), POL-20 (ключові клієнти).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-06 (години роботи і покриття), STD-09 (ліміти повноважень), STD-10 (деградація), STD-18 (оновлення клієнту).","indent":false},{"t":"p","text":"12.3. Процеси і процедури: PRC-4.0 (інциденти), PRC-E.3 (безперервність), SOP-4.8 (розбір), SOP-E.4 (відключення світла).","indent":false},{"t":"p","text":"12.4. Шаблони і записи: TPL-15 (операційні повідомлення клієнту), REG-04 (винятки), REG-07 (технічні збої).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. STD-06 і STD-10 ще в роботі, а пороги режимів у п. 4.1 (15 хв, 30 хв, 2 год) мають збігатися з ними. Політика затверджується після них або разом із ними.","indent":true},{"t":"p","text":"13.2. Хто є CS супервайзером на кожній зміні, зокрема нічній, і хто наступний за списком (п. 5.2). Без цього криза не має кому її оголосити.","indent":true},{"t":"p","text":"13.3. Звірити з драфтом 0.2: що з нього не потрапило у v0.3. Відповідає Oksana.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.4. Мінімальні вимоги до резервного живлення та інтернету (п. 5.1) і хто їх перевіряє — у PRC-E.3.","indent":true},{"t":"p","text":"13.5. Чи потрібен клієнтам із самостійним замовленням (сайт, Instabook) статус-банер під час паузи на прийом замовлень.","indent":true},{"t":"p","text":"13.6. Умови залучення Netcor понад графік під час кризи — договір.","indent":true},{"t":"p","text":"13.7. Збої інших команд (склад, transport team), що вимагають від CS кризового режиму, — чи потрібен окремий тригер.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.3","08.11.2026","Oksana","Переписано в L1-форматі. Три режими (норма, деградація, криза) з тригерами, хто оголошує і як повертатися. Збережено позиції 0.2 щодо наслідку замість причини і повноважень супервайзера. Додано показники результату."],["0.2","06.09.2026","Oksana","Прозовий драфт із нумерованими пунктами."]]}]},"POL-06":{"code":"POL-06","title":"Політика обслуговування клієнта (парасолькова)","source":"pdf","meta":{"Код":"POL-06","Рівень":"L1 Політика (парасолькова)","Зона":"Сервіс","Tier":"0 — критичний (на документ посилаються решта політик сервісної зони)","Власник":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.3","Перегляд":"Раз на рік або при зміні моделі обслуговування"},"status":"Чернетка","version":"0.3","date":"Nov 8, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-06"],["Рівень","L1 Політика (парасолькова)"],["Зона","Сервіс"],["Tier","0 — критичний (на документ посилаються решта політик сервісної зони)"],["Власник","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.3"],["Перегляд","Раз на рік або при зміні моделі обслуговування"]],"passport":true},{"t":"p","text":"1.1. Це парасолькова політика. Жодна інша політика, стандарт чи процедура сервісної зони не може суперечити розділам 4 і 5. При суперечності діє POL-06, а нижчий документ виправляється.","indent":false},{"t":"p","text":"1.2. Розділ 4 (позиція) — робоче формулювання. Воно замінюється баченням, яке команда виробить спільно (розділ 13). До того позиція чинна в цьому вигляді.","indent":false},{"t":"p","text":"1.3. Версію 0.3 написано заново в L1-форматі з урахуванням рішень драфту 0.2: обмежені повноваження агента з реєстрацією після факту, заборона розкривати дані carrier`ам, відмова від абсолютних обіцянок.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Фіксує базові зобовʼязання Freitty перед клієнтом і межі повноважень агента CS. Без цього кожен агент визначає рівень сервісу сам, а суперечності між процедурами нічим не розвʼязуються.","indent":false},{"t":"p","text":"2.2. Задає, за що оцінюється CS: не за кількість людей чи оброблених дзвінків, а за закриті операції — проведений вантаж і вирішене звернення.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на кожну взаємодію CS з клієнтом у будь-якому каналі, на всіх етапах: лід, замовлення, виконання, інцидент, закриття і білінг.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, хто говорить з клієнтом від імені CS: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist і Netcor.","indent":false},{"t":"p","text":"3.3. Політика НЕ встановлює числових норм (строки відповіді, ліміти, SLA). Норми живуть у STD, політика на них посилається.","indent":false},{"t":"p","text":"3.4. Політика НЕ описує послідовності кроків. Вони живуть у PRC і SOP.","indent":false},{"t":"p","text":"3.5. Окремі зони мають власні політики, які деталізують, але не змінюють цю: ціноутворення (POL-03), ескалація (POL-08), комунікація (POL-09), hazmat (POL-16), пошкодження і претензії (POL-17), передплата і повернення (POL-18), carrier`и і брокери (POL-19), ключові клієнти (POL-20).","indent":false},{"t":"h","text":"4. Позиція компанії"},{"t":"p","text":"4.1. Клієнт платить не за розмову з нами, а за закриту операцію. Звернення, яке клієнт вимушений зробити через нашу ваду, — це витрата, а не робота. Найкраще звернення — те, якого не знадобилося.","indent":false},{"t":"p","text":"4.2. Обіцяємо лише те, що можемо виконати, і виконуємо все, що пообіцяли. Чесне «ні» або пізніший строк краще за «так», яке зірветься.","indent":false},{"t":"p","text":"4.3. Агент має обмежені повноваження вирішити проблему сам. Ескалація є винятком, а не типовим шляхом. Агент не питає дозволу до, а фіксує після.","indent":false},{"t":"p","text":"4.4. У кожного звернення один власник від прийому до закриття. Клієнт не переказує історію вдруге і не ходить між людьми.","indent":false},{"t":"p","text":"4.5. Про проблему з вантажем клієнт дізнається від нас, а не на воротах складу. Клієнт отримує наслідок для свого вантажу і що ми робимо, а не причину збою на нашому боці.","indent":false},{"t":"p","text":"4.6. Однакова ситуація — однакове рішення для всіх клієнтів без записаних індивідуальних умов.","indent":false},{"t":"h","text":"5. Зобовʼязання перед клієнтом"},{"t":"p","text":"5.1. Відповідь у межах норми за класом звернення (STD-05, STD-07). Норма залежить від
