того, що стоїть на кону для вантажу, а не однакова для всіх.","indent":false},{"t":"p","text":"5.2. Перша відповідь вирішує звернення, якщо це в межах повноважень агента. Якщо ні — клієнт отримує імʼя відповідального і строк наступного оновлення.","indent":false},{"t":"p","text":"5.3. Наступне оновлення приходить у названий строк навіть тоді, коли новин немає (STD-18). «Ще працюємо, наступне оновлення о 15:00» — теж оновлення.","indent":false},{"t":"p","text":"5.4. Усі домовленості з клієнтом фіксуються письмово в Order chat (POL-09). Усна домовленість без письмового підтвердження не існує для виконання і білінгу.","indent":false},{"t":"p","text":"5.5. Час у кожному повідомленні клієнту вказується в часовому поясі клієнта або локації, з явною позначкою поясу.","indent":false},{"t":"p","text":"5.6. Клієнт знає повну суму до підтвердження (POL-03) і отримує склад позицій до інвойса.","indent":false},{"t":"p","text":"5.7. Звернення закривається, коли клієнт отримав результат, а не коли агент відповів.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено давати абсолютні обіцянки щодо результату, якого CS не контролює: «Absolutely, we handle that all the time», «гарантуємо», «100% буде вчасно». Обіцянка формулюється як дія, яку ми робимо, і строк, коли клієнт дізнається результат.","indent":false},{"t":"p","text":"6.2. Заборонено передавати клієнта між людьми без передачі контексту. Хто передає звернення, той пише в Order chat суть і що вже зроблено.","indent":false},{"t":"p","text":"6.3. Заборонено закривати звернення без результату для клієнта, зокрема за відсутністю відповіді від складу чи transport team.","indent":false},{"t":"p","text":"6.4. Заборонено повідомляти carrier`ам, брокерам і партнерським локаціям ціни, дані клієнта та операційні деталі понад потрібне для виконання ордера.","indent":false},{"t":"p","text":"6.5. Заборонено обвинувачувати клієнта, склад, водія чи колегу перед клієнтом. Клієнт отримує, що сталося з його вантажем і що ми робимо.","indent":false},{"t":"p","text":"6.6. Заборонено використовувати повноваження понад ліміт STD-09 і рішення з переліку п. 8.3 без ескалації.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Відповідь клієнту, чий вантаж зараз на складі або в дорозі (POL-05).","indent":false},{"t":"p","text":"7.2. Попередження клієнта про зсув строку підтвердженого ордера до того, як він дізнається сам.","indent":false},{"t":"p","text":"7.3. Письмова фіксація домовленостей в Order chat.","indent":false},{"t":"p","text":"7.4. Заборона абсолютних обіцянок (п. 6.1) — особливо під тиском, у пік і вночі, коли спокуса «заспокоїти» найбільша.","indent":false},{"t":"h","text":"8. Повноваження агента і ескалація"},{"t":"p","text":"8.1. Агент вирішує сам у межах ліміту свого рівня за STD-09: разова компенсація, списання збору, перенесення без штрафу, пріоритет ордера. Рівень залежить від допуску (SOP-6.4) і стажу без порушень.","indent":false},{"t":"p","text":"8.2. Кожне використане повноваження фіксується в REG-04 того ж дня: дата, клієнт, ордер, сума або рішення, причина. Раз на тиждень власник політики переглядає список; раз на квартал ліміти переглядаються за фактичними даними.","indent":false},{"t":"p","text":"8.3. Не делегується ніколи і завжди ескалюється:","indent":false},{"t":"p","text":"визнання відповідальності за пошкодження або втрату вантажу (POL-17); приймання спірного hazmat або вантажу поза умовами (POL-16); повернення передплати понад ліміт (POL-18); зміна умов договору чи terms; будь-яка заява з юридичним наслідком.","indent":true},{"t":"p","text":"8.4. Усе, що перевищує ліміт або входить у п. 8.3, ескалюється за POL-08. Клієнт отримує строк відповіді, а не «я уточню».","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із п. 8.3 немає.","indent":false},{"t":"p","text":"9.2. Індивідуальні умови ключового клієнта (POL-20) не є винятком, якщо вони записані в REG-09 або картці клієнта TPL-14.","indent":false},{"t":"p","text":"9.3. Будь-яке інше відхилення від розділу 5 затверджує власник політики письмово і фіксується в REG-04 зі строком дії.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Сервіс вимірюється закритими операціями, а не обсягом роботи. Кількість дзвінків і кількість агентів не є показниками цієї політики.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Resolution rate","Частка звернень, закритих з результатом для клієнта, до всіх звернень за період","Встановлює власник після 3 місяців вимірювання"],["FCR","Частка звернень, вирішених першим контактом без ескалації і повторного звернення","Встановлює власник; має зростати"],["Дотримання SLA","Частка звернень із відповіддю в межах норми класу за STD-05 і STD-07","За STD-05"],["CPX","Кількість звернень на один ордер","Без цілі; має знижуватися"],["Частка ескалацій","Частка звернень, переданих за POL-08, до всіх звернень","Без цілі; зростання — сигнал, що ліміти STD-09 замалі"]]},{"t":"p","text":"10.2. Показники інших політик сервісної зони (POL-03, POL-05) є частиною цього набору і рахуються за тими самими правилами.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, щотижневий перегляд REG-04, квартальний перегляд лімітів, узгодженість нижчих документів із цією політикою.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики і лімітів STD-09.","indent":false},{"t":"p","text":"11.3. CS супервайзер на зміні: рішення в межах свого рівня, прийом ескалацій від агентів зміни.","indent":false},{"t":"p","text":"11.4. Команда ключових клієнтів: виконання політики для своїх портфелів з урахуванням записаних індивідуальних умов.","indent":false},{"t":"p","text":"11.5. Агент: зобовʼязання розділу 5, повноваження в межах свого рівня, запис у REG-04 того ж дня.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-03 (ціноутворення), POL-05 (безперервність), POL-08 (ескалація), POL-09 (комунікація), POL-16 (hazmat), POL-17 (пошкодження і претензії), POL-18 (передплата і повернення), POL-19 (carrier`и і брокери), POL-20 (ключові клієнти).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-01, STD-02, STD-05 (норми відповіді), STD-06 (години роботи), STD-07 (класифікатор звернень), STD-09 (ліміти повноважень), STD-18 (оновлення клієнту).","indent":false},{"t":"p","text":"12.3. Процеси і процедури: PRC-4.0 (інциденти), PRC-8.0, SOP-S8.1, SOP-6.4 (допуск агента).","indent":false},{"t":"p","text":"12.4. Шаблони і записи: TPL-01 (скрипти), TPL-14 (картка ключового клієнта), REG-04 (винятки і використані повноваження), REG-09 (ключові клієнти).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. Ліміти STD-09: разовий ліміт, місячний бюджет, рівні агентів, безгрошові повноваження. Без них розділ 8 не виконуваний. Відповідає Андрій Кулик.","indent":true},{"t":"p","text":"13.2. STD-06 (години роботи і покриття) — від нього залежать норми відповіді в п. 5.1.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.3. Позиція (розділ 4) як бачення, вироблене командою. Сесія з командою за toolkit Service Culture Handbook.","indent":true},{"t":"p","text":"13.4. TPL-01 містить «Absolutely, we handle that all the time» — суперечить п. 6.1. Додати до правки TPL-01.","indent":true},{"t":"p","text":"13.5. FLAG-1 (Влад): точка передачі між CS і складом. FLAG-2: часовий пояс у нотатках HubSpot — звʼязано з п. 5.5. FLAG-4: SOP-S8 — звірити.","indent":true},{"t":"p","text":"13.6. Звірити з драфтом 0.2: що з нього не потрапило у v0.3. Відповідає Oksana.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.3","08.11.2026","Oksana","Переписано в L1-форматі. Позиція: клієнт платить за закриту операцію. Повноваження агента з реєстрацією після факту, перелік того, що не делегується. Додано показники результату: resolution rate, FCR, SLA, CPX."],["0.2","06.09.2026","Oksana","Прозовий драфт. Tier підвищено з 1 до 0."]]}]},"POL-07":{"code":"POL-07","title":"Політика обробки скарг","source":"pdf","meta":{"Код":"POL-07","Рівень":"L1 Політика","Зона":"Сервіс","Tier":"1 — операційний","Власник":"Oksana","Затверджує":"Андрій Кулик","Основа":"Принципи ISO 10002","Статус":"Чернетка, v0.4","Перегляд":"Раз на рік або за результатами квартального аналізу скарг"},"status":"Чернетка","version":"0.4","date":"Nov 8, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-07"],["Рівень","L1 Політика"],["Зона","Сервіс"],["Tier","1 — операційний"],["Власник","Oksana"],["Затверджує","Андрій Кулик"],["Основа","Принципи ISO 10002"],["Статус","Чернетка, v0.4"],["Перегляд","Раз на рік або за результатами квартального аналізу скарг"]],"passport":true},{"t":"p","text":"1.1. Версію 0.4 написано заново в L1-форматі. Рішення драфту 0.3 збережено: визначення скарги включає усну і непрямо висловлену; офіційний канал — claims@freitty.com на головній сторінці сайту; претензії щодо вантажу з цієї скриньки йдуть до Andy Havryliuk за POL-17.","indent":false},{"t":"p","text":"1.2. Скарга має закритий перелік станів (розділ 4), щоб її статус у будь-який момент був однозначним і для людини, і для автоматизованого агента.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Кожна скарга розпізнана, записана, має власника і закривається рішенням, яке клієнт отримав. Скарга, яку ніхто не записав, не існує для компанії, але існує для клієнта.","indent":false},{"t":"p","text":"2.2. Скарга — це безкоштовна діагностика. Кожна повторювана причина скарги має бути усунена в процесі, а не лише вирішена для одного клієнта.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Скарга — будь-який вираз незадоволення клієнта роботою Freitty, на який клієнт явно чи неявно очікує реакції. Слово «скарга» не потрібне. «Це вже втретє», «я дуже розчарований», «так не працюють» — скарга.","indent":false},{"t":"p","text":"3.2. Скарга може надійти будь-яким каналом: дзвінок, Order chat, email, Telegram, Teams, claims@freitty.com, відгук на сайті чи в соцмережах. Канал не змінює того, що це скарга.","indent":false},{"t":"p","text":"3.3. Політика поширюється на всіх, хто приймає звернення від клієнта: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist і Netcor.","indent":false},{"t":"p","text":"3.4. Претензія щодо пошкодження, втрати чи недостачі вантажу є скаргою, але її рішення по суті приймається за POL-17. Ця політика регулює прийом, запис і комунікацію з клієнтом.","indent":false},{"t":"p","text":"3.5. Оскарження інвойса чи збору є скаргою; рішення по суті — за POL-03 і POL-18.","indent":false},{"t":"p","text":"3.6. Звичайне питання чи прохання без незадоволення («де мій вантаж?» вперше) скаргою не є. Воно класифікується за STD-07.","indent":false},{"t":"p","text":"3.7. Політика НЕ встановлює строків. Строк реєстрації, першої відповіді і рішення","indent":false},{"t":"p","text":"— STD-11.","indent":false},{"t":"h","text":"4. Позиція компанії: стани скарги"},{"t":"p","text":"4.1. Кожна скарга в будь-який момент перебуває рівно в одному стані. Стан фіксується в REG-03.","indent":false},{"t":"table","rows":[["Стан","Що означає","Тригер переходу","Хто переводить","Строк"],["Зареєстровано","Скаргу записано в REG-03 з власником і класом","Агент розпізнав скаргу","Агент, який прийняв","STD-11"],["Підтверджено","Клієнт отримав підтвердження, що скаргу прийнято, імʼя власника і строк рішення","Запис у REG-03","Власник скарги","STD-11"],["У роботі","Власник збирає факти, рішення ще немає","Підтвердження надіслано","Власник скарги","До строку рішення"],["Рішення надано","Клієнт отримав рішення письмово","Рішення прийнято в межах повноважень (STD-09) або за ескалацією","Власник скарги","STD-11"],["Закрито","Клієнт прийняв рішення або не відповів протягом строку STD-11","Відповідь клієнта або закінчення строку","Власник скарги","—"],["Повторно відкрито","Клієнт не погодився з рішенням","Заперечення клієнта","Власник скарги, з ескалацією за розділом 8","STD-11"]]},{"t":"p","text":"4.2. Скарга не закривається з «У роботі» напряму. Закриття можливе лише після наданого рішення.","indent":false},{"t":"p","text":"4.3. Ставимося до скарги як до подарунка: клієнт, який скаржиться, дає нам шанс виправити, замість того щоб піти мовчки.","indent":false},{"t":"p","text":"4.4. Рішення по скарзі ґрунтується на фактах (запис розмови, Order chat, фото, документи), а не на тому, хто голосніше.","indent":false},{"t":"p","text":"4.5. Клієнт не повинен доводити, що скарга обґрунтована, щоб її записали. Обґрунтованість оцінюється в стані «У роботі», а запис — завжди.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Агент, який розпізнав скаргу, реєструє її в REG-03 сам, навіть якщо вирішив її в тій самій розмові. Вирішена скарга — теж дані.","indent":false},{"t":"p","text":"5.2. Власник скарги — агент, який її прийняв, якщо рішення в межах його повноважень (STD-09). Інакше власником стає той, кому скаргу ескальовано, і передача записується в REG-03.","indent":false},{"t":"p","text":"5.3. Клієнт отримує письмове підтвердження: скаргу прийнято, хто її веде, коли буде рішення.","indent":false},{"t":"p","text":"5.4. Рішення надається письмово і містить: що сталося з погляду фактів, що ми робимо для цього клієнта, що змінюємо, щоб не повторилося.","indent":false},{"t":"p","text":"5.5. Кожна скарга має клас за STD-07. Клас обирається за причиною, а не за тим, як клієнт її висловив.","indent":false},{"t":"p","text":"5.6. Раз на квартал власник політики аналізує REG-03: топ причин, повторні скарги, скарги без рішення в строк. Кожна причина з топу отримує власника усунення в процесі.","indent":false},{"t":"p","text":"5.7. Скарга, що надійшла на claims@freitty.com і стосується вантажу, пересилається Andy Havryliuk того ж дня і паралельно реєструється в REG-03.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено не реєструвати скаргу, бо вона «дрібна», «вже вирішена» або «клієнт просто емоційний».","indent":false},{"t":"p","text":"6.2. Заборонено сперечатися з клієнтом про те, чи має він право скаржитися.","indent":false},{"t":"p","text":"6.3. Заборонено закривати скаргу без наданого клієнту рішення.","indent":false},{"t":"p","text":"6.4. Заборонено обіцяти компенсацію чи визнавати відповідальність понад повноваження (STD-09, POL-06 п. 8.3) до рішення.","indent":false},{"t":"p","text":"6.5. Заборонено змінювати тон обслуговування клієнта, який скаржився, у гірший бік у наступних ордерах.","indent":false},{"t":"p","text":"6.6. Заборонено відповідати на публічний відгук (сайт, соцмережі) без погодження власника політики.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Реєстрація скарги в REG-03 — у будь-якому режимі роботи за POL-05. У кризі допускається запис мінімальних полів (клієнт, ордер, суть) з доповненням після повернення до норми.","indent":false},{"t":"p","text":"7.2. Підтвердження клієнту, що скаргу прийнято. Строк може зрости за STD-10, але підтвердження не скасовується.","indent":false},{"t":"p","text":"7.3. Передача претензії щодо вантажу Andy Havryliuk того ж дня — строки претензій мають юридичне значення.","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Рішення поза повноваженнями агента — за POL-08 на рівень, що має повноваження.","indent":false},{"t":"p","text":"8.2. Клієнт не погодився з рішенням (стан «Повторно відкрито»): скарга переходить на рівень вище від того, хто приймав перше рішення. Той самий рівень не переглядає власне рішення.","indent":false},{"t":"p","text":"8.3. Скарга від ключового клієнта: власником стає менеджер ключового клієнта (POL-20), агент передає її того ж дня.","indent":false},{"t":"p","text":"8.4. Скарга з погрозою позову, згадкою юриста, регулятора чи публічного розголосу: передається Andy Havryliuk і Oksana негайно.","indent":false},{"t":"p","text":"8.5. Друга скарга того самого клієнта з тієї самої причини протягом 90 днів: передається Oksana як сигнал, що виправлення не спрацювало.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із реєстрації (п. 5.1, 7.1) немає.","indent":false},{"t":"p","text":"9.2. Анонімна скарга без можливості звʼязку реєструється, але стан «Підтверджено» і «Рішення надано» пропускаються; скарга закривається після аналізу причини.","indent":false},{"t":"p","text":"9.3. Інше відхилення затверджує власник політики письмово і фіксує в REG-04.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи закрита скарга рішенням і чи зникла її причина, а не кількістю скарг. Зростання кількості зареєстрованих скарг після запуску політики — ознака, що розпізнавання працює, а не що сервіс погіршився.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Рішення в строк","Частка скарг, де рішення надано в строк STD-11","За STD-11"],["Вирішено першим контактом","Частка скарг, закритих у тій самій розмові агентом у межах повноважень","Встановлює власник; має зростати"],["Повторне відкриття","Частка скарг, які клієнт не прийняв і які перейшли в «Повторно відкрито»","Без цілі; має знижуватися"],["Повторна скарга з тієї самої причини","Частка клієнтів зі скаргою тієї самої причини протягом 90 днів","Без цілі; має знижуватися"],["Скарги на ордер","Кількість скарг на 100 ордерів за класами STD-07","Без цілі; топ-причини мають мінятися квартал до кварталу"]]},{"t":"p","text":"10.2. Останній показник є перевіркою п. 5.6: якщо топ причин не змінюється, причини не усуваються.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, квартальний аналіз REG-03, призначення власників усунення причин, погодження відповідей на публічні відгуки.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"11.3. Andy Havryliuk: претензії щодо вантажу за POL-17, скарги з юридичним ризиком.","indent":false},{"t":"p","text":"11.4. Команда ключових клієнтів: скарги своїх клієнтів як власники.","indent":false},{"t":"p","text":"11.5. Агент: розпізнавання і реєстрація скарги, підтвердження клієнту, рішення в межах повноважень.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-03 (ціноутворення), POL-05 (безперервність), POL-06 (обслуговування клієнта), POL-08 (ескалація), POL-17 (пошкодження і претензії), POL-18 (передплата і повернення), POL-20 (ключові клієнти).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-07 (класифікатор звернень), STD-09 (ліміти повноважень), STD-10 (деградація), STD-11 (строки скарг).","indent":false},{"t":"p","text":"12.3. Процедури: SOP-4.1 (обробка скарги), SOP-4.8 (розбір інцидентів).","indent":false},{"t":"p","text":"12.4. Записи: REG-03 (журнал скарг), REG-04 (винятки).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. STD-11: строки реєстрації, підтвердження, рішення і строк мовчання клієнта до автоматичного закриття. Без нього колонка «Строк» у п. 4.1 порожня.","indent":true},{"t":"p","text":"13.2. REG-03 (журнал скарг): поля мають покривати стани п. 4.1, власника, клас STD-07 і передачі. Де живе — HubSpot (тікет з pipeline станів) чи окрема таблиця.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.3. Звірити з чинним SOP-4.1: чи збігаються стани і власники.","indent":true},{"t":"p","text":"13.4. Хто моніторить публічні відгуки (Google, соцмережі) і як вони потрапляють у REG-03.","indent":true},{"t":"p","text":"13.5. Звірити з драфтом 0.3: що з нього не потрапило у v0.4. Відповідає Oksana.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.4","08.11.2026","Oksana","Переписано в L1-форматі. Шість станів скарги з тригерами і власниками. Повторне відкриття переходить на рівень вище. Додано показники результату."],["0.3","06.09.2026","Oksana","Драфт на принципах ISO 10002; визначення скарги, канал claims@freitty.com."]]}]},"POL-08":{"code":"POL-08","title":"Політика ескалації","source":"pdf","meta":{"Код":"POL-08","Рівень":"L1 Політика","Зона":"Сервіс","Tier":"1 — операційний","Власник":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.7","Перегляд":"Раз на рік або при зміні структури команди чи лімітів STD-09"},"status":"Чернетка","version":"0.7","date":"Nov 8, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-08"],["Рівень","L1 Політика"],["Зона","Сервіс"],["Tier","1 — операційний"],["Власник","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.7"],["Перегляд","Раз на рік або при зміні структури команди чи лімітів STD-09"]],"passport":true},{"t":"p","text":"1.1. Це джерело механізму ескалації для POL-05, POL-06, POL-07 і TPL-13. Інші документи кажуть, КОЛИ ескалювати; ця політика каже, ЯК.","indent":false},{"t":"p","text":"1.2. Версію 0.7 написано в L1-форматі. Рішення 0.6 збережено: розрізнення вертикальної і горизонтальної ескалації; власність над зверненням при ескалації не передається. Матрицю з чернетки 0.5 потрібно звірити з розділом 8 (розділ 13).","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Ескалація отримує рішення, а не перекладає клієнта. Звернення не «зависає» між людьми і не повертається до клієнта з питанням «а хто вас веде?».","indent":false},{"t":"p","text":"2.2. Ескалація — інструмент для того, що поза повноваженнями агента, а не замінник рішення. Агент ескалює, коли рішення не його, а не коли рішення важке.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на будь-яке звернення, рішення по якому потребує людини поза агентом: скарги, інциденти, рішення понад ліміти STD-09, юридичні та безпекові питання, кризу за POL-05.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, хто веде звернення клієнтів: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist і Netcor.","indent":false},{"t":"p","text":"3.3. Політика НЕ встановлює строків ескалації. Це STD-12.","indent":false},{"t":"p","text":"3.4. Політика НЕ встановлює лімітів повноважень. Це STD-09.","indent":false},{"t":"p","text":"3.5. Політика НЕ визначає, що саме вирішує кожна команда (склад, transport team, Billing). Вона визначає, як до них звертатися і хто відповідає перед клієнтом.","indent":false},{"t":"h","text":"4. Позиція компанії: види і стани ескалації"},{"t":"p","text":"4.1. Ескалація буває двох видів.","indent":false},{"t":"table","rows":[["Вид","Куди","Навіщо","Приклади"],["Вертикальна","Вище за рівнем повноважень","Рішення, яке агент не має права прийняти","Компенсація понад ліміт, визнання відповідальності, зміна умов"],["Горизонтальна","В іншу команду","Дія або факт, якого CS не має","Склад перевіряє вантаж, transport team дає квоту, Billing виправляє інвойс"]]},{"t":"p","text":"4.2. Власність над зверненням при ескалації НЕ передається. Агент, який веде звернення, лишається власником і єдиною точкою контакту з клієнтом. Той, кому ескальовано, приймає рішення або дає факт і повертає його власнику.","indent":false},{"t":"p","text":"4.3. Виняток із п. 4.2 — лише коли звернення за своєю природою переходить в іншу роль: ключовий клієнт (POL-20), претензія щодо вантажу (POL-17). Тоді передача власності явна, записана, і клієнт отримує імʼя нового власника.","indent":false},{"t":"p","text":"4.4. Кожна ескалація перебуває рівно в одному стані.","indent":false},{"t":"table","rows":[["Стан","Що означає","Хто переводить"],["Відкрито","Ескалацію подано за TPL-05 з усім контекстом","Власник звернення"],["Прийнято","Адресат підтвердив, що бере в роботу","Адресат"],["Рішення","Адресат повернув рішення або факт власнику","Адресат"],["Закрито","Власник передав рішення клієнту","Власник звернення"],["Прострочено","Адресат не прийняв або не повернув рішення в строк STD-12","Автоматично за строком; власник ескалює рівнем вище"]]},{"t":"p","text":"4.5. Ескалація без картки TPL-05 не вважається поданою. Повідомлення «глянь, будь ласка» в чаті — не ескалація.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Власник звернення подає ескалацію карткою TPL-05: клієнт, ордер, що сталося, що вже зроблено, яке рішення потрібне, до коли воно потрібне клієнту.","indent":false},{"t":"p","text":"5.2. Адресат читає ескалацію як самодостатню. Якщо в картці бракує даних, адресат повертає її з конкретним питанням, а не мовчить.","indent":false},{"t":"p","text":"5.3. Клієнт отримує від власника строк наступного оновлення в момент ескалації, а не «я уточню».","indent":false},{"t":"p","text":"5.4. Власник стежить за строком STD-12. Прострочена ескалація ескалюється рівнем вище тим самим власником.","indent":false},{"t":"p","text":"5.5. Рішення, отримане через ескалацію, передається клієнту власником письмово в Order chat.","indent":false},{"t":"p","text":"5.6. Кожна вертикальна ескалація фіксується в REG-04 разом із рішенням. Це дані для перегляду лімітів STD-09.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено передавати клієнту контакт людини, якій ескальовано, щоб «звʼязалися напряму», якщо це не передача власності за п. 4.3.","indent":false},{"t":"p","text":"6.2. Заборонено ескалювати, щоб уникнути неприємної розмови з клієнтом, коли рішення в межах повноважень.","indent":false},{"t":"p","text":"6.3. Заборонено ескалювати через голову рівня, крім прострочення (п. 4.4) або випадків, коли рівень відсутній.","indent":false},{"t":"p","text":"6.4. Заборонено казати клієнту «це не від мене залежить» без імені того, від кого залежить, і строку.","indent":false},{"t":"p","text":"6.5. Заборонено адресату ескалації відповідати клієнту напряму в обхід власника, крім передачі власності за п. 4.3.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Ескалація загрози безпеці людей, вантажу або даних — негайно, будь-якої доби, телефоном, без очікування картки (картка заповнюється після).","indent":false},{"t":"p","text":"7.2. Нічна зміна має кого будити за переліком тригерів нічного виклику (розділ 13). Вночі звернення не чекає ранку, якщо воно в цьому переліку.","indent":false},{"t":"p","text":"7.3. Власність над зверненням не губиться при зміні зміни. Звернення з відкритою ескалацією передається наступній зміні явно, з іменем нового власника в Order chat.","indent":false},{"t":"h","text":"8. Матриця ескалації"},{"t":"p","text":"8.1. Кому ескалювати за типом рішення. Строки — за STD-12.","indent":false},{"t":"table","rows":[["Що потрібно","Вид","Перший адресат","Якщо прострочено або відсутній"],["Рішення понад ліміт агента (STD-09)","Вертикальна","CS супервайзер на зміні","Oksana"],["Рішення понад ліміт супервайзера","Вертикальна","Oksana","Андрій Кулик"],["Факт по вантажу на складі","Горизонтальна","Склад (локація)","CS супервайзер → Oksana"],["Квота або статус транспорту","Горизонтальна","Transport team","CS супервайзер → Oksana"],["Ціна поза прайсом","Горизонтальна","Andrew Cherniavskyi","Oksana"],["Інвойс, оплата, повернення","Горизонтальна","Billing","Oksana"],["Пошкодження, втрата, претензія","Передача власності","Andy Havryliuk (POL-17)","Андрій Кулик"],["Юридичний ризик, дані, запис, доступ","Вертикальна","Andy Havryliuk","Андрій Кулик"],["Ключовий клієнт","Передача власності","Менеджер ключового клієнта (POL-20)","Oksana"],["Криза за POL-05","Вертикальна","CS супервайзер на зміні","Oksana → Андрій Кулик"]]},{"t":"p","text":"8.2. Імена в матриці — тимчасові. Після затвердження вони замінюються ролями, а імена живуть у графіку змін і STD-06.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із п. 7.1 немає.","indent":false},{"t":"p","text":"9.2. Передача власності поза п. 4.3 можлива за рішенням Oksana і фіксується в REG-04 з причиною.","indent":false},{"t":"p","text":"9.3. Інше відхилення затверджує власник політики і фіксує в REG-04.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи ескалація повертає рішення вчасно, і тим, скільки ескалацій узагалі не знадобилося.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Рішення в строк","Частка ескалацій, де рішення повернуто власнику в строк STD-12","За STD-12"],["Частка ескалацій","Ескалації до всіх звернень за період","Без цілі; зростання — сигнал, що ліміти STD-09 замалі або агенти бояться вирішувати"],["Схвалено без змін","Частка вертикальних ескалацій, де рішення збіглося з тим, що пропонував агент","Без цілі; висока частка — аргумент підняти ліміти"],["Повернення через неповну картку","Частка ескалацій, повернутих адресатом через брак даних у TPL-05","Має знижуватися"],["Прострочені ескалації","Кількість ескалацій у стані «Прострочено» за тиждень","Без цілі; кожна розбирається"]]},{"t":"p","text":"10.2. «Схвалено без змін» — ключовий показник для перегляду STD-09: якщо рівень вище щоразу погоджує те, що агент і так пропонував, ця ескалація була зайвою витратою часу клієнта.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, матриця ескалації, перегляд показників і звʼязок із переглядом STD-09.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики, верхній рівень вертикальної ескалації.","indent":false},{"t":"p","text":"11.3. CS супервайзер на зміні: перший рівень вертикальної ескалації, контроль прострочених ескалацій зміни.","indent":false},{"t":"p","text":"11.4. Адресати горизонтальної ескалації (склад, transport team, Billing, ціноутворення): прийом і рішення в строк STD-12.","indent":false},{"t":"p","text":"11.5. Агент: власність над зверненням, картка TPL-05, контроль строку, передача рішення клієнту.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-05 (безперервність), POL-06 (обслуговування клієнта), POL-07 (скарги), POL-17 (пошкодження і претензії), POL-20 (ключові клієнти).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-06 (години роботи), STD-09 (ліміти повноважень), STD-12 (строки ескалації).","indent":false},{"t":"p","text":"12.3. Процедури: SOP-4.1 (обробка скарги).","indent":false},{"t":"p","text":"12.4. Шаблони і записи: TPL-05 (картка ескалації), TPL-13, REG-04 (винятки і рішення).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. STD-12: строки прийняття і рішення для кожного рядка матриці.","indent":true},{"t":"p","text":"13.2. TPL-05: картка ескалації з полями п. 5.1. Де живе — у HubSpot як поле тікета чи окремий шаблон в Order chat.","indent":true},{"t":"p","text":"13.3. Перелік тригерів нічного виклику (п. 7.2): що будить людину вночі, кого саме і як. Відповідає Oksana з Андрієм Куликом.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.4. Звірити матрицю розділу 8 з матрицею чернетки 0.5.","indent":true},{"t":"p","text":"13.5. Замінити імена в матриці на ролі після затвердження (п. 8.2).","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.7","08.11.2026","Oksana","Переписано в L1-форматі. Пʼять станів ескалації, матриця адресатів, два явні випадки передачі власності. Додано показники результату."],["0.6","06.09.2026","Oksana","Прозовий драфт. Вертикальна і горизонтальна ескалація; власність не передається."]]}]},"POL-09":{"code":"POL-09","title":"Політика комунікації і тону","source":"pdf","meta":{"Код":"POL-09","Рівень":"L1 Політика","Зона":"Сервіс","Tier":"1 — операційний","Власник":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.3","Перегляд":"Раз на рік, при зміні каналів або інструментів комунікації"},"status":"Чернетка","version":"0.3","date":"Nov 8, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-09"],["Рівень","L1 Політика"],["Зона","Сервіс"],["Tier","1 — операційний"],["Власник","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.3"],["Перегляд","Раз на рік, при зміні каналів або інструментів комунікації"]],"passport":true},{"t":"p","text":"1.1. Версію 0.3 написано заново в L1-форматі. Рішення 0.2 збережено: Order chat — єдине джерело правди; Teams і Telegram допускаються частково з дублюванням в Order chat; рішення, якого немає в Order chat, не існує; клієнтська комунікація англійською, підписана іменем, у першій особі; заборонено звинувачувати партнера, водія чи клієнта.","indent":false},{"t":"p","text":"1.2. Висновок 0.2 «дублювання на дисципліні не працює» прийнято як вимогу: п. 4.4 описує механізм, а не заклик.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Будь-хто в команді, відкривши ордер, за дві хвилини бачить усе, що клієнту обіцяно і що вирішено. Наступна зміна не перепитує клієнта і не шукає по особистих чатах.","indent":false},{"t":"p","text":"2.2. Клієнт чує Freitty одним голосом: однаковий тон, однакова мова, однакові формулювання незалежно від того, хто з ним говорить.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на всю комунікацію CS з клієнтами, партнерськими локаціями, складами, transport team і carrier`ами щодо ордерів, у будь-якому каналі.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, хто веде таку комунікацію: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist і Netcor.","indent":false},{"t":"p","text":"3.3. Політика НЕ містить готових текстів. Формулювання живуть у TPL-01, TPL-04, TPL-13 і TPL-15.","indent":false},{"t":"p","text":"3.4. Політика НЕ встановлює строків відповіді. Це STD-02 і STD-05.","indent":false},{"t":"p","text":"3.5. Політика НЕ регулює, які дані можна передавати і де зберігати. Це POL-02 і POL-12; AI-інструменти — POL-11.","indent":false},{"t":"h","text":"4. Позиція компанії: канали і джерело правди"},{"t":"p","text":"4.1. Order chat — єдине джерело правди по ордеру. Рішення, домовленість, зміна чи обіцянка, якої немає в Order chat, не існує для виконання, білінгу і претензії.","indent":false},{"t":"p","text":"4.2. Статус каналів:","indent":false},{"t":"table","rows":[["Канал","Статус","Умова"],["Order chat (Freitty Hub)","Основний","Основний"],["Dialpad (дзвінок, SMS)","Допускається","Підсумок розмови — в Order chat того ж дня"],["Email, orders@freitty.com","Допускається","Суть і рішення — в Order chat"],["Teams, Telegram (робочі акаунти з REG-12)","Допускається частково","Кожне рішення дублюється в Order chat"],["Особисті акаунти будь-яких месенджерів","Заборонено","POL-02, POL-04"]]},{"t":"p","text":"4.3. Дублювання вважається виконаним, коли в Order chat є: що вирішено, ким, коли. Скріншот чату без суті не є дублюванням.","indent":false},{"t":"p","text":"4.4. Дублювання тримається на механізмі, а не на памʼяті агента:","indent":false},{"t":"p","text":"закриття ордера (SOP-3.6) неможливе без запису в Order chat про кожну зміну умов; вибірка SOP-6.5 перевіряє збіг дзвінків Dialpad і записів в Order chat; канал, який систематично не дублюється, виводиться з переліку п. 4.2.","indent":true},{"t":"p","text":"4.5. Уся клієнтська комунікація ведеться англійською. Внутрішня комунікація команди — будь-якою мовою, але все, що бачить або може побачити клієнт, — англійською.","indent":false},{"t":"p","text":"4.6. Команда CS працює за трьома моделями обслуговування. Модель визначає, хто веде комунікацію з клієнтом.","indent":false},{"t":"table","rows":[["Модель","У Freitty","Хто"],["High-touch","24 ключові клієнти з особистим представником","Key Account Representatives (Sofiia Yuhnovska, Andy Pylypiv)"],["Low-touch","Усі інші клієнти через вхідні звернення, цілодобово","10 представників (JD-01)"],["Tech-touch","Самостійні замовлення через кабінет або Instabook","Customer Experience Specialist (Anastasiia Kuzmak)"]]},{"t":"p","text":"4.7. Клієнт high-touch отримує комунікацію від свого представника. Якщо звернення приходить на загальну лінію під час зміни представника, агент low-touch фіксує його в Order chat і одразу передає представнику, не вирішуючи за нього (POL-08 п. 4.3, POL-20).","indent":false},{"t":"p","text":"4.8. Поза зміною Key Account Representatives звернення ключового клієнта приймає нічна зміна. Агент нічної зміни вирішує його в межах своїх повноважень (STD-09) і з урахуванням індивідуальних умов клієнта (REG-09, TPL-14), фіксує все в Order chat і передає представнику на початку його зміни.","indent":false},{"t":"h","text":"5. Зобовʼязання: тон і форма"},{"t":"p","text":"5.1. Кожне повідомлення клієнту підписане іменем агента і написане в першій особі: «I've checked with the warehouse», а не «The team will check».","indent":false},{"t":"p","text":"5.2. Тон спокійний, прямий і конкретний. Агент не копіює роздратування клієнта і не відповідає надмірною веселістю на проблему.","indent":false},{"t":"p","text":"5.3. Повідомлення про проблему має три частини: що сталося з вантажем, що ми робимо, коли клієнт отримає наступну новину. Причина збою на нашому боці не пояснюється (POL-05, POL-06).","indent":false},{"t":"p","text":"5.4. Час у повідомленні — з часовим поясом клієнта або локації, з явною позначкою поясу.","indent":false},{"t":"p","text":"5.5. Одне повідомлення — одна тема. Якщо клієнту треба відповісти на кілька питань, відповіді нумеруються.","indent":false},{"t":"p","text":"5.6. Агент, який закриває розмову з клієнтом, підсумовує домовленості письмово і просить підтвердити, якщо вони змінюють умови ордера.","indent":false},{"t":"p","text":"5.7. Гнів клієнта — сигнал незадоволеної потреби (справедливість, передбачуваність, контроль), а не атака на агента. Агент спершу дає клієнту договорити, називає його потребу, один раз спокійно називає факт і завершує конкретним наступним кроком. Порядок і формулювання — у TPL-13.","indent":false},{"t":"p","text":"5.8. Розмова не закінчується на «ні». Відмова формулюється як те, що агент може зробити, або що клієнт може очікувати і коли.","indent":false},{"t":"p","text":"5.9. Після складної розмови агент надсилає письмове підтвердження: що зʼясували, що зробимо, до якого часу.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено звинувачувати перед клієнтом партнера, склад, водія, carrier`а, колегу або самого клієнта. Клієнт отримує факт і дію, а не винного.","indent":false},{"t":"p","text":"6.2. Заборонено приймати чи підтверджувати рішення по ордеру в каналі поза Order chat без дублювання за п. 4.3.","indent":false},{"t":"p","text":"6.3. Заборонено писати клієнту не англійською, зокрема вставки українською чи російською в спільних чатах, які бачить клієнт.","indent":false},{"t":"p","text":"6.4. Заборонено безособові підписи («Freitty Team», «Support») у повідомленнях клієнту, крім автоматичних розсилок.","indent":false},{"t":"p","text":"6.5. Заборонено сарказм, емодзі в повідомленнях про проблему і великі літери як спосіб наголосу.","indent":false},{"t":"p","text":"6.6 Заборонено оцінювати хто був винен в рестаку, повалених палетах.","indent":false},{"t":"p","text":"6.7. Заборонено перебивати клієнта, щоб виправити його чи захистити правило; віддзеркалювати крик, великі літери і знаки оклику; сперечатися пункт за пунктом у переписці.","indent":false},{"t":"p","text":"6.8. Заборонено фрази, які переносять проблему на клієнта або звучать як відмова за скриптом: «That's our policy», «I'm sorry you feel that way», «I understand, but…». Перелік замін — у TPL-13.","indent":false},{"t":"p","text":"6.9. Заборонено захищати попереднього агента чи колегу перед клієнтом. Агент стає тим, хто закриває питання.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Запис рішення в Order chat — у будь-якому режимі роботи за POL-05. У кризі допускається короткий запис з доповненням після повернення до норми.","indent":false},{"t":"p","text":"7.2. Структура повідомлення про проблему (п. 5.3): під тиском вона особливо потрібна, бо саме тоді клієнт найуважніше читає.","indent":false},{"t":"p","text":"7.3. Заборона звинувачень (п. 6.1).","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Клієнт ображає агента або погрожує: агент не зобовʼязаний це терпіти. Він дає одне усне попередження, і якщо поведінка не змінюється, завершує розмову і передає звернення CS супервайзеру за POL-08. Межа і емпатія не суперечать одна одній.","indent":false},{"t":"p","text":"8.2. Клієнт вимагає вести комунікацію лише в каналі поза п. 4.2 (наприклад, WhatsApp): рішення за POL-02 п. 9.2.","indent":false},{"t":"p","text":"8.3. Виявлено рішення по ордеру, яке існує лише поза Order chat: агент переносить його в Order chat з позначкою «перенесено з [канал], [дата]» і повідомляє Oksana, якщо це повторюється.","indent":false},{"t":"p","text":"8.4. Неприйнятна поведінка повторюється після усного попередження або в переписці: клієнт отримує офіційний лист-попередження за TPL-13. Копія листа зі скріншотами надсилається на claims@freitty.com того ж дня. Після листа друге попередження не дається — наступний випадок ескалюється одразу.","indent":false},{"t":"p","text":"8.5. Ознаки, що лінію треба передати, а не тримати: клієнт повторює те саме заперечення без нової інформації; тон стає ворожим чи особистим; питання поза повноваженнями агента. Передача формулюється як отримання правильної відповіді, а не швидкої.","indent":false},{"t":"p","text":"8.6. Публічний канал (відгуки, соцмережі): не більше двох відповідей на ту саму скаргу, далі розмова переводиться в приватний канал. Відповідь погоджується за POL-07 п. 6.6.","indent":false},{"t":"p","text":"8.7. Агресивна поведінка працівника складу, партнера чи carrier`а: агент один раз повертає розмову до задачі, далі ставить межу і передає CS супервайзеру. Агент не вибачається за нормальне робоче питання і не виграє суперечку.","indent":false},{"t":"p","text":"8.8. Кожен випадок неприйнятної поведінки — клієнта чи партнера — фіксується того ж дня: час, дослівно сказане, скріншоти з часом, ордер. Операційне питання і поведінка фіксуються окремо, щоб жодне не загубилось. Разовий випадок не є причиною не фіксувати: патерн видно лише тоді, коли залоговано кожен.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Клієнт, який не володіє англійською: комунікація його мовою допускається, якщо агент нею володіє, з підсумком англійською в Order chat. Фіксується в картці клієнта.","indent":false},{"t":"p","text":"9.2. Винятків із п. 4.1 (Order chat як джерело правди) немає.","indent":false},{"t":"p","text":"9.3. Інше відхилення затверджує власник політики і фіксує в REG-04.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи можна відтворити історію ордера з Order chat і чи не перепитує клієнт те, що йому вже казали.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Повнота Order chat","Частка ордерів у вибірці SOP-6.5, де кожен дзвінок і кожна зміна умов мають запис в Order chat","100%"],["Спори без запису","Кількість спорів з клієнтом за місяць, де домовленість не підтверджується Order chat","0"],["Повторні звернення з тим самим питанням","Частка звернень, де клієнт питає те, на що вже отримав відповідь по цьому ордеру","Має знижуватися"],["Відповідність тону","Частка повідомлень у вибірці SOP-6.5 без порушень розділів 5 і 6","Встановлює власник за STD-04"]]},{"t":"p","text":"10.2. «Повторні звернення з тим самим питанням» — це CPX, спричинений комунікацією: клієнт питає вдруге, бо першу відповідь не зрозумів або не знайшов.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, перелік каналів п. 4.2, контроль через вибірку SOP-6.5, рішення про виведення каналу.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"11.3. CS супервайзер на зміні: прийом розмов за п. 8.1, контроль записів в Order chat при передачі зміни.","indent":false},{"t":"p","text":"11.4. Агент: запис рішень в Order chat, тон і форма розділу 5, підпис іменем.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-02 (персональні дані), POL-04 (доступи), POL-05 (безперервність), POL-06 (обслуговування клієнта), POL-08 (ескалація), POL-11 (AI-інструменти), POL-12 (зберігання і видалення).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-02, STD-04 (поріг якості), STD-05 (норми відповіді).","indent":false},{"t":"p","text":"12.3. Процедури: SOP-1.6, SOP-3.6 (закриття ордера), SOP-4.2, SOP-6.5 (скоринг).","indent":false},{"t":"p","text":"12.4. Шаблони і записи: TPL-01 (скрипти), TPL-04, TPL-13, TPL-15 (операційні повідомлення), REG-04 (винятки), REG-12 (дозволені канали).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. Чи є клієнт учасником Order chat. Якщо так — внутрішні обговорення туди не дублюються, і потрібне окреме внутрішнє поле ордера. Якщо ні — п. 4.5 стосується лише повідомлень клієнту. Відповідає Oksana з Freitty Hub.","indent":true},{"t":"p","text":"13.2. Чи технічно можливо в Freitty Hub блокувати закриття ордера без запису про зміну умов (п. 4.4). Якщо ні — механізм тримається лише на вибірці SOP-6.5.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.3. Telegram-чати ордерів в особистих акаунтах — той самий блокер, що в POL-02, POL-04, POL-12.","indent":true},{"t":"p","text":"13.4. Чи підтягуються дзвінки Dialpad в Order chat автоматично (інтеграція), чи підсумок пишеться вручну.","indent":true},{"t":"p","text":"13.5. Звірити з драфтом 0.2: що з нього не потрапило у v0.3. Відповідає Oksana.","indent":true},{"t":"p","text":"13.6. Куди фіксуються випадки неприйнятної поведінки (п. 8.8): окремий журнал чи поле в REG-07 / HubSpot. Копії листів-попереджень — на claims@freitty.com (закрито).","indent":true},{"t":"p","text":"13.7. TPL-13: перенести туди алгоритм LISTEN → ACKNOWLEDGE → RESPOND → CONFIRM, мовні заміни, фрази передачі і текст листа-попередження з робочого гайду. Політика лише посилається.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.3","08.11.2026","Oksana","Переписано в L1-форматі. Статус кожного каналу, механізм дублювання замість дисципліни, структура повідомлення про проблему. Додано показники результату, моделі обслуговування (п. 4.6–4.8), роботу з гнівом і неприйнятною поведінкою клієнтів і партнерів (п. 5.7–5.9, 6.7–6.9, 8.4–8.8)."],["0.2","06.09.2026","Oksana","Драфт: Order chat — єдине джерело правди, англійська, підпис іменем, без звинувачень."]]}]},"POL-10":{"code":"POL-10","title":"Політика якості та моніторингу","source":"pdf","meta":{"Код":"POL-10","Рівень":"L1 Політика","Зона":"Якість","Tier":"1 — операційний","Власник":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.2","Перегляд":"Раз на рік або після зміни скорингової картки TPL-07"},"status":"Чернетка","version":"0.2","date":"Nov 9, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-10"],["Рівень","L1 Політика"],["Зона","Якість"],["Tier","1 — операційний"],["Власник","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.2"],["Перегляд","Раз на рік або після зміни скорингової картки TPL-07"]],"passport":true},{"t":"p","text":"1.1. Версію 0.2 написано в L1-форматі. Три опори 0.1 збережено: право агента оскаржити оцінку (розділ 7), перелік того, що НЕ є мірою якості (розділ 6), обовʼязкове калібрування оцінювачів (п. 5.4).","indent":false},{"t":"p","text":"1.2. Оцінювання записів спирається на POL-01 як юридичну підставу, а передача транскриптів у зовнішні сервіси — на POL-11. Call audit engine уже працює, тому його статус щодо POL-11 і POL-02 — перше відкрите питання (13.3).","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Оцінка якості показує, чи отримав клієнт результат і чи дотримано політик сервісної зони, а не чи агент вимовив правильні слова.","indent":false},{"t":"p","text":"2.2. Оцінка є інструментом розвитку агента і процесу. Вона знаходить те, що треба навчити, і те, що треба виправити в процесі, а не підставу покарати.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на оцінювання всіх розмов і письмових звернень CS: дзвінки Dialpad, Order chat, email, Telegram і Teams у межах POL-09.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, чиї розмови оцінюються (штатні співробітники, команда ключових клієнтів, Customer Experience Specialist, Netcor) і на всіх, хто оцінює.","indent":false},{"t":"p","text":"3.3. Політика НЕ встановлює поріг якості і розмір вибірки. Це STD-04.","indent":false},{"t":"p","text":"3.4. Політика НЕ описує порядок оцінювання і картку. Це SOP-6.5, TPL-07 і TPL-08.","indent":false},{"t":"p","text":"3.5. Політика НЕ регулює законність запису розмов. Це POL-01.","indent":false},{"t":"h","text":"4. Позиція компанії"},{"t":"p","text":"4.1. Якість розмови — це те, що отримав клієнт: вирішене питання, правдиву інформацію, наступний крок і строк. Тон і форма важливі, але другорядні щодо результату.","indent":false},{"t":"p","text":"4.2. Кожен критерій скорингової картки виводиться з конкретного пункту політики (POL-01, POL-02, POL-03, POL-06, POL-07, POL-08, POL-09). Критерій без джерела в політиці з картки прибирається.","indent":false},{"t":"p","text":"4.3. Критерії діляться на два класи. Критичні — порушення політики, що шкодить клієнту або компанії (нерозкритий збір, прийом платіжних даних, абсолютна обіцянка, запис без повідомлення). Одне таке порушення робить оцінку незадовільною незалежно від решти. Решта критеріїв — розвиткові.","indent":false},{"t":"p","text":"4.4. Повторювана помилка кількох агентів — ознака проблеми процесу, скрипта чи навчання, а не людей. Вона передається власнику процесу, а не розбирається з кожним агентом окремо.","indent":false},{"t":"p","text":"4.5. Оцінка прозора. Агент бачить свою картку з посиланням на конкретний момент розмови і критерій.","indent":false},{"t":"p","text":"4.6. Оцінювання має два рівні.","indent":false},{"t":"table","rows":[["Рівень","Хто","Покриття","Що робить"],["Автоматичний","Call audit engine","Усі дзвінки","Транскрибує, оцінює за критеріями TPL-07, позначає можливі критичні порушення"],["Людський","Оцінювач","Вибірка STD-04 + усі позначені рушієм критичні","Підтверджує або відхиляє позначки, оцінює те, що рушій не бачить, проводить розбір з агентом"]]},{"t":"p","text":"4.7. Рушій знаходить, людина вирішує. Жодна оцінка рушія не має наслідків для агента без перевірки людиною. Рушій дає покриття, людина — судження.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Кожен агент, включно з Netcor і командою ключових клієнтів, оцінюється за вибіркою STD-04 щомісяця. Вибірка випадкова, а не за скаргами.","indent":false},{"t":"p","text":"5.2. Оцінка проводиться за TPL-07 і повертається агенту з розбором протягом строку SOP-6.5. Оцінка без розбору не зараховується.","indent":false},{"t":"p","text":"5.3. Критичне порушення (п. 4.3) розбирається з агентом того ж тижня, а якщо зачепило клієнта — передається власнику відповідної політики.","indent":false},{"t":"p","text":"5.4. Оцінювачі калібруються раз на місяць: усі оцінюють ту саму розмову, розбіжності розбираються до спільного розуміння критерію. Оцінювач, чиї оцінки систематично відхиляються, не оцінює до наступного калібрування. Call audit engine калібрується так само: щомісяця його оцінки звіряються з людськими на тих самих дзвінках, і критерій, де він систематично помиляється, переналаштовується або знімається з автоматичної оцінки.","indent":false},{"t":"p","text":"5.5. Раз на квартал власник політики аналізує оцінки в сукупності: які критерії найчастіше не виконуються і в кого. Повторювані помилки передаються у навчання (PRC-7.0) або власнику процесу (п. 4.4).","indent":false},{"t":"h","text":"6. Заборони і те, що НЕ є мірою якості"},{"t":"p","text":"6.1. НЕ є мірою якості:","indent":false},{"t":"p","text":"кількість оброблених дзвінків чи звернень за зміну; середня тривалість розмови сама по собі (коротка розмова без результату гірша за довгу з результатом); дослівне дотримання скрипта, якщо клієнт отримав результат і політики дотримано; кількість скарг на агента без аналізу їх обґрунтованості; оцінка клієнта в опитуванні, якщо незадоволення спричинене не агентом (ціна, склад, погода).","indent":true},{"t":"p","text":"6.2. Заборонено оцінювати лише розмови, на які надійшла скарга. Вибірка за скаргами показує найгірші випадки і не показує норму.","indent":false},{"t":"p","text":"6.3. Заборонено використовувати оцінку як єдину підставу для дисциплінарного рішення без розбору і без права на оскарження.","indent":false},{"t":"p","text":"6.4. Заборонено оцінювати розмову, записану з порушенням POL-01, і використовувати транскрипт, отриманий з порушенням POL-11.","indent":false},{"t":"p","text":"6.5. Заборонено оцінювати власних підлеглих без калібрування за п. 5.4.","indent":false},{"t":"p","text":"6.6. Заборонено застосовувати оцінку Call audit engine як остаточну для критичного порушення, плану розвитку чи рішення про допуск без перевірки людиною.","indent":false},{"t":"p","text":"6.7. Заборонено ранжувати агентів за середнім балом рушія. Середній бал по всіх дзвінках є сигналом для вибірки, а не оцінкою агента.","indent":false},{"t":"h","text":"7. Право агента оскаржити оцінку"},{"t":"p","text":"7.1. Агент може оскаржити будь-яку оцінку протягом 5 робочих днів після розбору, письмово, з посиланням на момент розмови і критерій.","indent":false},{"t":"p","text":"7.2. Оскарження розглядає інший оцінювач, ніж той, що ставив оцінку; оскарження оцінки Call audit engine завжди розглядає людина. Він переглядає розмову сам, а не перечитує картку.","indent":false},{"t":"p","text":"7.3. Рішення по оскарженню надається протягом 5 робочих днів і є остаточним. Змінена оцінка заміщує початкову в усіх звітах.","indent":false},{"t":"p","text":"7.4. Оскарження не є ознакою конфлікту і не впливає на наступні оцінки агента. Частка оскаржень, прийнятих на користь агента, є показником якості оцінювання, а не агента.","indent":false},{"t":"h","text":"8. Що не деградує ніколи і ескалація"},{"t":"p","text":"8.1. Розбір критичного порушення (п. 4.3) не відкладається через навантаження. Планове оцінювання вибірки може зсуватися в пік, критичне — ні.","indent":false},{"t":"p","text":"8.2. Право на оскарження (розділ 7) діє в будь-якому режимі.","indent":false},{"t":"p","text":"8.3. Критичне порушення, що зачепило клієнта: передається власнику відповідної політики того ж тижня (POL-03 — Andrew Cherniavskyi, POL-01, POL-02","indent":false},{"t":"p","text":"— Andy Havryliuk).","indent":false},{"t":"p","text":"8.4. Агент двічі поспіль нижче порогу STD-04: план розвитку з Oksana, а не автоматичне рішення. Третій раз поспіль — рішення про допуск до лінії за SOP-6.4.","indent":false},{"t":"p","text":"8.5. Конфлікт агента з оцінювачем, який не вирішується оскарженням: передається Oksana.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Новий агент до завершення допуску (SOP-6.4) оцінюється частіше за STD-04, а його оцінки не входять у звіт команди.","indent":false},{"t":"p","text":"9.2. Розмова в режимі кризи за POL-05 оцінюється з урахуванням режиму: розвиткові критерії не застосовуються, критичні — застосовуються.","indent":false},{"t":"p","text":"9.3. Інше відхилення затверджує власник політики і фіксує в REG-04.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірює і якість роботи агентів, і якість самого оцінювання.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Частка розмов вище порогу","Частка оцінених розмов з оцінкою не нижче порогу STD-04","За STD-04"],["Критичні порушення","Кількість критичних порушень на 100 оцінених розмов","Без цілі; має знижуватися"],["Розбіжність оцінювачів","Розкид оцінок на калібруванні за п. 5.4","Має знижуватися"],["Оскарження на користь агента","Частка оскаржень, де оцінку змінено","Без цілі; висока частка — сигнал, що критерій нечіткий або оцінювач не відкалібрований"],["Звʼязок із результатом","Чи корелює оцінка агента з FCR і resolution rate його звернень (POL-06)","Має бути позитивним; якщо ні — картка міряє не те"]]},{"t":"p","text":"10.2. Останній показник — перевірка самої картки. Якщо агенти з високими оцінками не вирішують більше звернень з першого разу, картка оцінює форму, а не результат, і переглядається.","indent":false},{"t":"p","text":"10.3. Окремий показник для рушія — збіг з людиною: частка дзвінків на калібруванні, де оцінка Call audit engine збігається з людською за кожним критерієм. Критерій зі збігом нижче цільового не використовується в автоматичній оцінці, доки не переналаштований.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, скорингова картка TPL-07, калібрування, квартальний аналіз, рішення за п. 8.4–8.5.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"11.3. Оцінювачі (QA, CS супервайзери): оцінювання за TPL-07, розбір з агентом, участь у калібруванні, розгляд оскаржень чужих оцінок.","indent":false},{"t":"p","text":"11.4. Власники політик сервісної зони: прийом критичних порушень за п. 8.3.","indent":false},{"t":"p","text":"11.5. Агент: ознайомлення з оцінкою, право оскарження.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-01 (запис розмов), POL-02, POL-03, POL-05, POL-06, POL-07, POL-08, POL-09 (джерела критеріїв), POL-11 (AI-інструменти і транскрипти).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-04 (поріг якості і вибірка).","indent":false},{"t":"p","text":"12.3. Процеси і процедури: PRC-7.0 (навчання), SOP-6.4 (допуск агента), SOP-6.5 (скоринг).","indent":false},{"t":"p","text":"12.4. Шаблони і записи: TPL-07 (скорингова картка), TPL-08, REG-04 (винятки).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. POL-01 — юридична підстава для запису і оцінювання розмов.","indent":true},{"t":"p","text":"13.2. STD-04 — поріг якості і розмір вибірки на агента.","indent":true},{"t":"p","text":"13.3. POL-11 — чи можна передавати транскрипти в зовнішні AI-сервіси для оцінювання. Транскрипти з іменами клієнтів уже проходять через такі сервіси. Call audit engine: де обробляються записи (власний контур чи зовнішній сервіс), хто має доступ до транскриптів, скільки вони зберігаються — для POL-02, POL-11, POL-12 і запису в REG-12.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.4. Хто оцінює: окрема роль QA чи CS супервайзери. Від цього залежить п. 6.5.","indent":true},{"t":"p","text":"13.5. TPL-07: прибрати критерії без джерела в політиці (п. 4.2), позначити критичні (п. 4.3).","indent":true},{"t":"p","text":"13.6. Строки 5 робочих днів у розділі 7 — підтвердити або перенести в STD-04.","indent":true},{"t":"p","text":"13.7. Чи оцінює Call audit engine за критеріями TPL-07 чи за власними. Якщо за власними — привести до TPL-07 (п. 4.2).","indent":true},{"t":"p","text":"13.8. Цільовий збіг рушія з людиною (п. 10.3) і хто відповідає за налаштування рушія.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.2","09.11.2026","Oksana","Переписано в L1-форматі. Критерії виводяться з політик, поділ на критичні і розвиткові, повторювана помилка — проблема процесу. Додано показники якості оцінювання і перевірку картки через звʼязок із FCR. Додано Call audit engine: суцільне автоматичне покриття, рішення лише людиною, калібрування рушія."],["0.1","06.09.2026","Oksana","Драфт: право на оскарження, що не є мірою якості, калібрування."]]}]},"POL-11":{"code":"POL-11","title":"Політика використання AI- інструментів","source":"pdf","meta":{"Код":"POL-11","Рівень":"L1 Політика","Зона":"Право і безпека","Tier":"1 — операційний","Власник":"Oksana","Узгоджує":"Andy Havryliuk (передача даних, правова підстава)","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.2","Перегляд":"Кожні 6 місяців — AI-інструменти змінюються швидше за решту систем"},"status":"Чернетка","version":"0.2","date":"Nov 9, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-11"],["Рівень","L1 Політика"],["Зона","Право і безпека"],["Tier","1 — операційний"],["Власник","Oksana"],["Узгоджує","Andy Havryliuk (передача даних, правова підстава)"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.2"],["Перегляд","Кожні 6 місяців — AI-інструменти змінюються швидше за решту систем"]],"passport":true},{"t":"p","text":"1.1. Версію 0.2 написано в L1-форматі. Рішення 0.1 збережено: у сферу дії входять вбудовані AI-функції вендорів (HubSpot, Dialpad, respond.io); увімкнена галочка «AI summary» є передачею даних третій стороні.","indent":false},{"t":"p","text":"1.2. Політика буде порушена в момент затвердження: транскрипти з іменами клієнтів уже проходять через зовнішні сервіси, а Call audit engine вже аналізує дзвінки. Тому розділ 9 містить перехідний період, а не вдає, що порушень немає.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. CS використовує AI там, де це прискорює закриття операції для клієнта, і знає, куди при цьому йдуть дані клієнтів.","indent":false},{"t":"p","text":"2.2. Кожен AI-інструмент, який торкається даних клієнтів, має власника, підставу і запис у REG-12. AI, про який компанія не знає, — це витік, що триває.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. AI-інструмент у цій політиці — будь-який сервіс, що обробляє текст, голос чи зображення моделлю машинного навчання: окремі сервіси (ChatGPT, Claude, Gemini, транскрибатори), вбудовані функції вендорів (AI summary в HubSpot, Dialpad, respond.io), власні рішення Freitty (Call audit engine) і автоматизовані агенти, що виконують процеси CS.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, хто працює з даними CS: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist, Netcor і тих, хто налаштовує інструменти.","indent":false},{"t":"p","text":"3.3. Увімкнення вбудованої AI-функції у вже дозволеній системі — це новий інструмент, а не налаштування. Воно проходить ті самі стани, що й новий сервіс.","indent":false},{"t":"p","text":"3.4. Політика НЕ визначає, які дані є персональними і як їх захищати. Це POL-02.","indent":false},{"t":"p","text":"3.5. Політика НЕ визначає, як оцінюється якість роботи агентів за допомогою AI. Це POL-10.","indent":false},{"t":"p","text":"3.6. Політика НЕ визначає строки зберігання транскриптів і результатів. Це POL-12 і STD-13.","indent":false},{"t":"h","text":"4. Позиція компанії: стани інструменту"},{"t":"p","text":"4.1. Кожен AI-інструмент перебуває рівно в одному стані. Стан фіксується в REG-12.","indent":false},{"t":"table","rows":[["Стан","Що можна","Хто переводить","Умова переходу"],["Невідомий","Нічого","—","Інструмент виявлено без запису в REG-12"],["На оцінці","Тест лише на вигаданих або знеособлених даних","Oksana","Заявка з метою і переліком даних"],["Дозволено обмежено","Робота з даними, але без імен, телефонів, адрес і платіжних даних","Andy Havryliuk","Зрозуміло, де обробляються дані і чи навчається на них модель"],["Дозволено","Робота з даними клієнтів у межах мети","Andy Havryliuk","Договір або умови вендора про обробку даних; модель не навчається на даних Freitty"],["Заборонено","Нічого; доступ вимкнено","Andy Havryliuk","Порушення умов або відмова на оцінці"]]},{"t":"p","text":"4.2. Знайдений інструмент без запису в REG-12 переходить у «Невідомий» і вимикається до оцінки, а не легалізується заднім числом (як POL-04 п. 4.4).","indent":false},{"t":"p","text":"4.3. AI пропонує, людина відповідає. Відповідь, підготовлена AI, надсилається клієнту від імені агента, і агент відповідає за її зміст так само, як за написану власноруч.","indent":false},{"t":"p","text":"4.4. Автоматизований агент може виконувати процес CS без людини, якщо процес описаний правилами, станами і умовами ескалації, а рішення, що не делегуються (POL-06 п. 8.3), завжди передаються людині.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Заявка на інструмент містить: мету, які дані він отримуватиме, де вони обробляються і зберігаються, чи навчається модель на них, хто власник інструменту.","indent":false},{"t":"p","text":"5.2. Агент перед надсиланням клієнту перечитує текст, підготовлений AI, і перевіряє факти: номер ордера, суму, дату, час, адресу. AI-текст із помилкою — помилка агента.","indent":false},{"t":"p","text":"5.3. У зовнішній AI-інструмент у стані «Дозволено обмежено» агент передає знеособлений текст: замість імен, телефонів, адрес — позначки на кшталт [Client], [Phone].","indent":false},{"t":"p","text":"5.4. Власник кожного інструменту в стані «Дозволено» раз на 6 місяців перевіряє, чи не змінилися умови вендора щодо обробки і навчання на даних.","indent":false},{"t":"p","text":"5.5. Кожен автоматизований агент, що виконує процес CS, має названого відповідального з людей, журнал своїх дій і механізм передачі людині.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено вставляти дані клієнтів в AI-сервіси з особистих акаунтів, зокрема безкоштовні версії ChatGPT, Claude, Gemini (POL-02 п. 6.4).","indent":false},{"t":"p","text":"6.2. Заборонено вмикати AI-функції у системах компанії (AI summary, транскрипція, автовідповіді) без проходження станів п. 4.1.","indent":false},{"t":"p","text":"6.3. Заборонено передавати в будь-який AI-інструмент платіжні дані, паролі, коди MFA і документи, що посвідчують особу.","indent":false},{"t":"p","text":"6.4. Заборонено надсилати клієнту текст AI без перевірки людиною, крім автоматизованих агентів за п. 4.4.","indent":false},{"t":"p","text":"6.5. Заборонено автоматизованому агенту приймати рішення з переліку POL-06 п. 8.3, обіцяти компенсацію і визнавати відповідальність.","indent":false},{"t":"p","text":"6.6. Заборонено представлятися клієнту людиною від імені автоматизованого агента. Якщо клієнт питає, чи говорить з людиною, — відповідь правдива.","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. При недоступності AI-інструменту робота продовжується вручну. Жоден процес CS не може повністю залежати від AI без ручного резерву.","indent":false},{"t":"p","text":"7.2. У пік навантаження перевірка AI-тексту перед надсиланням не пропускається.","indent":false},{"t":"p","text":"7.3. Заборони п. 6.1 і 6.3 діють у будь-якому режимі, зокрема в кризі за POL-05.","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Виявлено AI-інструмент або функцію поза REG-12: повідомляється Oksana і Andy Havryliuk того ж дня; інструмент вимикається за п. 4.2.","indent":false},{"t":"p","text":"8.2. Дані клієнтів потрапили в недозволений AI-сервіс: обробляється як підозра на витік за POL-02 п. 5.7 — повідомлення протягом години.","indent":false},{"t":"p","text":"8.3. AI-текст із помилкою дійшов до клієнта і змінив умови ордера (сума, дата, адреса): виправлення клієнту письмово того ж дня, подія фіксується в REG-07.","indent":false},{"t":"p","text":"8.4. Автоматизований агент діє поза своїми правилами або не передав людині те, що мав: агент призупиняється відповідальним, подія фіксується в REG-07.","indent":false},{"t":"h","text":"9. Винятки і перехідний період"},{"t":"p","text":"9.1. На момент затвердження деякі інструменти вже обробляють дані клієнтів без проходження станів п. 4.1: зовнішні транскрибатори і Call audit engine. Для них діє перехідний період 30 днів від затвердження.","indent":false},{"t":"p","text":"9.2. За перехідний період кожен такий інструмент отримує запис у REG-12 і рішення Andy Havryliuk: «Дозволено», «Дозволено обмежено» або «Заборонено». Інструмент без рішення на 31-й день вимикається.","indent":false},{"t":"p","text":"9.3. Щодо даних, уже переданих у зовнішні сервіси, рішення приймає Andy Havryliuk: запит на видалення у вендора, прийняття ризику з записом у REG-04 або інше.","indent":false},{"t":"p","text":"9.4. Інші винятки затверджує Andy Havryliuk письмово і фіксує в REG-04 зі строком дії.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи відомо, куди йдуть дані, і тим, чи AI справді скорочує шлях до закритої операції.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Покриття REG-12","Частка AI-інструментів і функцій, що фактично працюють у CS, із записом і станом у REG-12","100%"],["Інциденти з даними","Кількість випадків передачі даних клієнтів у недозволений AI-сервіс за квартал","0"],["Помилки AI, що дійшли до клієнта","Кількість подій за п. 8.3 за місяць","0"],["Ефект на результат","Зміна FCR і часу до вирішення по процесах, де впроваджено AI, порівняно з періодом до впровадження","Має покращуватися; якщо ні — інструмент переглядається"]]},{"t":"p","text":"10.2. Останній показник не дає залишати інструмент, який лише додає роботи. AI, що не покращує результат для клієнта, — витрата.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, прийом заявок, переведення в «На оцінці», вимірювання ефекту на результат.","indent":false},{"t":"p","text":"11.2. Andy Havryliuk: рішення про переведення в «Дозволено обмежено», «Дозволено» і «Заборонено», рішення щодо вже переданих даних.","indent":false},{"t":"p","text":"11.3. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"11.4. IT: запис у REG-12, вимкнення функцій і доступів за рішенням.","indent":false},{"t":"p","text":"11.5. Власник інструменту: перевірка умов вендора раз на 6 місяців, журнал і передача людині для автоматизованих агентів.","indent":false},{"t":"p","text":"11.6. Агент: лише дозволені інструменти, знеособлення, перевірка AI-тексту перед надсиланням.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-01 (запис розмов), POL-02 (персональні дані), POL-04 (доступи), POL-05 (безперервність), POL-06 (рішення, що не делегуються), POL-10 (якість і Call audit engine), POL-12 (зберігання і видалення).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-13 (строки зберігання).","indent":false},{"t":"p","text":"12.3. Процеси: PRC-E.2 (управління доступами та інструментами).","indent":false},{"t":"p","text":"12.4. Записи: REG-04 (винятки), REG-07 (технічні збої та інциденти), REG-12 (доступи та інструменти).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. Рішення Andy Havryliuk щодо транскриптів з іменами клієнтів, уже переданих у зовнішні сервіси (п. 9.3).","indent":true},{"t":"p","text":"13.2. Перелік AI-інструментів і функцій, що фактично працюють у CS зараз, зі станом кожного — первинна інвентаризація для REG-12. Без неї п. 4.2 вимкне інструменти, від яких залежить робота.","indent":true},{"t":"p","text":"13.3. Call audit engine: де обробляються записи, хто має доступ до транскриптів, чи навчається модель на даних Freitty, скільки зберігаються результати.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.4. Чи увімкнені AI summary в HubSpot, Dialpad і respond.io — і хто вмикав.","indent":true},{"t":"p","text":"13.5. Чи плануються автоматизовані агенти для процесів CS (п. 4.4) і на яких процесах першими.","indent":true},{"t":"p","text":"13.6. Чи потрібно повідомляти клієнта, що його дзвінок аналізує AI, — разом із повідомленням про запис за POL-01.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.2","09.11.2026","Oksana","Переписано в L1-форматі. Пʼять станів інструменту, перехідний період 30 днів для вже працюючих інструментів, Call audit engine, правила для автоматизованих агентів. Додано показники результату."],["0.1","06.09.2026","Oksana","Драфт: вбудовані AI-функції вендорів у сфері дії."]]}]},"POL-12":{"code":"POL-12","title":"Політика зберігання і видалення записів","source":"pdf","meta":{"Код":"POL-12","Рівень":"L1 Політика","Зона":"Право і безпека","Tier":"1 — операційний","Власник":"Oksana","Строки (STD-13)":"Andy Havryliuk","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.2","Перегляд":"Раз на рік або при зміні систем чи юридичних вимог"},"status":"Чернетка","version":"0.2","date":"Nov 9, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-12"],["Рівень","L1 Політика"],["Зона","Право і безпека"],["Tier","1 — операційний"],["Власник","Oksana"],["Строки (STD-13)","Andy Havryliuk"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.2"],["Перегляд","Раз на рік або при зміні систем чи юридичних вимог"]],"passport":true},{"t":"p","text":"1.1. Версію 0.2 написано в L1-форматі. Рішення 0.1 збережено: резервні копії входять у сферу дії; юридичне утримання зупиняє видалення. Строки зберігання за типами записів живуть у STD-13, який визначає Andy Havryliuk.","indent":false},{"t":"p","text":"1.2. Кожен строк — компроміс між двома ризиками: короткий позбавляє компанію доказів у претензії, довгий тримає персональні дані довше, ніж потрібно (POL-02).","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Кожен запис CS зберігається рівно стільки, скільки потрібно для роботи і захисту в претензії, а потім видаляється — з усіх місць, включно з резервними копіями.","indent":false},{"t":"p","text":"2.2. Коли надходить претензія, компанія може знайти й надати всі записи по ордеру, бо вони лежать там, де компанія ними керує, і не були видалені передчасно.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Запис у цій політиці — будь-який слід роботи CS: записи і транскрипти дзвінків, Order chat, email, повідомлення в Telegram і Teams, нотатки і тікети HubSpot, фото і документи (BOL, POD), журнали REG, результати Call audit engine та інших AI-інструментів.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всі місця, де живе запис: робочі системи, резервні копії, експорти, локальні копії на пристроях і копії у вендорів (Dialpad, HubSpot, AI-сервіси).","indent":false},{"t":"p","text":"3.3. Політика поширюється на всіх, хто створює або зберігає записи CS: штатних співробітників, команду ключових клієнтів, Customer Experience Specialist, Netcor і IT.","indent":false},{"t":"p","text":"3.4. Політика НЕ встановлює конкретні строки. Це STD-13.","indent":false},{"t":"p","text":"3.5. Політика НЕ визначає, хто має доступ до записів. Це POL-04 і REG-12.","indent":false},{"t":"p","text":"3.6. Політика НЕ регулює бухгалтерські й податкові документи поза CS, крім випадків, коли CS їх створює.","indent":false},{"t":"h","text":"4. Позиція компанії: стани запису"},{"t":"p","text":"4.1. Кожен запис перебуває в одному зі станів.","indent":false},{"t":"table","rows":[["Стан","Що означає","Перехід далі"],["Активний","Ордер або звернення відкрите; запис використовується в роботі","Закриття ордера / звернення"],["Зберігається","Ордер закрито; запис потрібен для можливої претензії або аналізу","Закінчення строку STD-13"],["Утримується","На запис поширюється юридичне утримання (розділ 7); строк не тече","Зняття утримання Andy Havryliuk"],["До видалення","Строк закінчився, утримання немає","Видалення в усіх місцях, включно з резервними копіями"],["Видалено","Запис знищено, факт видалення зафіксовано","—"]]},{"t":"p","text":"4.2. Утримання має пріоритет над строком. Запис під утриманням не видаляється, навіть якщо строк STD-13 закінчився.","indent":false},{"t":"p","text":"4.3. Строк починає текти від закриття ордера або звернення, а не від створення запису.","indent":false},{"t":"p","text":"4.4. Запис, якого компанія не може видалити, бо він лежить поза її контролем (особистий акаунт, особистий пристрій), — порушення цієї політики в момент створення, а не в момент закінчення строку.","indent":false},{"t":"p","text":"4.5. Резервна копія не продовжує життя запису. Запис, видалений з робочої системи, видаляється з резервних копій у межах їх циклу ротації.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Кожен тип запису має в STD-13 строк, систему, де він живе, і спосіб видалення. Тип запису без строку зберігається до рішення Andy Havryliuk, а не безстроково за замовчуванням.","indent":false},{"t":"p","text":"5.2. Видалення за строком виконується автоматично там, де система це дозволяє, і за графіком IT там, де ні. Ручне видалення «коли згадаємо» не є виконанням.","indent":false},{"t":"p","text":"5.3. Кожне видалення за строком фіксується: тип запису, період, система, хто виконав. Сам видалений зміст не фіксується.","indent":false},{"t":"p","text":"5.4. Локальні копії (експорт при відключенні світла за SOP-E.4, фото на телефоні до завантаження) видаляються одразу після того, як втратили робочу потребу, не чекаючи строку.","indent":false},{"t":"p","text":"5.5. При виході співробітника записи CS з його робочих акаунтів переносяться в системи компанії до відкликання доступу (POL-04, SOP-6.7).","indent":false},{"t":"p","text":"5.6. Раз на рік IT і Oksana перевіряють, що видалення фактично відбувається: вибірково шукають записи, строк яких минув.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено створювати записи CS там, де компанія не може їх зберігати і видаляти: в особистих акаунтах месенджерів, особистій пошті, особистих хмарах.","indent":false},{"t":"p","text":"6.2. Заборонено видаляти запис, на який поширюється утримання, — навіть якщо строк минув і навіть за проханням клієнта.","indent":false},{"t":"p","text":"6.3. Заборонено видаляти записи вибірково до строку, зокрема записи, що можуть бути незручними в претензії.","indent":false},{"t":"p","text":"6.4. Заборонено зберігати записи довше строку «про всяк випадок» без утримання.","indent":false},{"t":"h","text":"7. Юридичне утримання і що не деградує"},{"t":"p","text":"7.1. Утримання накладається, коли надходить претензія щодо вантажу (POL-17), скарга з погрозою позову (POL-07 п. 8.4), запит від суду, регулятора чи правоохоронного органу, або коли Andy Havryliuk оцінює спір як імовірний.","indent":false},{"t":"p","text":"7.2. Утримання накладає Andy Havryliuk. Воно поширюється на всі записи по ордеру, клієнту чи періоду, названі в рішенні, у всіх місцях зберігання.","indent":false},{"t":"p","text":"7.3. Утримання знімає лише Andy Havryliuk письмово. Після зняття строк STD-13 продовжує текти з того місця, де зупинився.","indent":false},{"t":"p","text":"7.4. Агент, який отримав претензію, повідомляє Andy Havryliuk того ж дня. До рішення про утримання жодні записи по цьому ордеру не видаляються.","indent":false},{"t":"p","text":"7.5. Видалення за строком у будь-якому режимі роботи не виконується вручну в поспіху. Якщо в кризі за POL-05 автоматичне видалення збоїть, воно відкладається, а не виконується без перевірки утримань.","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Клієнт вимагає видалити його дані: передається Andy Havryliuk за POL-02 п. 5.8. Видалення можливе лише після перевірки утримань.","indent":false},{"t":"p","text":"8.2. Виявлено записи CS поза системами компанії: повідомляється Oksana
