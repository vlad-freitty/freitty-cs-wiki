 і Andy Havryliuk; записи не видаляються самостійно до рішення, бо можуть підпадати під утримання (POL-02 п. 8.4).","indent":false},{"t":"p","text":"8.3. Виявлено, що запис видалено до строку або попри утримання: повідомляється Andy Havryliuk того ж дня, подія фіксується в REG-07.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із п. 6.2 (видалення під утриманням) немає.","indent":false},{"t":"p","text":"9.2. Знеособлені агреговані дані (кількість звернень за класами, показники) можуть зберігатися довше строку STD-13, бо не містять персональних даних.","indent":false},{"t":"p","text":"9.3. Інше відхилення від строку затверджує Andy Havryliuk письмово і фіксує в REG-04.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи компанія може надати все потрібне в претензії і чи не тримає зайвого.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Повнота при претензії","Частка претензій, по яких знайдено всі записи ордера (дзвінки, Order chat, фото, документи)","100%"],["Записи поза контролем","Кількість каналів чи акаунтів із записами CS поза системами компанії","0"],["Прострочені записи","Частка записів у річній перевірці п. 5.6, строк яких минув, але які не видалено","0%"],["Порушення утримання","Кількість записів, видалених попри утримання","0"]]},{"t":"p","text":"10.2. Перший показник — головний. Записи існують, щоб захистити клієнта і компанію в спорі; якщо в претензії їх не знайти, решта політики не має значення.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, контроль, що записи CS живуть у системах компанії, річна перевірка разом з IT.","indent":false},{"t":"p","text":"11.2. Andy Havryliuk: строки STD-13, накладання і зняття утримання, рішення щодо запитів на видалення.","indent":false},{"t":"p","text":"11.3. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"11.4. IT: налаштування автоматичного видалення, графік ручного видалення, ротація резервних копій, журнал видалень.","indent":false},{"t":"p","text":"11.5. Агент: створення записів лише в системах компанії, видалення локальних копій, повідомлення про претензію того ж дня.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-01 (запис розмов), POL-02 (персональні дані), POL-04 (доступи), POL-05 (безперервність), POL-07 (скарги), POL-11 (AI-інструменти), POL-17 (пошкодження і претензії).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-13 (строки зберігання).","indent":false},{"t":"p","text":"12.3. Процедури: SOP-3.4, SOP-6.7 (відкликання при виході), SOP-E.3, SOP-E.4 (відключення світла).","indent":false},{"t":"p","text":"12.4. Записи: REG-03 (журнал скарг), REG-04 (винятки), REG-07 (технічні збої та інциденти), REG-12 (доступи та інструменти).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. Telegram-чати ордерів в особистих акаунтах. Компанія не може ні забезпечити строк, ні виконати видалення, ні гарантувати доступ при претензії (п. 4.4, 6.1). Той самий блокер, що в POL-02, POL-04, POL-09. Потрібне рішення Andy Havryliuk і Oksana.","indent":true},{"t":"p","text":"13.2. STD-13 — юридичне підтвердження строків і того, яке право (США, Канада, Україна) до яких записів застосовується.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.3. Які системи підтримують автоматичне видалення за строком (Dialpad, HubSpot, Freitty Hub) і який цикл ротації резервних копій.","indent":true},{"t":"p","text":"13.4. Скільки зберігаються транскрипти і результати Call audit engine — додати в STD-13.","indent":true},{"t":"p","text":"13.5. Де ведеться журнал утримань: окремий реєстр чи поле в REG-07.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.2","09.11.2026","Oksana","Переписано в L1-форматі. Пʼять станів запису, утримання як стан із пріоритетом над строком, видалення з резервних копій, записи Call audit engine у сфері дії. Додано показники результату."],["0.1","06.09.2026","Oksana","Драфт: резервні копії у сфері дії, розділ про юридичне утримання."]]}]},"POL-13":{"code":"POL-13","title":"Політика робочого часу і присутності","source":"pdf","meta":{"Код":"POL-13","Рівень":"L1 Політика","Зона":"Люди","Tier":"1 — операційний (підвищено з 2: цілодобовий режим уже діє)","Власник":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.3","Перегляд":"Раз на рік або при зміні моделі змін чи складу команди"},"status":"Чернетка","version":"0.3","date":"Nov 9, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-13"],["Рівень","L1 Політика"],["Зона","Люди"],["Tier","1 — операційний (підвищено з 2: цілодобовий режим уже діє)"],["Власник","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.3"],["Перегляд","Раз на рік або при зміні моделі змін чи складу команди"]],"passport":true},{"t":"p","text":"1.1. Версію 0.3 написано в L1-форматі. Рішення 0.2 збережено: три зміни з ротацією 3/3 і правилами для зміни з однією людиною; зміна не закінчується без підтвердженого прийому; перерва на зміні з однією людиною потребує покриття; право не відповідати поза зміною.","indent":false},{"t":"p","text":"1.2. Години змін, склад і покриття живуть у STD-06. Ця політика визначає правила присутності, а не розклад.","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Лінія CS ніколи не лишається без людини, яка відповідає клієнту, а кожен активний ордер у будь-який момент має названого відповідального.","indent":false},{"t":"p","text":"2.2. Цілодобовий режим тримається на правилах, а не на тому, що люди відповідають поза зміною. Робота поза зміною — ознака дірки в покритті, а не відданості.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на всіх, хто веде лінію CS за графіком: представників low-touch (Sales & Service Representative), Key Account Representatives, Customer Experience Specialist і CS супервайзерів.","indent":false},{"t":"p","text":"3.2. Для Netcor політика діє в частині передачі зміни і присутності на лінії; умови праці визначає договір.","indent":false},{"t":"p","text":"3.3. Політика НЕ встановлює години змін, кількість людей і покриття. Це STD-06.","indent":false},{"t":"p","text":"3.4. Політика НЕ регулює відпустки, лікарняні та оплату праці. Це кадрові документи компанії.","indent":false},{"t":"p","text":"3.5. Політика НЕ описує порядок передачі зміни покроково. Це SOP-1.6 і TPL-06.","indent":false},{"t":"h","text":"4. Модель змінності і стани присутності"},{"t":"p","text":"4.1. Лінія low-touch працює цілодобово у три зміни з ротацією 3/3: ранкова 07:00– 14:00, денна 14:00–23:00, нічна 23:00–07:00 за Києвом (у Chicago відповідно 23:00– 06:00, 06:00–15:00, 15:00–23:00). Key Account Representatives працюють 15:00–01:00 за Києвом (07:00–17:00 Chicago); поза цим часом їхніх клієнтів приймає лінія low-touch (POL-09 п. 4.8). Customer Experience Specialist працює 15:00–00:00 за Києвом (07:00–16:00 Chicago); поза цим часом звернення щодо самостійних замовлень приймає лінія low-touch (POL-09 п. 4.9).","indent":false},{"t":"p","text":"4.2. Нічна зміна складається з двох людей. Якщо на будь-якій зміні фактично лишається одна людина (неявка, укриття, втрата звʼязку), діють окремі правила: перерва лише з покриттям (п. 5.4), пріоритет вантажів у дорозі і на складі, перелік тригерів нічного виклику за POL-08.","indent":false},{"t":"p","text":"4.3. Співробітник на зміні в будь-який момент перебуває в одному стані. Стан видно команді в робочому каналі зміни.","indent":false},{"t":"table","rows":[["Стан","Що означає","Хто покриває лінію"],["На лінії","Приймає звернення, веде ордери","Сам"],["Перерва","Коротка відсутність за графіком STD-06","Названий колега зміни або резерв"],["Поза лінією","Навчання, розбір, нарада під час зміни","Названий колега зміни"],["Без звʼязку","Втрата світла, інтернету, укриття","Зміна за POL-05 п. 5.3"],["Передача","Остання частина зміни: передача ордерів наступній","Обидва до підтвердження прийому"]]},{"t":"p","text":"4.4. Зміна закінчується не за годинником, а підтвердженим прийомом. Доки наступна зміна не підтвердила прийом, відповідальність за лінію лишається на попередній.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Співробітник виходить на лінію в час початку зміни з робочим пристроєм, звʼязком і резервом за POL-05 п. 5.1, а не починає готуватися в цей час.","indent":false},{"t":"p","text":"5.2. Після закінчення зміни співробітник передає її за SOP-1.6 і TPL-06 і проговорює наступній зміні кожного клієнта зі свого списку:","indent":false},{"t":"p","text":"клієнтів, які мають приїхати на локацію під час наступної зміни (вантажівка, відвантаження, reload); незавершені ордери, які потрібно довести до кінця; клієнтів, яким обіцяно передзвонити або надіслати оновлення, — з часом, до якого це обіцяно.","indent":true},{"t":"p","text":"По кожному пункту наступний крок і строк записано в Order chat. Усна передача без запису не вважається виконаною.","indent":false},{"t":"p","text":"5.3. Наступна зміна підтверджує прийом явно в робочому каналі. Мовчання не є прийомом.","indent":false},{"t":"p","text":"5.4. На зміні з однією людиною перерва починається лише після того, як названий колега (резерв за графіком STD-06) підтвердив, що бере лінію.","indent":false},{"t":"p","text":"5.5. Про запізнення чи неможливість вийти на зміну співробітник повідомляє CS супервайзера якомога раніше, але не пізніше строку STD-06, щоб встигнути знайти заміну.","indent":false},{"t":"p","text":"5.6. Обмін змінами між співробітниками можливий, якщо обидва погодили його з CS супервайзером до зміни і графік оновлено.","indent":false},{"t":"h","text":"6. Заборони і права співробітника"},{"t":"p","text":"6.1. Заборонено залишати лінію без покриття, зокрема коли «зараз тихо».","indent":false},{"t":"p","text":"6.2. Заборонено йти зі зміни без підтвердженого прийому, навіть якщо зміна формально закінчилася. Якщо прийом затримується понад строк STD-06, повідомляється CS супервайзер.","indent":false},{"t":"p","text":"6.3. Заборонено вести ордери поза зміною з особистих пристроїв і акаунтів (POL-02, POL-04).","indent":false},{"t":"p","text":"6.4. Співробітник має право не відповідати на робочі повідомлення поза зміною, крім випадків, коли він у цей час є резервом за графіком. Невідповідь поза зміною не оцінюється і не впливає на рішення щодо співробітника.","indent":false},{"t":"p","text":"6.5. Співробітник має право перервати роботу на час повітряної тривоги і піти в укриття (POL-05 п. 7.4).","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. На лінії завжди є хоча б одна людина, яка відповідає клієнтам з вантажем у дорозі або на складі.","indent":false},{"t":"p","text":"7.2. Передача зміни з підтвердженням прийому — навіть у кризі за POL-05, коли зміна передається коротко.","indent":false},{"t":"p","text":"7.3. Право на укриття (п. 6.5) і право не відповідати поза зміною (п. 6.4).","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Наступна зміна не вийшла або не підтвердила прийом: попередня зміна лишається на лінії і повідомляє CS супервайзера. Якщо супервайзер недоступний — Oksana.","indent":false},{"t":"p","text":"8.2. На лінії не лишається жодної людини (усі без звʼязку, хвороба, укриття): оголошується криза за POL-05.","indent":false},{"t":"p","text":"8.3. Повторні запізнення або залишення лінії без покриття: CS супервайзер повідомляє Oksana; розбір з фактами, а не з оцінками.","indent":false},{"t":"p","text":"8.4. Співробітника систематично просять працювати поза зміною: Oksana переглядає покриття в STD-06, а не просить терпіти.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із п. 7.1 немає.","indent":false},{"t":"p","text":"9.2. Робота поза зміною за власною ініціативою (завершити ордер, який людина вела) допускається, якщо зафіксована в Order chat і не стає системою.","indent":false},{"t":"p","text":"9.3. Тимчасова зміна графіка для окремого співробітника затверджується Oksana і фіксується в REG-04 зі строком.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи лінія покрита і чи не губиться ордер між змінами, а не годинами присутності.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Хвилини без покриття","Сумарний час за місяць, коли на лінії не було жодної людини в стані «На лінії»","0"],["Втрати на передачі","Кількість ордерів, по яких клієнт звернувся сам, бо наступна зміна не знала про відкрите питання","0"],["Підтверджений прийом","Частка змін, що закінчилися явним підтвердженням прийому","100%"],["Робота поза зміною","Кількість звернень до співробітників поза зміною, крім резерву","Без цілі; зростання — сигнал, що покриття STD-06 недостатнє"]]},{"t":"p","text":"10.2. Останній показник захищає людей: якщо він росте, змінюється графік, а не очікування від співробітників.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Oksana: власник політики, модель змін, перегляд покриття за п. 8.4, винятки з графіка.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики.","indent":false},{"t":"p","text":"11.3. CS супервайзер: графік і резерви, заміни при неявці, контроль передачі змін.","indent":false},{"t":"p","text":"11.4. Співробітник: вихід на лінію вчасно і готовим, передача і прийом зміни, повідомлення про неможливість вийти.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-02, POL-04 (робота лише з робочих пристроїв і акаунтів), POL-05 (безперервність), POL-08 (нічний виклик), POL-09 (моделі обслуговування).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-06 (години, склад, покриття).","indent":false},{"t":"p","text":"12.3. Процедури: SOP-1.6 (передача зміни), SOP-7.4.","indent":false},{"t":"p","text":"12.4. Шаблони і записи: TPL-06 (передача зміни), REG-04 (винятки).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Блокують затвердження:","indent":false},{"t":"p","text":"13.1. STD-06: години змін, тривалість і графік перерв, строк повідомлення про неявку, строк затримки прийому, свята і вихідні.","indent":true},{"t":"p","text":"13.2. Резерв для зміни, на якій лишилася одна людина (п. 5.4): хто конкретно і чи оплачується черговість.","indent":true},{"t":"p","text":"Не блокують, але потрібні до версії 1.0:","indent":false},{"t":"p","text":"13.3. Де видно стан присутності (п. 4.3): статус у Dialpad, Teams чи окремий канал зміни.","indent":true},{"t":"p","text":"13.4. Чи поширюється право не відповідати поза зміною (п. 6.4) на Key Account Representatives, яким ключові клієнти пишуть напряму.","indent":true},{"t":"p","text":"13.5. Звірити з драфтом 0.2: що з нього не потрапило у v0.3. Відповідає Oksana.","indent":true},{"t":"p","text":"13.6. Графік Key Account Representatives привʼязаний до Києва чи до Chicago. Різниця зазвичай 8 годин, але США і Європа переводять годинник у різні дати: у березні й наприкінці жовтня — на початку листопада вона на кілька тижнів стає 7 годин. Зміна зсувається на годину або за Києвом, або для клієнтів.","indent":true},{"t":"p","text":"13.7. Київська нічна зміна (23:00–07:00) — це друга половина робочого дня в Chicago (15:00–23:00), тобто час активних відвантажень. Справді тиха для клієнтів у США — ранкова зміна (07:00–14:00 Київ = 23:00–06:00 Chicago). Нічна зміна укомплектована двома людьми, що відповідає навантаженню. Перевірити, скільки людей потрібно на ранковій зміні, — за фактичним навантаженням у STD-06.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.3","09.11.2026","Oksana","Переписано в L1-форматі. Пʼять станів присутності, зміна закінчується підтвердженим прийомом, графік Key Account Representatives і нічна зміна. Додано показники результату."],["0.2","06.09.2026","Oksana","Модель змінності: три зміни, ротація 3/3, нічна зміна з однією людиною. Tier підвищено з 2 до 1."]]}]},"POL-14":{"code":"POL-14","title":"Політика управління партнерами","source":"pdf","meta":{"Код":"POL-14","Рівень":"L1 Політика","Зона":"Партнери","Tier":"2 — відкладений","Власник":"Andrew","Підготувала":"Oksana","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.1","Перегляд":"Раз на рік або при підключенні чи відключенні локації"},"status":"Чернетка","version":"0.1","date":"Nov 9, 2026","blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"table","rows":[["Поле","Значення"],["Код","POL-14"],["Рівень","L1 Політика"],["Зона","Партнери"],["Tier","2 — відкладений"],["Власник","Andrew"],["Підготувала","Oksana"],["Затверджує","Андрій Кулик"],["Статус","Чернетка, v0.1"],["Перегляд","Раз на рік або при підключенні чи відключенні локації"]],"passport":true},{"t":"p","text":"1.1. Документ підготовлено як СТРУКТУРУ з боку CS. Знання про партнерів зараз тримаються на експертизі однієї людини — Andrew. Мета першої версії — перенести ці знання з голови в систему, щоб CS міг працювати з локацією без дзвінка Andrew щоразу.","indent":false},{"t":"p","text":"1.2. Розділи 4 і 5 сформульовано як пропозицію. Їх наповнює і підтверджує власник (розділ 13).","indent":false},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Клієнт отримує ту саму якість послуги на будь-якій локації Freitty, хоча фізично роботу виконує партнер. Для клієнта партнер невидимий: він працює з Freitty.","indent":false},{"t":"p","text":"2.2. Знання про кожного партнера (контакти, години, що він вміє, що ні, як з ним говорити) живуть у картці партнера, а не в памʼяті однієї людини. Відсутність Andrew не зупиняє роботу з жодною локацією.","indent":false},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Партнер у цій політиці — склад або локація, яка фізично виконує послуги Freitty (cross-dock, reload, storage, restack/rework, локальна доставка) у мережі хабів: Chicago, Denver, Columbus, Markham (Ontario), Reno, Stockton, San Bernardino, Greenville та нових.","indent":false},{"t":"p","text":"3.2. Політика поширюється на всіх, хто взаємодіє з партнерами: CS, команду ключових клієнтів, transport team і власника політики.","indent":false},{"t":"p","text":"3.3. Політика НЕ регулює carrier’ів, брокерів і owner-operator’ів. Це POL-19.","indent":false},{"t":"p","text":"3.4. Політика НЕ визначає комерційні умови з партнером (ставки, договір). Це рішення власника і керівництва, не CS.","indent":false},{"t":"p","text":"3.5. Політика НЕ описує операційні кроки роботи з локацією. Це SOP-5.1 і SOP-5.6.","indent":false},{"t":"h","text":"4. Позиція компанії: стани партнера"},{"t":"p","text":"4.1. Кожен партнер перебуває в одному стані. Стан видно CS у картці партнера, щоб агент знав, чи можна приймати замовлення на цю локацію.","indent":false},{"t":"table","rows":[["Стан","Що може CS","Хто переводить","Умова"],["Підключення","Нічого; замовлення не приймаються","Власник","Партнер проходить онбординг і підписує контракти; картка заповнюється"],["Активний","Приймати замовлення на всі послуги з картки","Власник","Контракти підписано, онбординг завершено, картка заповнена, контакти перевірені, CS проінструктований"],["Обмежений","Приймати лише частину послуг або з умовами з картки","Власник","Тимчасова проблема на локації (ремонт, нестача людей, якість)"],["Призупинений","Не приймати нові; вести лише вантажі, що вже на локації","Власник","Серйозний інцидент або ризик для вантажу клієнта"],["Відключений","Нічого; клієнтам пропонується інша локація","Власник","Завершення співпраці"]]},{"t":"p","text":"4.2. Локація, на яку CS приймає замовлення, має картку партнера. Без картки локація вважається в стані «Підключення».","indent":false},{"t":"p","text":"4.3. Перед клієнтом Freitty відповідає за роботу партнера як за свою. CS не каже клієнту «це склад винен» (POL-09 п. 6.1).","indent":false},{"t":"p","text":"4.4. Зміна стану партнера повідомляється CS до того, як вона набуде чинності, а не після першого зірваного замовлення.","indent":false},{"t":"p","text":"4.5. Партнер стає активним лише після онбордингу і підписання контрактів. Поки контракти не підписано, жодне замовлення на локацію не приймається, навіть разово і навіть якщо локація готова працювати.","indent":false},{"t":"p","text":"4.6. Оператори CS отримують по кожній активній локації готовий прайс і правила роботи та працюють лише за ними. Оператор не уточнює ціну чи умови з партнером самостійно: якщо ситуації немає в прайсі чи правилах, питання йде власнику (POL-03 п. 8.2), а відповідь додається в правила, щоб наступного разу питання не виникло.","indent":false},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Кожен партнер має картку: прайс локації і правила роботи для операторів, адреса, години роботи і приймання, контакти (основний і резервний, включно з нічним, якщо є), послуги, обмеження (hazmat, вага, висота, кількість доків), особливості (запис на слот, документи на воротах), часовий пояс.","indent":false},{"t":"p","text":"5.2. Картку веде власник політики. CS повідомляє власнику, коли бачить у картці неактуальну інформацію; власник оновлює її протягом строку SOP-5.1.","indent":false},{"t":"p","text":"5.3. Кожен інцидент на локації (пошкодження, недостача, затримка, відмова прийняти) фіксується в Order chat і передається власнику того ж дня. Повторювані інциденти однієї локації — підстава переглянути її стан.","indent":false},{"t":"p","text":"5.4. Новий агент CS до допуску (SOP-6.4) знайомиться з картками всіх активних локацій.","indent":false},{"t":"p","text":"5.5. Раз на квартал власник переглядає кожного партнера: інциденти, скарги клієнтів, повнота картки. За результатом стан підтверджується або змінюється.","indent":false},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено приймати замовлення на локацію в стані «Підключення», «Призупинений» або «Відключений».","indent":false},{"t":"p","text":"6.2. Заборонено обіцяти клієнту послугу, якої немає в картці локації, без підтвердження власника або локації письмово.","indent":false},{"t":"p","text":"6.3. Заборонено передавати партнеру дані клієнта понад потрібне для виконання ордера (POL-02 п. 6.6) і ціни Freitty для клієнта (POL-06 п. 6.4).","indent":false},{"t":"p","text":"6.4. Заборонено домовлятися з партнером про зміну комерційних умов від імені CS.","indent":false},{"t":"p","text":"6.5. Заборонено звинувачувати партнера перед клієнтом (POL-09 п. 6.1).","indent":false},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Вантаж клієнта, який уже на локації, ведеться до кінця в будь-якому стані партнера, включно з «Призупинений».","indent":false},{"t":"p","text":"7.2. Повідомлення клієнта про проблему на локації, що зачіпає його вантаж, до того, як він дізнається сам (POL-06 п. 4.5).","indent":false},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Локація не відповідає, а вантаж клієнта чекає: CS дзвонить на резервний контакт з картки, далі — власнику. Строки — STD-12.","indent":false},{"t":"p","text":"8.2. Пошкодження, втрата чи недостача на локації: власник і Andy Havryliuk за POL-17 того ж дня.","indent":false},{"t":"p","text":"8.3. Локація відмовляється виконувати підтверджене замовлення: власник негайно; CS паралельно шукає альтернативу для клієнта за POL-08.","indent":false},{"t":"p","text":"8.4. Конфлікт або агресивна поведінка працівника локації: за POL-09 п. 8.7–8.8.","indent":false},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Замовлення на послугу поза карткою локації можливе разово за письмовим підтвердженням власника і локації в Order chat.","indent":false},{"t":"p","text":"9.2. Інше відхилення затверджує власник політики і фіксує в REG-04.","indent":false},{"t":"h","text":"10. Показники результату"},{"t":"p","text":"10.1. Політика вимірюється тим, чи клієнт отримує однакову якість на всіх локаціях і чи може CS працювати з локацією без Andrew.","indent":false},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Інциденти на 100 ордерів","Кількість інцидентів (пошкодження, недостача, затримка, відмова) на 100 ордерів по кожній локації","Без цілі; порівнюється між локаціями, найгірша розбирається"],["Повнота карток","Частка активних локацій із повністю заповненою і актуальною карткою","100%"],["Звернення до власника","Кількість питань CS до Andrew, на які відповідь мала бути в картці","Має знижуватися до нуля"],["Скарги клієнтів по локації","Частка скарг (POL-07), причиною яких є робота локації","Без цілі; порівнюється між локаціями"]]},{"t":"p","text":"10.2. «Звернення до власника» — показник того, чи знання переїхали з голови в систему. Кожне таке питання — рядок, якого бракує в картці.","indent":false},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Andrew: власник політики, картки партнерів, стани, квартальний перегляд, звʼязок з партнерами щодо інцидентів.","indent":false},{"t":"p","text":"11.2. Андрій Кулик: затвердження політики, комерційні умови з партнерами.","indent":false},{"t":"p","text":"11.3. Oksana: навчання CS роботі з картками, передача власнику питань і інцидентів від CS.","indent":false},{"t":"p","text":"11.4. Агент CS: приймання замовлень лише на активні локації в межах картки, фіксація інцидентів, повідомлення про неактуальну картку.","indent":false},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-02 (персональні дані), POL-06 (обслуговування клієнта), POL-07 (скарги), POL-08 (ескалація), POL-09 (комунікація), POL-16 (hazmat), POL-17 (пошкодження і претензії), POL-19 (carrier’и і брокери).","indent":false},{"t":"p","text":"12.2. Стандарти: STD-12 (строки ескалації).","indent":false},{"t":"p","text":"12.3. Процедури: SOP-5.1, SOP-5.6, SOP-6.4 (допуск агента).","indent":false},{"t":"p","text":"12.4. Записи: REG-04 (винятки).","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"До затвердження:","indent":false},{"t":"p","text":"13.1. Підтвердження Andrew: чи відповідають стани п. 4.1 тому, як реально працюють партнери, і хто, крім нього, може змінювати стан.","indent":true},{"t":"p","text":"13.2. Де живе картка партнера: Freitty Hub, HubSpot (компанія-партнер) чи окрема сторінка Notion. CS має бачити її з ордера.","indent":true},{"t":"p","text":"13.3. Первинне наповнення карток для всіх восьми хабів. Без цього п. 4.2 переведе всі локації в «Підключення».","indent":true},{"t":"p","text":"13.4. Хто заміщує Andrew у його відсутність для рішень за п. 8.1 і 8.3.","indent":true},{"t":"p","text":"13.6. Що входить в онбординг партнера (знайомство з процесами Freitty, тестове замовлення, навчання роботі з Freitty Hub) і хто його проводить. Які контракти підписуються і де вони зберігаються.","indent":true},{"t":"p","text":"Не блокують:","indent":false},{"t":"p","text":"13.5. Чи всі хаби — партнерські, чи частина — власні склади Freitty. Для власних політика може діяти у спрощеному вигляді.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.1","09.11.2026","Oksana","Перший драфт як структура з боку CS. Пʼять станів партнера, картка партнера як джерело знань замість однієї людини. Додано показники результату. Потребує наповнення і підтвердження власником."]]}]},"SOP-1.9":{"code":"SOP-1.9","title":"Робоча зміна Sales & Service Representative: від входу до виходу","source":"pdf","meta":{"Код":"SOP-1.9","Рівень":"L3 Процедура","Потік":"1.0 Contact-to-Resolution","Tier":"0 — критичний","Власник":"Oksana","Затверджує":"Андрій Кулик","Перегляд":"щоквартально","Виконавець":"Sales & Service Representative лінії (денна і нічна зміни)","Статус":"Чернетка, v0.1"},"status":"Чернетка","version":"0.1","date":"Nov 16, 2026","blocks":[{"t":"h","text":"1. Паспорт"},{"t":"p","text":"1.1 Код: SOP-1.9. Рівень: L3 Процедура. Потік: 1.0 Contact-to-Resolution. Tier: 0 — критичний.","indent":false},{"t":"p","text":"1.2 Власник: Oksana. Затверджує: Андрій Кулик. Версія: 0.1 (чернетка). Перегляд: щоквартально.","indent":false},{"t":"p","text":"1.3 Виконавець: Sales & Service Representative лінії (денна і нічна зміни).","indent":false},{"t":"h","text":"2. Призначення і межі"},{"t":"p","text":"2.1 Процедура визначає, що робить представник від входу в зміну до виходу, щоб жодне звернення не залишилось без власника і наступного кроку.","indent":false},{"t":"p","text":"2.2 Результат зміни — закриті операції (вирішені звернення, підтверджені замовлення) і черга, передана наступній зміні з підтвердженням. Кількість дзвінків і відпрацьовані години результатом не є.","indent":false},{"t":"p","text":"2.3 Документ описує лише послідовність етапів і умови переходу між ними. Як виконати кожен крок — у пов'язаних процедурах (розділ 12).","indent":false},{"t":"p","text":"2.4 Документ НЕ описує: обробку окремого дзвінка (SOP-1.1), листа (SOP-1.2), формат передачі зміни (SOP-1.6, TPL-06), суть ескалації (POL-08), години змін (STD-06, POL-13), роботу Key Clients Representatives, CX Specialist і Netcor.","indent":false},{"t":"h","text":"3. Стани зміни"},{"t":"p","text":"стани зміни · 5 основних, 3 тимчасові","indent":false},{"t":"p","text":"3.1 У кожен момент зміни представник перебуває рівно в одному стані. Перехід до наступного можливий лише після виконання умови переходу етапу.","indent":false},{"t":"p","text":"3.2 «Обробка контакту», «Перерва» і «Збій» — тимчасові стани: з кожного представник повертається в «На лінії». «Збій» може настати і під час підготовки (п. 4.5).","indent":false},{"t":"p","text":"3.3 Статус у Dialpad відповідає стану: Unavailable — підготовка і прийом зміни; Available — на лінії; Break — перерва; Offline — після підтвердженої передачі.","indent":false},{"t":"h","text":"4. Етап 1: підготовка (за 15 хв до початку)"},{"t":"p","text":"4.1 Представник входить за 15 хвилин до початку зміни. У Dialpad стоїть статус «Unavailable», дзвінки на нього ще не йдуть.","indent":false},{"t":"p","text":"4.2 Перевірити живлення, інтернет, гарнітуру і резервний канал зв'язку (SOP-E.4).","indent":false},{"t":"p","text":"4.3 Увійти в усі робочі системи: Dialpad, HubSpot, Freitty Hub, скриньки cs@freitty.com і orders@freitty.com, робочі канали команди в Teams або Telegram.","indent":false},{"t":"p","text":"4.4 Прочитати повідомлення в каналі команди за час своєї відсутності: зміни процесів, хаби, ціни, проблемні замовлення.","indent":false},{"t":"p","text":"4.5 Умова переходу далі: усі системи працюють. Якщо хоч одна не працює — це стан «Збій» (SOP-4.7): повідомити старшого зміни до початку зміни, а не після.","indent":false},{"t":"h","text":"5. Етап 2: прийом зміни (перші 15 хв)"},{"t":"p","text":"5.1 Прочитати передачу попередньої зміни (SOP-1.6, TPL-06). Кожен пункт — це звернення з власником, станом, наступним кроком і терміном.","indent":false},{"t":"p","text":"5.2 Підтвердити прийом у каналі команди словом «Прийнято». З цього моменту відповідальність за всі пункти передачі на тобі.","indent":false},{"t":"p","text":"5.3 Незрозумілий пункт уточнити у попередньої зміни, поки вона на зв'язку. Пункт без уточнення не приймається мовчки.","indent":false},{"t":"p","text":"5.4 Перевірити чотири черги: пропущені дзвінки (SOP-1.7), листи без відповіді в cs@ і orders@, повідомлення в месенджерах, обіцяні клієнтам дзвінки й апдейти з терміном на цю зміну.","indent":false},{"t":"p","text":"5.5 Розібрати хвіст: передзвонити на пропущені, відповісти на письмові звернення (STD-02), поставити собі нагадування на кожну обіцянку з терміном.","indent":false},{"t":"p","text":"5.6 Умова переходу далі: передачу підтверджено, хвіст розібрано або кожен пункт має власника і час. Після цього — статус «Available» у Dialpad.","indent":false},{"t":"h","text":"6. Етап 3: робота на лінії"},{"t":"p","text":"6.1 Порядок пріоритетів, коли одночасно є кілька задач:","indent":false},{"t":"p","text":"1. Вхідний дзвінок — відповісти одразу (STD-01). 2. Пропущений дзвінок — передзвонити (SOP-1.7). 3. Лист, SMS, месенджер — відповісти протягом 10 хв (STD-02). 4. Обіцяні клієнту апдейти і follow-up по активних замовленнях. 5. Проактивні дії: нагадування про appointment (SOP-3.2), ліди (SOP-2.2).","indent":false},{"t":"p","text":"6.2 Кожен контакт проходить один цикл: прийняти → ідентифікувати клієнта (SOP-1.4) → класифікувати (SOP-1.5, SOP-2.1) → вирішити або передати власнику → залогувати в HubSpot (SOP-7.1) → закрити або призначити наступний крок із терміном.","indent":false},{"t":"p","text":"6.3 Ціль кожного контакту — вирішення з першого звернення. Якщо це неможливо, клієнт чує, хто і коли повернеться до нього, а обіцянка записується в HubSpot.","indent":false},{"t":"p","text":"6.4 Логування робиться одразу після контакту, а не в кінці зміни. Контакт без запису вважається таким, що не відбувся.","indent":false},{"t":"p","text":"6.5 Транспортне питання кваліфікується до трансферу. Перед трансфером — попередження в каналі Freitty Ternopil (SOP-S8.1).","indent":false},{"t":"p","text":"6.6 Коли черга порожня: переглядати всі канали щонайменше кожні 15 хв, робити follow-up по відкритих замовленнях, доповнювати записи в HubSpot.","indent":false},{"t":"h","text":"7. Етап 4: перерва"},{"t":"p","text":"7.1 Перед перервою переконатися, що на лінії залишається хтось інший. На зміні з двох людей перерви не збігаються.","indent":false},{"t":"p","text":"7.2 Обіцянку, термін якої спливає під час перерви, передати колезі в каналі команди до виходу на перерву.","indent":false},{"t":"p","text":"7.3 Поставити статус «Break» у Dialpad і написати в канал, на скільки виходиш.","indent":false},{"t":"p","text":"7.4 Після повернення спершу перевірити пропущене за час перерви, потім ставити статус «Available».","indent":false},{"t":"p","text":"7.5 Тривалість і кількість перерв визначає POL-13.","indent":false},{"t":"h","text":"8. Етап 5: завершення і передача (останні 30 хв)"},{"t":"p","text":"8.1 За 30 хв до кінця не починати нових проактивних задач. Вхідні дзвінки і звернення приймаються до останньої хвилини.","indent":false},{"t":"p","text":"8.2 Кожне відкрите звернення або закрити, або описати: стан, наступний крок, термін, що пообіцяно клієнту.","indent":false},{"t":"p","text":"8.3 Заповнити передачу зміни (SOP-1.6, TPL-06). У передачу йде лише те, що потребує дії наступної зміни.","indent":false},{"t":"p","text":"8.4 Опублікувати передачу в каналі команди і дочекатися «Прийнято» від наступної зміни. Без підтвердження зміна не вважається переданою.","indent":false},{"t":"p","text":"8.5 Якщо наступна зміна не вийшла на зв'язок — повідомити старшого зміни і залишатися на лінії до його рішення.","indent":false},{"t":"p","text":"8.6 Після підтвердження — статус «Offline» у Dialpad, щоб дзвінки не йшли на тебе.","indent":false},{"t":"p","text":"8.7 Зміна завершена, коли: кожен контакт залоговано в HubSpot, кожне відкрите звернення має власника, передачу підтверджено.","indent":false},{"t":"h","text":"9. Ескалація і нестандартні ситуації"},{"t":"p","text":"9.1 Ескалація — це передача звернення власнику через картку ескалації (TPL-05). Вона не знімає з представника стеження, доки власник не підтвердив прийом.","indent":false},{"t":"p","text":"9.2 Умови ескалації під час зміни:","indent":false},{"t":"p","text":"Система (Dialpad, HubSpot, Freitty Hub, пошта) не працює → SOP-4.7, старшому зміни. Немає світла або інтернету → SOP-E.4. Скарга клієнта → SOP-4.1; агресивна розмова → SOP-4.2. Підозра на hazmat → стоп-процедура SOP-4.6. Пошкодження або втрата вантажу → SOP-4.5. Питання поза повноваженнями (ціна, знижка, кредит, виняток з правил) → POL-08. Пропущений дзвінок не вдається передзвонити або лист не встигає в норму STD-02 через навантаження → старшому зміни. Наступна зміна не вийшла на зв'язок → старшому зміни (п. 8.5).","indent":true},{"t":"p","text":"9.3 Якщо ситуація не підпадає під жодну умову і представник не знає, що робити, — це теж ескалація старшому зміни, а не очікування.","indent":false},{"t":"h","text":"10. Що ніколи не деградує"},{"t":"p","text":"10.1 Ці правила діють навіть під час перевантаження, збою чи неповної зміни.","indent":false},{"t":"p","text":"10.2 Кожен вхідний дзвінок отримує відповідь або зворотний дзвінок.","indent":false},{"t":"p","text":"10.3 Обіцянка клієнту не губиться при зміні: вона або виконана, або в передачі з терміном.","indent":false},{"t":"p","text":"10.4 Кожне звернення має одного власника. Звернення «нічиє» не існує.","indent":false},{"t":"p","text":"10.5 Питання про hazmat ставиться в кожному замовленні на транспорт, без винятків.","indent":false},{"t":"p","text":"10.6 Водію не повідомляють ціни, операційних деталей і даних клієнта.","indent":false},{"t":"p","text":"10.7 Клієнту називають лише чинні способи оплати: Stripe і EFS.","indent":false},{"t":"h","text":"11. Як вимірюємо результат зміни"},{"t":"p","text":"11.1 Зміну оцінюємо за закритими операціями, а не за кількістю дзвінків чи часом у системі. Визначення і бази розрахунку — у SOP-7.3.","indent":false},{"t":"p","text":"11.2 Показники зміни:","indent":false},{"t":"p","text":"FCR — частка звернень, вирішених з першого контакту. Resolution rate — частка звернень, закритих протягом зміни. Дотримання SLA: дзвінки за STD-01, письмові звернення за STD-02. Передача: 100% змін передано з підтвердженням «Прийнято». 0 звернень без власника і 0 прострочених обіцянок клієнту на кінець зміни.","indent":true},{"t":"h","text":"12. Пов'язані документи"},{"t":"p","text":"12.1 POL-06, POL-08, POL-13; STD-01, STD-02, STD-05, STD-06; PRC-1.0; SOP-1.1–1.8, SOP-2.1, SOP-2.2, SOP-3.2, SOP-4.1, SOP-4.2, SOP-4.5, SOP-4.6, SOP-4.7, SOP-7.1, SOP-7.3, SOP-E.4, SOP-S8.1; TPL-05, TPL-06.","indent":false},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"Код SOP-1.9 — додати рядок у реєстр REG-06. Години змін у двох часових поясах і тривалість перекриття змін (FLAG-2). Хто «старший зміни» на кожній зміні — одна конкретна особа. Один робочий канал команди: Teams чи Telegram. Поки HubSpot-поля передачі зміни не створені, передача йде через TPL-06 — підтвердити. Через скільки хвилин недоступна система вважається збоєм. Тривалість перерв і пост-обробки контакту (POL-13). Чи застосовується процедура до Netcor повністю чи лише в частині передачі зміни.","indent":true},{"t":"h","text":"14. Історія версій"},{"t":"p","text":"0.1 · 16.11.2026 · Первинна чернетка · Oksana","indent":true}]},"SOP-1.7":{"code":"SOP-1.7","title":"Пропущені дзвінки і зворотний виклик","source":"md","meta":{"Рівень":"L3 Процедура","Потік":"1.0 Звернення","Tier":"0 - критичний","Власник":"Oksana","Статус":"Чернетка, v0.1","Джерело":"Дизайн-сесія, жовтень 2026"},"status":"Чернетка","version":"0.1","related":["STD-01","STD-19","SOP-1.1","SOP-1.6","TPL-01","TPL-06","SOP-7.1"],"blocks":[{"t":"h","text":"1. Мета"},{"t":"p","text":"Жоден абонент, який не додзвонився, не залишається без спроби зв'язку. Процедура визначає, **хто** передзвонює, **у якому порядку** і **як фіксується результат**. Строки — у STD-01 (див. пропозицію `proposals/STD-01-callback.md`)."},{"t":"h","text":"2. Чому це критично (дані 19–23.10.2026, будні)"},{"t":"li","text":"222 унікальні номери мали втрачений дзвінок; 150 з них за тиждень так і не поговорили з нами вхідним дзвінком."},{"t":"li","text":"З цих 150: розмова після передзвону — 40%, автовідповідач або без відповіді — 27%, спроба обірвалась — 4%, **жодної спроби — 29%**."},{"t":"li","text":"Охоплення абонентів з урахуванням передзвонів — ~76%; без них — ~63%."},{"t":"h","text":"3. Ролі"},{"t":"table","rows":[["Роль","Відповідальність"],["**Власник черги передзвонів**","Одна названа людина на кожній зміні; призначається в боті змін на початку зміни. Якщо на зміні одна людина — вона"],["Оператори зміни","Живий дзвінок завжди має пріоритет над передзвоном (STD-19)"],["Head of Customer Support","Щоденний контроль звіту по черзі"]]},{"t":"h","text":"4. Порядок дій"},{"t":"table","rows":[["Крок","Дія","Хто"],["1. Тригер","Вхідний дзвінок завершився як Canceled (абонент кинув трубку) або Missed (дочекався, ніхто не відповів) → номер у черзі передзвонів","Система / власник черги"],["2. Склеювання","Кілька втрачених дзвінків з одного номера за 24 год = одна задача з лічильником спроб клієнта","Система / власник черги"],["3. Перевірка","Якщо після втраченого дзвінка з номером уже була розмова — задача закривається з кодом «Вже на зв'язку»","Власник черги"],["4. Відсіювання","Внутрішні номери, позначені як спам; номер з аномальною кількістю спроб без жодної розмови → на перевірку, не в чергу","Власник черги"],["5. Пріоритет","P1–P3 (розділ 5)","Власник черги"],["6. Передзвін","За каденцією STD-01; лише в робочий час клієнта за його часовим поясом","Власник черги"],["7. Результат","Кожна спроба — з кодом результату (розділ 6) у кваліфікації дзвінка в HubSpot","Власник черги"],["8. Передача","Відкриті задачі з наступною спробою передаються за SOP-1.6","Власник черги → наступна зміна"]]},{"t":"p","text":"**Ранкова зміна** (ніч у США) не телефонує клієнтам: вона готує чергу — перевіряє номери, активні ордери, пріоритет. Передзвони виконують зміни, що працюють у робочий час клієнтів."},{"t":"h","text":"5. Пріоритети"},{"t":"table","rows":[["Пріоритет","Хто"],["**P1**","Невідомий номер (потенційний новий клієнт) · номер з ордером на сьогодні · два і більше втрачених дзвінки поспіль"],["**P2**","Відомий клієнт без активного ордера"],["**P3**","Підозра на спам або помилковий дзвінок — перевірити, потім відсіяти"]]},{"t":"h","text":"6. Коди результату"},{"t":"table","rows":[["Код","Значення"],["Дозвонились — опрацьовано","Розмова, далі за SOP-1.1"],["Дозвонились — не для нас","Помилка номером, спам, нецільовий"],["Голосове залишено","Чекаємо"],["Недоступний","Усі спроби каденції без результату"],["Вже на зв'язку","Клієнт сам додзвонився або написав"]]},{"t":"h","text":"7. Що сказати"},{"t":"li","text":"Передзвін: скрипт TPL-01 (Missed Call Callback)."},{"t":"li","text":"Голосове повідомлення: *«Hi, this is [Name] from Freitty — we missed your call. Please call us back at [number], or book online at [Instant Book link]. Talk soon!»*"},{"t":"h","text":"8. Метрики (визначення — у SOP-7.3)"},{"t":"table","rows":[["Метрика","Базлайн (жовтень 2026)"],["Охоплення спробою: % втрачених номерів з ≥1 спробою","~71%"],["% перших спроб у межах строку STD-01","не виміряно"],["Результативність: % втрачених, з якими поговорили","~40%"],["Охоплення абонентів з передзвонами","~76%"]]},{"t":"h","text":"9. Впровадження"},{"t":"li","ord":1,"text":"Вручну: власник черги на зміну, черга = список пропущених у Dialpad + задача в HubSpot на номер, коди в кваліфікації."},{"t":"li","ord":2,"text":"Через 2 тижні: автоматичне створення задач, склеювання, автозакриття, таймер (технічна реалізація — команда продукту)."},{"t":"li","ord":3,"text":"Автоматичне SMS після пропущеного дзвінка — лише після погодження з власником POL-01 / POL-02 щодо згоди на SMS."}]},"SOP-2.6":{"code":"SOP-2.6","title":"Правило трьох спроб і переведення в nurture","source":"md","meta":{"Рівень":"L3 Процедура","Потік":"2.0 Продажі","Tier":"0 - критичний","Власник":"Oksana","Статус":"Чернетка, v0.1","Джерело":"Дизайн-сесія, жовтень 2026"},"status":"Чернетка","version":"0.1","related":["SOP-2.5","SOP-2.7","STD-02","STD-18","SOP-1.6","SOP-1.7","TPL-15"],"blocks":[{"t":"h","text":"1. Сфера дії"},{"t":"p","text":"**Відкладена квота** — запит, який не можна оцінити або підтвердити на дзвінку: транспорт (через transport team), Rework (після фото), перевищення ваги, ємність хабу, нічний тариф. У даних HubSpot це кваліфікація **Channel Transfer** (~13% прийнятих дзвінків, ~21% часу вхідних розмов). Той самий порядок діє для YELLOW-запитів з Instant Book."},{"t":"p","text":"Процедура визначає, як відкладена квота доходить до рішення клієнта. Котирування — SOP-2.5. Строки — у STD (див. `proposals/STD-deferred-quote-timings.md`)."},{"t":"h","text":"2. Порядок дій"},{"t":"table","rows":[["Крок","Дія"],["1. На дзвінку","Зібрати мінімальний набір: компанія + MC/DOT, послуга, локація, дата і вікно часу, деталі вантажу, **підтверджений email**, бажаний канал. Наступний крок не повинен вимагати ще одного дзвінка"],["2. Запис","До кінця дзвінка створити відкладену квоту: тип, обіцяний час, власник"],["3. Вхідні дані","Транспорт → запит у transport team · Rework → посилання на завантаження фото, надіслане **під час дзвінка** · Ємність, вага, нічний тариф → запит хабу"],["4. Квота","PRO#, розбивка, посилання на підтвердження, термін дії (SOP-2.5)"],["5. Нагадування 1","Немає відповіді → нагадування в каналі клієнта"],["6. Нагадування 2","Перед завершенням терміну дії → «квота спливає»"],["7. Закриття","Код результату (розділ 4). Жодна квота не висить без результату довше строку STD"]]},{"t":"p","text":"**Власник:** оператор, який зробив переведення, — до кінця своєї зміни; далі квота переходить у спільну чергу відкладених звернень (разом із передзвонами SOP-1.7) і передається за SOP-1.6."},{"t":"p","text":"**Rework без фото:** нагадування клієнту; якщо фото не надійшли до кінця робочого дня клієнта — дзвінок."},{"t":"h","text":"3. Переведення в nurture"},{"t":"p","text":"Після трьох дотиків без рішення (квота + два нагадування) квота закривається з кодом «Програно — немає відповіді», клієнт переходить у nurture (повторний контакт — за правилами потоку 7.0 / утримання)."},{"t":"h","text":"4. Коди результату"},{"t":"table","rows":[["Код","Значення"],["Виграно","Створено ордер"],["Програно — ціна",""],["Програно — немає відповіді","Три дотики без реакції"],["Програно — конкурент / сам впорався",""],["Програно — не можемо обслужити","Хаб відмовив, вага, hazmat, немає перевізника"],["Повторна квота","Інша дата або умови → нова квота"]]},{"t":"p","text":"Причина фіксується за SOP-2.7."},{"t":"h","text":"5. Метрики"},{"t":"table","rows":[["Метрика","Базлайн"],["Конверсія відкладених квот у ордер","не відстежується системно (W11: ~50% як найкращий тиждень)"],["% квот, виданих у межах строку STD","не виміряно"],["Квоти без результату довше строку STD","невідомо; ціль — 0"]]}]},"POL-21":{"code":"POL-21","title":"Політика ролей і ознайомлення з базою знань","source":"claude-draft","status":"Чернетка","version":"0.1","date":"17.11.2026","meta":{"Рівень":"L1 Політика","Зона":"Люди","Tier":"1 — операційний","Власник":"Oksana (запропоновано)","Підготував":"Claude — проєкт на затвердження","Затверджує":"Андрій Кулик","Статус":"Чернетка, v0.1","Перегляд":"Раз на рік або при зміні складу ролей"},"related":["POL-04","POL-10","POL-13","SOP-6.2","SOP-6.4","REG-13"],"blocks":[{"t":"h","text":"1. Паспорт документа"},{"t":"p","text":"1.1. Документ підготовлено як ПРОЄКТ разом зі створенням вікі. Ролі взято з POL-04 п. 13.6, POL-09 п. 4.6 і POL-13 п. 4.1; порядок ознайомлення описує те, як працює вікі. До рішення власника документ не затверджується."},{"t":"h","text":"2. Мета"},{"t":"p","text":"2.1. Кожна людина, що працює з клієнтами Freitty, має одну робочу роль у базі знань. Роль визначає, з якими документами людина ознайомлюється до роботи і після кожної нової версії документа."},{"t":"p","text":"2.2. Керівник у будь-який момент бачить, хто, з якою версією якого документа і коли ознайомився, і хто ще ні."},{"t":"h","text":"3. Сфера дії і межі документа"},{"t":"p","text":"3.1. Політика поширюється на штат CS, команду ключових клієнтів, Customer Experience Specialist, Netcor і IT у частині систем CS."},{"t":"p","text":"3.2. Політика НЕ визначає доступи до систем. Це POL-04."},{"t":"p","text":"3.3. Політика НЕ визначає графік і зміни. Це POL-13 і STD-06."},{"t":"p","text":"3.4. Політика НЕ визначає оцінку якості роботи. Це POL-10."},{"t":"h","text":"4. Позиція компанії: ролі і права"},{"t":"p","text":"4.1. У базі знань сім робочих ролей:"},{"t":"table","rows":[["Роль","Хто це","Звідки"],["Sales & Service Representative","Лінія low-touch: вхідні звернення всіх клієнтів, цілодобово, у три зміни","POL-09 п. 4.6, POL-13 п. 4.1"],["Старший зміни / CS супервайзер","Оголошує кризу, приймає ескалації і передані розмови","POL-05, POL-08, POL-09 п. 8.1"],["Key Clients Representative","High-touch: ключові клієнти з особистим представником","POL-09 п. 4.6, POL-13"],["Customer Experience Specialist","Tech-touch: самостійні замовлення через кабінет та Instabook","POL-09 п. 4.6"],["Netcor","Підрядник на лінії за договором","POL-02, POL-04"],["Head of Customer Support","Керівник функції, власник більшості документів CS","Легенда реєстру"],["IT","Видача і відкликання доступів, REG-12, MFA","POL-04"]]},{"t":"p","text":"4.2. У самій базі знань три рівні прав:"},{"t":"table","rows":[["Рівень","Рівень доступу у вікі (Share)","Що може"],["Адміністратор","Owner або Editor","Бачить журнал ознайомлень, призначає людям ролі і документи з терміном, веде перелік обов'язкових документів для ролей"],["Працівник","Contributor","Читає базу знань, відмічає ознайомлення, бачить свої призначення"],["Читач","Viewer або Commenter","Лише читає; ознайомлення відмітити не може"]]},{"t":"p","text":"4.3. Ознайомлення прив'язане до версії документа. Нова версія документа вимагає нового ознайомлення від усіх, для кого документ обов'язковий."},{"t":"p","text":"4.4. Відмітку про ознайомлення ставить лише сама людина. Ніхто, включно з адміністратором, не може поставити, змінити або видалити її за іншу людину."},{"t":"h","text":"5. Зобовʼязання"},{"t":"p","text":"5.1. Роль людині призначає Head of Customer Support у вікі. Поки роль не призначено, людина обирає її сама, а керівник підтверджує або змінює."},{"t":"p","text":"5.2. Перелік обов'язкових документів для кожної ролі веде Head of Customer Support."},{"t":"p","text":"5.3. Адміністратор може призначити окремій людині документ з терміном ознайомлення, понад перелік її ролі."},{"t":"p","text":"5.4. Людина ознайомлюється з призначеним документом до терміну і відмічає це кнопкою «Ознайомлений(а)» на сторінці документа."},{"t":"p","text":"5.5. Ознайомлення з POL-01 і POL-02 відбувається до видачі доступів (POL-04 п. 5.2)."},{"t":"p","text":"5.6. Кожне ознайомлення, призначення і зміна ролі автоматично записуються в REG-13."},{"t":"h","text":"6. Заборони"},{"t":"p","text":"6.1. Заборонено відмічати ознайомлення за іншу людину або під чужим акаунтом (POL-04 п. 6.1)."},{"t":"p","text":"6.2. Заборонено відмічати ознайомлення з документом, який людина не прочитала."},{"t":"h","text":"7. Що не деградує ніколи"},{"t":"p","text":"7.1. Ознайомлення з POL-01, POL-02 і POL-04 до першого доступу до систем — у будь-якому режимі набору людей, зокрема термінового."},{"t":"h","text":"8. Ескалація"},{"t":"p","text":"8.1. Прострочене ознайомлення з обов'язковим документом: Head of Customer Support розбирає причину з людиною."},{"t":"h","text":"9. Винятки"},{"t":"p","text":"9.1. Винятків із п. 5.5 немає."},{"t":"h","text":"10. Показники результату"},{"t":"table","rows":[["Показник","Як рахується","Ціль"],["Виконання обов'язкових ознайомлень","Частка обов'язкових пар «людина — документ», де людина ознайомлена з поточною версією","100%"],["Прострочені призначення","Кількість призначень з минулим терміном","0"]]},{"t":"h","text":"11. Відповідальність"},{"t":"p","text":"11.1. Head of Customer Support: ролі, перелік обов'язкових документів, призначення, контроль журналу."},{"t":"p","text":"11.2. Працівник: ознайомлення до терміну і після кожної нової версії."},{"t":"p","text":"11.3. IT: видача доступів лише після ознайомлення за п. 5.5."},{"t":"h","text":"12. Повʼязані документи"},{"t":"p","text":"12.1. Політики: POL-04 (доступи), POL-10 (якість), POL-13 (робочий час)."},{"t":"p","text":"12.2. Процедури і записи: SOP-6.2 (онбординг), SOP-6.4 (допуск), REG-13 (журнал ознайомлень)."},{"t":"h","text":"13. Відкриті питання"},{"t":"p","text":"13.1. Чи «Старший зміни» (SOP-1.9) і «CS супервайзер» (POL-05, POL-08, POL-13) — одна роль."},{"t":"p","text":"13.2. Чи достатньо кнопки ознайомлення для підпису за POL-01 п. 5.6 і POL-02 п. 5.6, чи потрібен окремий підписаний документ."},{"t":"p","text":"13.3. Чи потрібна перевірка розуміння (кілька питань) для документів Tier 0."},{"t":"h","text":"14. Історія версій"},{"t":"table","rows":[["Версія","Дата","Автор","Зміни"],["0.1","17.11.2026","Claude (проєкт)","Перший проєкт разом зі створенням вікі: сім ролей, три рівні прав, ознайомлення за версією, журнал REG-13."]]}]}},"proposals":[{"id":"POL-06-mandat","for":["POL-06"],"title":"Мандат CS — заміна розділу 3 «Позиція»","status":"Пропозиція","author":"Vlad","date":"2026-10-27","blocks":[{"t":"h","text":"Що робить відділ"},{"t":"p","text":"Customer Support — операційний центр клієнтського контакту Freitty. Відділ:"},{"t":"li","ord":1,"text":"приймає і кваліфікує весь вхідний попит у всіх каналах;"},{"t":"li","ord":2,"text":"створює ордери, коли клієнт звертається до нас, а не приїжджає одразу на склад; переводить у письмовий канал те, що не закривається на дзвінку;"},{"t":"li","ord":3,"text":"веде комунікацію по кожному активному ордеру до Closed + Paid як зв'язна ланка клієнт ↔ хаб ↔ перевізник — **по всіх ордерах, з якими клієнт звертається, включно зі створеними складом**;"},{"t":"li","ord":4,"text":"фільтрує і маршрутизує все, що не є попитом."},{"t":"h","text":"Чого відділ не робить"},{"t":"p","text":"Не навчає партнерів і не збирає з них гроші (партнерський напрям), не вирішує claims (Safety), не встановлює ціни і знижки, не чистить базу ордерів. Нецільовий попит фіксує як сигнал для партнерського напряму. Шум фільтрується технологією, а не людьми."},{"t":"h","text":"Вихідна робота з утримання"},{"t":"p","text":"Друга функція: асинхронна підготовка й дотики — на ранковій зміні (ніч у США); дзвінки клієнтам — у вікні до піку дня США. У пікові години вихідних дзвінків немає, поки охоплення нижче цілі."},{"t":"h","text":"Цільова функція"},{"t":"p","text":"**Кожен реальний абонент отримує розмову з людиною, кожен ордер, створений або супроводжений CS, доходить до Closed + Paid, і кожен клієнт першого замовлення отримує шлях до другого.** Пріоритет у такому порядку."},{"t":"h","text":"Метрики"},{"t":"li","text":"Головна: охоплення реальних абонентів за 7 днів (з урахуванням передзвонів). Базлайн ~76%; ціль 80% за 6 тижнів, 90% на квартал."},{"t":"li","text":"Доведення ордерів CS до Closed + Paid. Базлайн 85%."},{"t":"li","text":"Визначення — SOP-7.3; число цілей — STD-01."}]},{"id":"SOP-3-2-TPL-15-proaktyvni-statusy","for":["SOP-3.2","TPL-15","PRC-3.0"],"title":"Проактивні статуси ордера","status":"Пропозиція","author":null,"date":"2026-10-27","blocks":[{"t":"p","text":"**Проблема:** ~113 вхідних і ~92 вихідних дзвінки «статус / оновлення» на тиждень (~73 на 100 реальних ордерів, ~чверть часу розмов)."},{"t":"table","rows":[["Момент","Статус у Hub","Автоматичне повідомлення"],["1. Підтвердження","Accepted","Номер ордера, дата і час, адреса, інструкція check-in"],["2. День візиту","Accepted, день ETA","Нагадування: адреса, ворота, вимоги (BOL, MC)"],["3. Прибуття","Arrived to hub","Трак зареєстровано, роботу розпочато"],["4. Готово до оплати","Processed","Сума, посилання на оплату (POL-18)"],["5. Закриття","Closed / Paid","Оплату отримано, трак відпущено, квитанція, запит на відгук усім, хто має на нього право"],["Виняток","Alert, затримка, Decline","Не автоматизується: оператор телефонує першим"]]},{"t":"p","text":"Ордери, створені складом: лише моменти 4 і 5."},{"t":"p","text":"**Канали:** email (MVP — автоматизації HubSpot на зміну стадії); SMS — лише за голосової згоди на операційні повідомлення; чат ордера — з новим кабінетом."},{"t":"p","text":"**Перед запуском:** 2 тижні класифікації підпричин «Follow Up / Update» у CAE; перевірка, наскільки вчасно кожен хаб оновлює статуси. Повідомлення вмикаються лише там, де статуси оновлюються вчасно."},{"t":"p","text":"**Вимірювання:** поетапний запуск по хабах з контрольною групою; ціль — −50% вхідних дзвінків «статус» на 100 ордерів за 6 тижнів."}]},{"id":"SOP-7-4-normy-v0","for":["SOP-7.4"],"title":"Норми навантаження v0","status":"Пропозиція — стандарти часу частково припущення, потрібен хронометраж","author":null,"date":"2026-10-27","blocks":[{"t":"table","rows":[["Одиниця","Стандарт часу","Основа"],["Вхідний дзвінок","4.5 хв","розмова ~3.0 хв (факт) + обробка 1.5 хв (припущення)"],["Вихідний дзвінок з розмовою","2.5 хв","~1.5 (факт) + 1.0 (припущення)"],["Вихідна спроба без відповіді","0.5 хв","припущення"],["Вихідний лист","4 хв","припущення"],["Вхідний лист (розбір)","0.5 хв","припущення"],["Створення ордера","10 хв","припущення"]]},{"t":"table","rows":[["","8-год зміна","9-год","7-год"],["Продуктивний час (−25%)","360 хв","405","315"],["**Норма (85%)**","**300 хв**","**340**","**270**"]]},{"t":"p","text":"Зони: <150 систематично — перевірити, куди йде час; 150–300 — норма; 300–340 — епізодично допустимо; >340 два тижні поспіль — перерозподіл або найм."},{"t":"p","text":"**Факт (12 тижнів):** видиме в HubSpot навантаження команди ~75 год на тиждень (~21% оплаченого часу за умови повних ставок). Чати Hub, Teams, Telegram не виміряні. Потрібно: фактичний графік змін і 1–2 тижні хронометражу (ManicTime)."}]},{"id":"STD-01-callback","for":["STD-01"],"title":"Строки зворотного виклику (для SOP-1.7)","status":"Пропозиція","author":null,"date":"2026-10-27","blocks":[{"t":"table","rows":[["Параметр","Значення"],["Спроба 1","≤10 хв після втраченого дзвінка"],["Спроба 2","+1 год після спроби 1; залишити голосове повідомлення"],["Спроба 3","Наступний робочий день клієнта, в інший час доби, ніж перші дві; якщо є email — лист"],["Закриття","Після 3 невдалих спроб — «Недоступний»"],["Вікно дзвінків","08:00–20:00 за місцевим часом клієнта"],["Ціль охоплення спробою","100% втрачених номерів"],["Ціль перших спроб у строк","80%"],["Ціль результативності","60% втрачених — з розмовою"]]}]},{"id":"STD-06-sklad-zmin-vs-popyt","for":["STD-06","SOP-7.4"],"title":"Склад змін проти фактичного попиту","status":"Пропозиція — потребує перевірки фактичного складу змін","author":null,"date":"2026-10-27","blocks":[{"t":"p","text":"Київ = CT + 8 год (крім періодів, коли переходи на літній/зимовий час не збігаються)."},{"t":"table","rows":[["Зміна (Київ)","CT","Частка вхідних дзвінків (14–27.09 / 12–25.10)","% прийнятих","Склад за STD-06 v0.4"],["Ранкова","23:00–06:00 (ніч у США)","3% / 4%","55% / 27%","3 CS + Partner Success Coordinator"],["Денна / вечірня","06:00–15:00 (день у США)","72% / 64%","67% / 52%","4 CS"],["Нічна","15:00–23:00 (вечір у США)","25% / 32%","63% / 42%","**1 CS**"]]},{"t":"p","text":"Потрібно на телефоні для 80% відповідей за 20 сек (Erlang C, 4.5 хв на дзвінок):"},{"t":"table","rows":[["Вікно","Дзвінків на годину (будні)","Людей на телефоні"],["Ранкова","~0.7","1"],["Денна, звичайна година","~8","2"],["Денна, пік","~12.5","3"],["Нічна, перші години","~6–10","2"]]},{"t":"p","text":"**Висновок:** якщо STD-06 відповідає реальності, склад змін перевернутий відносно попиту США: найбільше людей — на зміні з найменшим попитом, одна людина — на зміні з третиною попиту. Перед рішенням — підтвердити фактичний склад і межі змін (у STD-06: 07–15 / 15–23 / 23–07; в операційній практиці названо 07–14 / 14–23 / 23–07)."},{"t":"p","text":"Сценарії росту: +20% попиту — пік потребує 3 людей; +50% — 4."}]},{"id":"STD-deferred-quote-timings","for":["STD-02","STD-18"],"title":"Строки для відкладеної квоти (для SOP-2.5, SOP-2.6)","status":"Пропозиція","author":null,"date":"2026-10-27","blocks":[{"t":"table","rows":[["Параметр","Значення"],["Перший контакт по YELLOW-запиту","≤10 хв (як в Instant Book CS Guide)"],["Квота транспорту","≤1 год"],["Квота Rework","≤30 хв після отримання фото"],["Відповідь хабу (ємність, вага, нічний тариф)","≤1 год"],["Термін дії квоти","24 год"],["Нагадування 1","через 2 год без відповіді"],["Нагадування 2","через 20 год («квота спливає»)"],["Максимум без результату","48 год"],["Нагадування про фото Rework","через 2 год без фото"]]}]}],"decisions":[{"n":"0.1","topic":"Мандат","text":"CS веде комунікацію по всіх ордерах, коли клієнт звертається, включно зі створеними складом","status":"Затверджено","date":"2026-10-   lineCount++;
  const id = lineCount;
  const svcOpts = `<option value="reload_std">Reload Standard</option><option value="reload_ubox">Reload U-Box</option><option value="reload_xl">Reload XL</option><option value="reload_xxl">Reload XXL</option><option value="storage">Storage (per day)</option><option value="parking_d">Parking Daily</option><option value="parking_w">Parking Weekly</option><option value="parking_m">Parking Monthly</option><option value="handwork">Handwork (per hr)</option><option value="fix_pallet">Fix Pallet</option><option value="dis_pallet">Disassembled Pallets</option><option value="wrap_low">Wrapping Low</option><option value="wrap_high">Wrapping High</option>`;
  const li = document.getElementById('line-items');
  const div = document.createElement('div');
  div.className = 'line-item';
  div.id = `li-${id}`;
  div.innerHTML = `
    <div><label>Сервіс</label><select class="line-svc" onchange="calcMulti()">${svcOpts}</select></div>
    <div><label>К-ть</label><input type="number" class="line-qty" value="1" min="1" oninput="calcMulti()"></div>
    <div id="li-total-${id}" class="item-total">$0</div>
    <button class="rm-btn" onclick="remLine(${id})">✕</button>`;
  li.appendChild(div);
  calcMulti();
}

function remLine(id) {
  const el = document.getElementById(`li-${id}`);
  if(el) el.remove();
  calcMulti();
}

function getPrice(hub, svc, qty, days) {
  const h = HUBS.find(x=>x.id===hub);
  if(!h) return 0;
  switch(svc) {
    case 'reload_std': return h.reload * qty;
    case 'reload_ubox': return 20 * qty;
    case 'reload_xl': return 10 * qty;
    case 'reload_xxl': return 15 * qty;
    case 'storage': { const free=h.storage_free; const paid=Math.max(0,days-free); return paid*2*qty; }
    case 'parking_d': return h.park_d * qty;
    case 'parking_w': return h.park_w * qty;
    case 'parking_m': return h.park_m * qty;
    case 'handwork': return 60 * qty;
    case 'fix_pallet': return 35 * qty;
    case 'dis_pallet': return 15 * qty;
    case 'wrap_low': return 6 * qty;
    case 'wrap_high': return 8 * qty;
    default: return 0;
  }
}

function calcMulti() {
  const hub = document.getElementById('c-hub')?.value;
  const ah = document.getElementById('c-ah')?.value==='1';
  const days = parseInt(document.getElementById('c-days')?.value)||1;
  if(!hub) return;
  const H = HUBS.find(x=>x.id===hub);
  const lines = document.querySelectorAll('.line-item');
  let subtotal = 0;
  const breakdown = [];
  lines.forEach(li => {
    const svc = li.querySelector('.line-svc').value;
    const qty = parseInt(li.querySelector('.line-qty').value)||1;
    const price = getPrice(hub, svc, qty, days);
    subtotal += price;
    const id = li.id.replace('li-','');
    const el = document.getElementById(`li-total-${id}`);
    if(el) el.textContent = `$${price}`;
    if(price>0) breakdown.push({svc,qty,price});
  });
  const min = H.min;
  const ahFee = ah ? H.ah : 0;
  const total = Math.max(subtotal, min) + ahFee;
  const result = document.getElementById('calc-result');
  if(!result) return;
  result.classList.add('on');
  document.getElementById('c-total').textContent = `$${total}`;
  document.getElementById('c-min-note').textContent = subtotal < min ? `Min charge: $${min} applied` : '';
  // Breakdown
  const bd = document.getElementById('c-bd');
  bd.innerHTML = breakdown.map(b=>`<div class="rbr"><span>${b.svc.replace(/_/g,' ')} × ${b.qty}</span><span class="rbv">$${b.price}</span></div>`).join('')
    + (subtotal < min ? `<div class="rbr"><span>Minimum charge</span><span class="rbv">$${min}</span></div>` : '')
    + (ah ? `<div class="rbr"><span>After-hours fee</span><span class="rbv">$${ahFee}</span></div>` : '')
    + `<div class="rbr"><span>TOTAL</span><span class="rbv">$${total}</span></div>`;
  // Phrase
  const svcNames = breakdown.map(b=>`${b.qty} ${b.svc.replace(/_/g,' ')}`).join(', ');
  const phrase = `The rate for ${svcNames} at ${H.n} is $${total}.${subtotal<min?' Minimum charge $'+min+' applied.':''} First ${H.storage_free===1?'24 hours':'week'} of storage is on us.${ah?' After-hours fee: $'+ahFee+'.':''}`;
  document.getElementById('c-phrase').textContent = phrase;
}

function calcAHOnly() {
  const hub = document.getElementById('ah-hub')?.value;
  const H = HUBS.find(x=>x.id===hub);
  if(!H) return;
  const res = document.getElementById('ah-result');
  res.innerHTML = `<div style="margin-bottom:10px"><strong style="color:var(--wh)">${H.n}</strong><div style="font-size:11.5px;color:var(--mu);margin-top:3px">${H.hours}</div></div>
  <div class="phrase"><div class="lbl">After-hours фраза</div>"We're 24/7 by appointment. There's a one-time $${H.ah} call fee for after-hours. I can book you right now — what's your ETA?"</div>
  <div style="margin-top:10px;font-size:12.5px;color:var(--mu)">Fee: <strong style="color:var(--red)">$${H.ah}</strong> · One-time · NOT per pallet</div>`;
  res.classList.add('on');
}

<div id="ck-content">
${groups.map(([g,items])=>`<div class="ckg"><div class="ckh">${g}</div>${items.map(([t,n])=>`<div class="cki" onclick="togCk(this)"><input type="checkbox" onclick="event.stopPropagation();togCk(this.parentElement)"><div><div class="ck-tx">${t}</div>${n?`<div class="ck-note">${n}</div>`:''}</div></div>`).join('')}</div>`).join('')}

function togCk(el) {
  if(el.tagName==='INPUT') el = el.closest('.cki');
  const cb = el.querySelector('input');
  if(cb) cb.checked = !cb.checked;
  el.classList.toggle('done', cb?.checked);
  updProg();
}

function updProg() {
  const all = document.querySelectorAll('#ck-content .cki input');
  const done = [...all].filter(c=>c.checked).length;
  const pct = all.length ? Math.round(done/all.length*100) : 0;
  const bar = document.getElementById('ck-bar');
  const pt = document.getElementById('ck-pct');
  if(bar) bar.style.width = pct+'%';
  if(pt) pt.textContent = `${done} / ${all.length}`;
}

function resetCk() {
  document.querySelectorAll('#ck-content .cki').forEach(i=>{i.classList.remove('done');const cb=i.querySelector('input');if(cb)cb.checked=false;});
  updProg();
}

  <li><strong>Direct line у SMS</strong> — клієнт дзвонить ТОБІ, не на main line, ти знаєш контекст і закриваєш швидше.</li>

  <li><strong>Один канал ≠ нав'язування</strong> — voicemail + SMS + email — це три ЧЕРГОВИХ контакти, а не три повторних. Triple-channel = клієнт побачить хоча б один.</li>
  <li><strong>Документуй кожен touch у HubSpot</strong> — Note з timestamp і channel. Цей дата дає Vlad-у видимість на funnel performance.</li>
</ul>

<h2>HubSpot Tasks — як автоматизувати</h2>
<div class="ibox"><strong>Шаблон для CS після кожного дзвінка:</strong>
<ul style="margin-top:8px">
  <li>Quote given без booking → <strong>HubSpot Task</strong> · Due: T+2 hrs · Type: SMS · Title: "FU SMS [NAME] · [SERVICE]"</li>
  <li>Photos pending → <strong>HubSpot Task</strong> · Due: T+30 min · Type: SMS</li>
  <li>"Передзвоню сам" → <strong>HubSpot Task</strong> · Due: tomorrow 9 AM · Type: Call</li>
  <li>Замовлення Complete → <strong>HubSpot Workflow</strong> auto-trigger SMS T+24hr (налаштовується одноразово)</li>
</ul>
</div>`;
}

function rstkInit() {
  const gGrid = document.getElementById('rstk-groups');
  if (gGrid) {
    gGrid.innerHTML = RESTACK_GROUPS.map(g => `
      <button class="rstk-grp-btn" data-id="${g.id}" onclick="rstkPickGrp('${g.id}')">

      </button>
    `).join('');
  }
  const dGrid = document.getElementById('rstk-dmgs');
  if (dGrid) {
    dGrid.innerHTML = RESTACK_DMGS.map(d => `
      <button class="rstk-dmg-btn ${d.crit ? 'crit' : ''}" data-code="${d.code}" onclick="rstkToggleDmg('${d.code}')">
        <span class="rstk-dmg-code">${d.code}</span>
        <span class="rstk-dmg-txt"><strong>${d.name}</strong><br><span style="font-size:10.5px;color:var(--mu)">${d.desc}</span></span>
      </button>
    `).join('');
  }
  rstkCalc();
}

function rstkPickGrp(gid) {
  restackState.grp = RESTACK_GROUPS.find(g => g.id === gid);
  restackState.sub = null;
  document.querySelectorAll('.rstk-grp-btn').forEach(b => b.classList.toggle('sel', b.dataset.id === gid));
  const panel = document.getElementById('rstk-sub-panel');
  panel.style.display = '';
  document.getElementById('rstk-sub-lbl').textContent = restackState.grp.name + ' — підтип';
  const list = document.getElementById('rstk-sub-list');
  list.innerHTML = restackState.grp.subtypes.map(st => `
    <button class="rstk-sub-btn ${st.warn ? 'warn' : ''}" data-id="${st.id}" onclick="rstkPickSub('${st.id}')">
      <span class="rstk-sub-name">${st.name}${st.warn ? ' ⚠' : ''}</span>
      <span class="rstk-sub-desc">${st.desc}</span>
      <span class="rstk-sub-price">$${st.wMin}–$${st.wMax}</span>
    </button>
  `).join('');
  rstkCalc();
}

function rstkPickSub(sid) {
  if (!restackState.grp) return;
  restackState.sub = restackState.grp.subtypes.find(s => s.id === sid);
  document.querySelectorAll('.rstk-sub-btn').forEach(b => b.classList.toggle('sel', b.dataset.id === sid));
  rstkCalc();
}

function rstkToggleDmg(code) {
  if (restackState.dmg.has(code)) restackState.dmg.delete(code);
  else restackState.dmg.add(code);
  document.querySelectorAll('.rstk-dmg-btn').forEach(b => b.classList.toggle('on', restackState.dmg.has(b.dataset.code)));
  rstkCalc();
}

function rstkSetH(v) {
  restackState.hCost = v;
  document.querySelectorAll('#rstk-h .rstk-seg-btn').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  rstkCalc();
}

function rstkSetW(v) {
  restackState.wCost = v;
  document.querySelectorAll('#rstk-w .rstk-seg-btn').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  rstkCalc();
}

function rstkPal(d) {
  restackState.pallets = Math.max(1, restackState.pallets + d);
  document.getElementById('rstk-pal-n').textContent = restackState.pallets;
  rstkCalc();
}

function rstkReset() {
  restackState = {grp:null, sub:null, dmg:new Set(), hCost:0, wCost:0, pallets:1};
  document.querySelectorAll('.rstk-grp-btn,.rstk-sub-btn,.rstk-dmg-btn').forEach(b => b.classList.remove('sel', 'on'));
  document.getElementById('rstk-sub-panel').style.display = 'none';
  document.querySelectorAll('#rstk-h .rstk-seg-btn').forEach(b => b.classList.toggle('on', b.dataset.v === '0'));
  document.querySelectorAll('#rstk-w .rstk-seg-btn').forEach(b => b.classList.toggle('on', b.dataset.v === '0'));
  document.getElementById('rstk-pal-n').textContent = '1';
  rstkCalc();
}

function rstkCalc() {
  const card = document.getElementById('rstk-result');
  if (!card) return;
  const {grp, sub, dmg, hCost, wCost, pallets} = restackState;

  if (!grp) {
    card.innerHTML = `<div class="rstk-empty"><div style="font-size:32px;margin-bottom:8px;opacity:.4">📋</div><div>Виберіть тип вантажу для оцінки</div></div>`;
    return;
  }
  if (!sub) {
    card.innerHTML = `<div class="rstk-empty"><div style="font-size:32px;margin-bottom:8px;opacity:.4">👆</div><div>Тепер виберіть підтип</div></div>`;
    return;
  }

  let dmgLo = 0, dmgHi = 0, nCrit = 0;
  dmg.forEach(code => {
    const d = RESTACK_DMGS.find(x => x.code === code);
    if (!d) return;
    dmgLo += d.lo; dmgHi += d.hi;
    if (d.crit) nCrit++;
  });

  const cLo = Math.max(sub.wMin + hCost + wCost + dmgLo, sub.wMin);
  const cHi = Math.max(sub.wMax + hCost + wCost + dmgHi, sub.wMax);

  const n = dmg.size;
  let cxIdx = sub.baseCx || 0;
  if (nCrit >= 2 || n >= 5) cxIdx = Math.max(cxIdx, 3);
  else if (nCrit >= 1 || n >= 4) cxIdx = Math.max(cxIdx, 2);
  else if (n >= 2) cxIdx = Math.max(cxIdx, 1);
  const cx = RESTACK_CX[cxIdx];
  const cxColors = {'EASY':'var(--teal)', 'MEDIUM':'var(--amb)', 'DIFFICULT':'#FF8C42', 'DIFFICULT+':'var(--red)'};

  const hAdd = RESTACK_H_TIME_ADD[hCost] || 0;
  const dmgT = (n - nCrit) * 3 + nCrit * 8;
  const perLo = sub.tLo + hAdd + dmgT;
  const perHi = sub.tHi + hAdd + Math.round(dmgT * 1.4);
  const totLo = perLo * pallets;
  const totHi = perHi * pallets;

  const fmt = m => m < 60 ? `${m} min` : `${Math.floor(m/60)}h${m%60 ? ' ' + (m%60) + 'min' : ''}`;
  const fmtR = (lo, hi) => lo === hi ? fmt(lo) : `${fmt(lo)} – ${fmt(hi)}`;
  const r5 = n => Math.round(n / 5) * 5;

  const mid = r5((cLo + cHi) / 2);
  const totalLo = cLo * pallets;
  const totalHi = cHi * pallets;

  const mods = [];
  if (hCost > 0) mods.push(`<div class="rstk-mod-row"><span>Висота</span><strong>+$${hCost}/pal</strong></div>`);
  if (wCost > 0) mods.push(`<div class="rstk-mod-row"><span>Вага</span><strong>+$${wCost}/pal</strong></div>`);
  if (n > 0)     mods.push(`<div class="rstk-mod-row"><span>Пошкодження (${n})</span><strong>+$${dmgLo}–$${dmgHi}/pal</strong></div>`);

  card.innerHTML = `
    <div class="rstk-r-top">
      <div class="rstk-r-eyebrow">Quote клієнту — за палету</div>
      <div class="rstk-r-price">$${cLo}<span style="font-size:24px;opacity:.4"> – </span>$${cHi}</div>
      <div class="rstk-r-mid">recommended <strong>$${mid}</strong></div>
      <div class="rstk-r-cx" style="color:${cxColors[cx]}">${cx.replace('+', '+').toLowerCase()}</div>
    </div>
    <div class="rstk-r-floor">
      <span style="color:var(--mu);font-size:11px">Min floor</span>
      <span style="color:var(--teal);font-family:'IBM Plex Mono',monospace;font-weight:700">$${sub.wMin} ✓</span>
    </div>
    ${mods.length ? `<div class="rstk-r-mods">${mods.join('')}</div>` : ''}
    ${pallets > 1 ? `
    <div class="rstk-r-total">
      <div><div style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px">Total ${pallets} pal</div><div style="font-size:11px;color:var(--mu)">mid $${(mid * pallets).toLocaleString()}</div></div>
      <div style="font-family:'Onest',sans-serif;font-size:24px;font-weight:800;color:var(--wh)">$${totalLo.toLocaleString()}–$${totalHi.toLocaleString()}</div>
    </div>
    ${totalHi >= 2000 ? '<div style="padding:9px 12px;background:color-mix(in srgb,var(--warn) 8%,transparent);border:1px solid color-mix(in srgb,var(--warn) 20%,transparent);border-radius:6px;font-size:12px;color:var(--amb);margin-top:8px">⚠ Total &gt; $2,000 — escalate to supervisor</div>' : ''}
    ` : ''}
    ${sub.warn ? '<div style="padding:9px 12px;background:color-mix(in srgb,var(--crit) 8%,transparent);border:1px solid color-mix(in srgb,var(--crit) 20%,transparent);border-radius:6px;font-size:12px;color:var(--red);margin-top:8px">⚠ Цей підтип потребує supervisor approval до початку роботи</div>' : ''}
    <div class="rstk-r-time">
      <div class="rstk-r-time-cell">
        <div style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">⏱ За палету</div>
        <div style="font-family:'Onest',sans-serif;font-size:18px;font-weight:700;color:var(--tx)">${fmtR(perLo, perHi)}</div>
      </div>
      ${pallets > 1 ? `
      <div class="rstk-r-time-cell">
        <div style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${pallets} palets total</div>
        <div style="font-family:'Onest',sans-serif;font-size:18px;font-weight:700;color:var(--tx)">${fmtR(totLo, totHi)}</div>
      </div>` : ''}
    </div>
  `;
}

function renderNetCard(loc) {
  const SVC_LABELS = {'cross-dock':'Cross-dock','rework':'Rework','storage':'Storage','overweight':'Overweight','reefer':'Reefer','hazmat':'Hazmat'};
  const allSvc = ['cross-dock','rework','storage','overweight','reefer','hazmat'];
  const svcChips = allSvc.map(s => {
    const yes = loc.services.includes(s);
    return `<span class="net-svc ${yes ? 'yes' : 'no'}">${SVC_LABELS[s]}</span>`;
  }).join('');

  const dataServices = loc.services.join(' ');
  const dataName = `${loc.name} ${loc.state||''} ${loc.zip||''} ${loc.legal||''} ${loc.services.join(' ')} ${loc.market?.label||''}`.toLowerCase();

  const facility = loc.facility ? renderFacilityGrid(loc) : '';
  const priceTable = loc.price && Object.keys(loc.price).length ? renderPriceTable(loc) : '';
  const noteBlock = loc.note ? renderNoteStrip(loc.note) : '';
  const noteBlock2 = loc.note2 ? renderNoteStrip(loc.note2) : '';
  const noteBlock3 = loc.note3 ? renderNoteStrip(loc.note3) : '';
  const contacts = loc.contacts && loc.contacts.length ? renderContactsBlock(loc.contacts) : '';
  const newBadge = loc.isNew ? '<span class="net-new-badge">NEW</span>' : '';
  const unverifiedBadge = loc.unverified ? '<span class="net-unv-badge">UNVERIFIED</span>' : '';

  return `<article class="net-card net-card-${loc.type}" data-name="${escH(dataName)}" data-type="${loc.type}" data-services="${dataServices}" data-id="${loc.id}">
  <div class="net-card-head">
    <div class="net-card-title-row">
      <div>
        <div class="net-card-name">${loc.name}${newBadge}${unverifiedBadge} <span class="net-legal">${loc.legal||''}</span></div>
      </div>
      <span class="net-market-badge net-mb-${loc.market.cls}">${loc.market.label}</span>
    </div>
    <div class="net-card-addr">📍 ${loc.addr}${loc.interstate ? ` · <span class="net-itrst">${loc.interstate}</span>` : ''}</div>
  </div>
  <div class="net-services-strip">${svcChips}</div>
  <div class="net-card-body">
    <dl class="net-info-grid">
      <dt>Графік</dt><dd>${escH(loc.hours)}</dd>
      <dt>Phone</dt><dd><a href="tel:${loc.phone.replace(/[^0-9+]/g,'')}" class="net-phone">${loc.phone}</a></dd>
      ${loc.gate ? `<dt>Gate code</dt><dd class="net-gate">${loc.gate}</dd>` : ''}
      ${loc.ah ? `<dt>After-hours</dt><dd>${escH(loc.ah)}</dd>` : ''}
    </dl>
    ${facility}
    ${priceTable}
    ${contacts}
  </div>
  ${noteBlock}
  ${noteBlock2}
  ${noteBlock3}
</article>`;
}

function renderFacilityGrid(loc) {
  const f = loc.facility;
  const rows = [];
  if (f.type) rows.push(['Тип', f.type]);
  if (f.size) rows.push(['Розмір', f.size]);
  if (f.docks) rows.push(['Dock doors', f.docks]);
  if (f.forklifts) rows.push(['Forklifts', f.forklifts]);
  if (f.equipment) rows.push(['Обладнання', f.equipment]);

function netInitMap() {
  if (typeof L === 'undefined') {
    console.warn('Leaflet not loaded yet, retrying...');
    setTimeout(netInitMap, 200);
    return;
  }
  const container = document.getElementById('networkMap');
  if (!container) return;
  if (netLeafletInited) {
    setTimeout(() => { if (netLeafletMap) netLeafletMap.invalidateSize(); }, 50);
    return;
  }
  netLeafletInited = true;

  netLeafletMap = L.map('networkMap', { scrollWheelZoom: false }).setView([39.5, -97.5], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 18,
  }).addTo(netLeafletMap);

  // Activate scroll-wheel only on focus
  netLeafletMap.on('focus', () => netLeafletMap.scrollWheelZoom.enable());
  netLeafletMap.on('blur', () => netLeafletMap.scrollWheelZoom.disable());

  NETWORK_LOCATIONS.forEach(loc => {
    const pinClass = loc.type === 'own' ? 'own' : (loc.market?.cls === 'overlap' ? 'overlap' : 'gap');
    const letter = loc.type === 'own' ? 'F' : 'P';
    const icon = L.divIcon({
      className: 'leaflet-div-icon',
      html: `<div class="net-pin net-pin-${pinClass}"><span>${letter}</span></div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 28],
      popupAnchor: [0, -26],
    });
    const marker = L.marker([loc.lat, loc.lng], { icon }).addTo(netLeafletMap);
    const SVC_LABELS = {'cross-dock':'Cross-dock','rework':'Rework','storage':'Storage','overweight':'Overweight','reefer':'Reefer','hazmat':'Hazmat'};
    const svcStr = loc.services.map(s => SVC_LABELS[s]).join(' · ');
    marker.bindPopup(`
      <div class="net-popup">
        <div class="net-popup-name">${loc.name}, ${loc.state||''}</div>
        <span class="net-popup-tag net-mb-${loc.market.cls}">${loc.market.label}</span>
        <div class="net-popup-addr">📍 ${loc.addr}</div>
        <div class="net-popup-svc"><b>Послуги:</b> ${svcStr}</div>
        <a class="net-popup-link" href="javascript:netGoToCard('${loc.id}')">→ Відкрити повну картку</a>
      </div>
    `);
  });

  setTimeout(() => netLeafletMap.invalidateSize(), 100);
}
