<meta charset="utf-8">
<title>Freitty CS Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* Old wiki components (tools, working materials, reference pages), scoped under .legacy and recoloured to the tokens below */
__LEGACY_CSS__
</style>
<style>
/* Layout: sticky top bar + collapsible left index (document codes like a dock ledger) + reading column; Tier-0 documents carry a hazard stripe. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef1f5; --fg:#16202c; --muted:#5a6676; --line:#d9dfe7;
  --accent:#1d55a6; --accent-soft:#e3ecf9; --accent-fg:#ffffff;
  --hazard:#e8a317; --hazard-ink:#1b1505;
  --ok:#1f7a4d; --ok-soft:#e1f3e9; --warn:#a86200; --warn-soft:#fcefd9; --crit:#b42318; --crit-soft:#fde4e1; --idle:#6b7280; --idle-soft:#eceef1;
  --mark:#ffe58a;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#161d26; --surface-2:#1d2631; --fg:#e6ebf1; --muted:#9aa6b5; --line:#2a3542;
  --accent:#6ea2ef; --accent-soft:#1c2d47; --accent-fg:#0b1220;
  --hazard:#f0b43c; --hazard-ink:#1b1505;
  --ok:#5cc58f; --ok-soft:#163327; --warn:#f0a94a; --warn-soft:#3a2a12; --crit:#f2867b; --crit-soft:#3d1a17; --idle:#9aa3ae; --idle-soft:#232b35;
  --mark:#6b5a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d26; --surface-2:#1d2631; --fg:#e6ebf1; --muted:#9aa6b5; --line:#2a3542;
  --accent:#6ea2ef; --accent-soft:#1c2d47; --accent-fg:#0b1220;
  --hazard:#f0b43c; --hazard-ink:#1b1505;
  --ok:#5cc58f; --ok-soft:#163327; --warn:#f0a94a; --warn-soft:#3a2a12; --crit:#f2867b; --crit-soft:#3d1a17; --idle:#9aa3ae; --idle-soft:#232b35;
  --mark:#6b5a12; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.9em}
h1,h2,h3{text-wrap:balance;line-height:1.25}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap;color:var(--fg)}
.brand:hover{text-decoration:none}
.brand .mk{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.icon-btn:hover{border-color:var(--accent)}
.srch{position:relative;flex:1;max-width:560px;margin-left:auto}
.srch input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:8px 12px 8px 34px}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.srch-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 12px 32px rgba(0,0,0,.16);max-height:min(70vh,560px);overflow:auto}
.srch-res .cnt{padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.srch-it{display:block;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--fg);cursor:pointer}
.srch-it:hover,.srch-it.on{background:var(--accent-soft);text-decoration:none}
.srch-it .l{font-size:12px;color:var(--muted)}
.srch-it .s{font-size:13px;color:var(--muted);margin-top:2px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.me-chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--fg);background:var(--surface)}
.me-chip b{font-family:var(--mono)}
.me-chip.due{border-color:var(--crit);color:var(--crit)}

/* layout */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 60px)}
body.noside .layout{grid-template-columns:minmax(0,1fr)}
body.noside .side{display:none}
.side{border-right:1px solid var(--line);background:var(--surface);padding:10px 10px 40px max(10px,env(safe-area-inset-left,0px));position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow:auto}
.side details.sg{margin-top:6px}
.side summary.sgh{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-radius:6px}
.side summary.sgh::-webkit-details-marker{display:none}
.side summary.sgh::before{content:"▸";font-size:10px;transition:transform .15s}
.side details[open] > summary.sgh::before{transform:rotate(90deg)}
.side summary.sgh:hover{color:var(--fg)}
.side summary.sgh .n{margin-left:auto;font-family:var(--mono);letter-spacing:0}
.side a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--fg);font-size:14px;line-height:1.3}
.side a:hover{background:var(--surface-2);text-decoration:none}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a .c{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:56px;flex-shrink:0}
.side a.on .c{color:var(--accent)}
.side a .dot{margin-left:auto;flex-shrink:0;width:8px;height:8px;border-radius:50%;align-self:center}
.side a .mt{margin-left:auto;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.dot.ok{background:var(--ok)} .dot.re{background:var(--warn)} .dot.no{background:var(--crit)}
.main{min-width:0;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
.read{max-width:800px}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:25;left:0;top:calc(env(safe-area-inset-top,0px) + 57px);width:min(300px,86vw);transform:translateX(-102%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  body.noside .side{display:block}
  .side.open{transform:none}
  .brand small{display:none}
  .me-chip span{display:none}
}
@media (max-width:560px){ .brand .t{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* shared bits */
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1.ptitle{font-size:28px;margin:6px 0 6px}
.lead{color:var(--muted);max-width:70ch;margin:0 0 20px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
a.card{color:var(--fg);display:block}
a.card:hover{border-color:var(--accent);text-decoration:none}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;background:var(--idle-soft);color:var(--idle);white-space:nowrap;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
a.chip:hover{text-decoration:none;filter:brightness(.97)}
.code{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--accent);white-space:nowrap}
.tier0{background:repeating-linear-gradient(-45deg,var(--hazard) 0 6px,var(--hazard-ink) 6px 12px);width:22px;height:10px;border-radius:2px;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:500;font-size:14px}
.kb:hover{border-color:var(--accent)}
.kb.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.kb.sm{padding:4px 9px;font-size:13px}
.kb:disabled{opacity:.5;cursor:not-allowed}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:12px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl th{background:var(--surface-2);font-weight:600;font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:12px 0}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.crit{border-color:var(--crit);background:var(--crit-soft)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.filters select,.filters input,.fld{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;font-size:14px;max-width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* collapsible blocks */
details.sec,details.blk,details.mat,details.lsec{border-top:1px solid var(--line)}
details.sec > summary,details.blk > summary,details.mat > summary,details.lsec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 0;scroll-margin-top:90px}
details.sec > summary::-webkit-details-marker,details.blk > summary::-webkit-details-marker,details.mat > summary::-webkit-details-marker,details.lsec > summary::-webkit-details-marker{display:none}
details.sec > summary::before,details.blk > summary::before,details.mat > summary::before,details.lsec > summary::before{content:"▸";color:var(--muted);font-size:12px;width:12px;flex-shrink:0;transition:transform .15s}
details[open].sec > summary::before,details[open].blk > summary::before,details[open].mat > summary::before,details[open].lsec > summary::before{transform:rotate(90deg)}
details.sec > summary h2,details.blk > summary h2{margin:0;font-size:19px}
details.sec > summary:hover h2,details.blk > summary:hover h2{color:var(--accent)}
.sec-b{padding:0 0 14px 22px}
details.blk{border-top:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px;margin:0 0 12px}
details.blk > summary h2{font-size:16px}
details.mat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px;margin:0 0 12px}
details.mat > summary{font-weight:600}
.mat-tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 6px;font-weight:600;flex-shrink:0}
.toolsbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin:4px 0 6px}
.lsec{border-top:1px solid var(--line)}

/* old wiki inside the new design */
.legacy{--surf:var(--surface);--surf2:var(--surface-2);--bord:var(--line);--tx:var(--fg);--mu:var(--muted);--wh:var(--fg);--pur:var(--accent);--blue:var(--accent);--teal:var(--ok);--red:var(--accent);--amb:var(--warn);
  color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.6;overflow-x:hidden}
.legacy .page,.legacy .page.on{display:block;animation:none}
.legacy .pi{background:none;border:0;padding:0;max-width:none;border-radius:0}
.legacy .pi > h1:first-child{display:none}
.legacy .pi h1{background:none;-webkit-text-fill-color:currentColor;color:var(--fg);font-size:22px}
.legacy .pi h2{font-family:var(--font);font-size:17px;-webkit-text-fill-color:currentColor;color:var(--fg)}
.legacy .pi h3{-webkit-text-fill-color:currentColor}
.legacy .pi h4{-webkit-text-fill-color:currentColor}
.legacy details.lsec > summary{padding:10px 0}
.legacy details.lsec > summary h2{margin:0}
.legacy .dbox{border-left-color:var(--crit)}
.legacy .pi blockquote{border-left-color:var(--crit)}
.legacy .tab.on,.legacy .price-tab.on,.legacy .net-tab.on,.legacy .pp-tab.on{color:var(--accent)}
.legacy input,.legacy select,.legacy textarea{background:var(--surface);color:var(--fg);border-color:var(--line)}
.legacy .leaflet-container{background:var(--surface-2)}
.tool-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
@media (max-width:600px){.tool-wrap{padding:12px 10px}.sec-b{padding-left:4px}}

/* home */
.sit{display:flex;flex-direction:column;gap:6px}
.sit .q{font-weight:600}
.sit .a{font-size:13.5px;color:var(--muted)}
.sit .refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.upd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.upd:last-child{border-bottom:0}

/* document */
.dochead{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.dochead h1{margin:0;font-size:28px}
.doc-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:32px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;font-size:13px;max-height:calc(100vh - 120px);overflow:auto}
.toc a{display:block;padding:4px 8px;border-left:2px solid var(--line);color:var(--muted)}
.toc a:hover{color:var(--fg);text-decoration:none;border-color:var(--accent)}
@media (max-width:1150px){.doc-grid{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.passport{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:4px 0 0}
.passport div{background:var(--surface);padding:8px 12px;min-width:0}
.passport dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.passport dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.body p{margin:0 0 10px;max-width:74ch}
.body p.np{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px;scroll-margin-top:90px}
.body p.np .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.body p.ind{margin-left:16px;padding-left:12px;border-left:2px solid var(--line)}
.body p.sub{font-weight:600;margin-top:8px}
.body h3{font-size:16px;margin:16px 0 8px}
.hit{background:var(--mark)!important;border-radius:4px;transition:background 1.6s}
.body ul,.body ol{margin:0 0 10px;padding-left:22px;max-width:74ch}
.body blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--line);color:var(--muted)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel a,.rel span{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.rel span{color:var(--muted)}

/* acknowledgement */
.ack{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;margin:24px 0 0;display:flex;flex-direction:column;gap:10px;scroll-margin-top:90px}
.ack.ok{border-color:var(--ok)} .ack.need{border-color:var(--warn)}
.ack h3{margin:0;font-size:17px}
.ackbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-radius:var(--r);margin-bottom:14px;font-size:14px}
.ackbar.ok{background:var(--ok-soft);color:var(--ok)} .ackbar.need{background:var(--warn-soft);color:var(--warn)} .ackbar.crit{background:var(--crit-soft);color:var(--crit)}
.ackbar a{margin-left:auto;font-weight:600;color:inherit;text-decoration:underline}

/* team & journal */
.mx th.v{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:11.5px;padding:8px 4px;white-space:nowrap}
.mx td.c{text-align:center;padding:6px 4px;font-family:var(--mono);font-size:13px}
.mx td.c.ok{color:var(--ok)} .mx td.c.re{color:var(--warn)} .mx td.c.no{color:var(--crit)} .mx td.c.na{color:var(--line)}
.who{display:flex;align-items:center;gap:8px;min-width:170px}
.who img{width:24px;height:24px;border-radius:50%}
.pick{position:relative}
.pick .opts{position:absolute;z-index:5;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.pick .opts button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;cursor:pointer;text-align:left}
.pick .opts button:hover{background:var(--surface-2)}
.assign-panel{background:var(--surface-2);padding:12px;border-radius:var(--r)}
.assign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px;margin:8px 0}
.assign-grid label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.ev-ack{color:var(--ok)} .ev-assign{color:var(--accent)} .ev-unassign{color:var(--muted)} .ev-role{color:var(--warn)} .ev-matrix{color:var(--muted)} .ev-person{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:24}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.step .num{counter-increment:st;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.step .num::before{content:counter(st)}
/* paragraph flags */
.body p.np{grid-template-columns:44px minmax(0,1fr) auto}
.flag-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 5px;opacity:.3;border-radius:4px;align-self:start;white-space:nowrap}
.body p.np:hover .flag-btn,.flag-btn.has,.flag-btn:focus-visible{opacity:1}
.flag-btn:hover{background:var(--surface-2)}
.flag-btn.has{color:var(--warn);font-weight:600}
.flagbox{margin:0 0 12px 48px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:14px;display:flex;flex-direction:column;gap:8px}
.flagbox textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--surface);font:inherit}
.fl{border-left:3px solid var(--warn);padding:6px 10px;background:var(--surface);border-radius:0 6px 6px 0}
.fl.answered{border-color:var(--ok)} .fl.closed{border-color:var(--line)}

const legKeys = (kind, p) => { const pg = LEG_OK && PAGES.find(x => x.p === p && (kind === 'tool' ? x.tabs.includes('tools') : !x.tabs.includes('tools'))); return pg ? pg.pl : ''; };

/* ---------------- registry & docs ---------------- */
const REG = {}; D.registry.forEach(r => REG[r.code] = r);
Object.values(D.docs).forEach(d => {

  const parts = rest.split('.').map(x => isNaN(+x) ? x.charCodeAt(0)+1000 : +x); return [order, ...parts]; };

ALL_CODES.sort(byCode);

const unslug = s => s.replace(/_/g, '.');
const docVer = c => D.docs[c]?.version || REG[c]?.version || null;

const tierN = c => { const t = D.docs[c]?.meta?.Tier || REG[c]?.tier || ''; const m = String(t).match(/\d/); return m ? +m[0] : null; };

/* ---------------- inline formatting & linkify ---------------- */
function inline(text, ctx){
  let h = esc(text);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\b(POL|STD|PRC|SOP|WI|TPL|REG)-((?:E\.)?\d+(?:\.\d+)?)(?:(\s?(?:п\.|пп\.)\s?)(\d+(?:\.\d+)+))?|(\(?п\.\s?)(\d+\.\d+(?:\.\d+)?)/g,
    (m, t, n, sep, pnum, bare, bnum) => {
      if (t) { const code = `${t}-${n}`; if (!REG[code]) return m;
        const href = '#doc-' + slug(code) + (pnum ? '--p-' + pnum.replace(/\./g,'-') : '');
        return `<a href="${href}" title="${esc(docTitle(code))}">${code}${pnum ? sep + pnum : ''}</a>`; }
      if (ctx && ctx.code && D.docs[ctx.code]) return `${bare}<a href="#doc-${slug(ctx.code)}--p-${bnum.replace(/\./g,'-')}">${bnum}</a>`;
      return m;
    });
  return h;

/* ---------------- search index ---------------- */
const norm = s => String(s||'').toLowerCase().replace(/[ʼ’'`]/g,"'").replace(/ё/g,'е');
const strip = h => String(h || '').replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
let IDX = null;
function buildIndex(){
  IDX = [];
  for (const c of ALL_CODES){
    const r = REG[c];
    IDX.push({route:'doc-'+slug(c), label:c, title:docTitle(c), where: TYPES[TYPE_OF(c)]||'', text: norm([c, docTitle(c), r.owner, r.note, r.stream].join(' ')), raw:[c, docTitle(c), r.note].filter(Boolean).join(' · '), boost:3});
    const d = D.docs[c];
    if (d){ let sec = '';
      d.blocks.forEach((b, i) => {
        if (b.t === 'h') { sec = b.text; return; }
        const txt = b.t === 'table' ? b.rows.map(r => r.join(' · ')).join(' / ') : b.text;
        const pm = b.t==='p' && b.text.match(/^(\d+(?:\.\d+)+)\.?\s/);

      }); }

function search(q){
  if (!IDX) buildIndex();

  if (!words.length) return [];
  const res = [];
  for (const it of IDX){
    if (!words.every(w => it.text.includes(w))) continue;
    res.push({it, score: it.boost + (norm(it.title).includes(words[0]) ? 2 : 0) + (norm(it.label) === norm(q) ? 10 : 0)});
  }
  res.sort((a,b) => b.score - a.score);

}
function snippet(raw, q){
  const words = norm(q).split(/\s+/).filter(Boolean); const n = norm(raw);
  const i = Math.max(0, n.indexOf(words[0])); const s = Math.max(0, i - 50);

  return h;
}

/* ---------------- shared state (db) ---------------- */
const S = { user:null, db:null, uid:null, admin:false, ready:false, own:null, assigned:null, myAssign:null, matrix:DEFAULT_MATRIX,

}

async function initShared(){
  if (!window.claude?.use) { S.ready = true; S.noAccess = true; render(); return; }

  db.doc('config/matrix').onSnapshot(s => { const m = s.exists ? s.data()?.m : null; S.matrix = m && typeof m === 'object' ? m : DEFAULT_MATRIX; render(); }, () => {});

    db.collection('assign').onSnapshot(s => { S.team.assign = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); render(); }, () => {});
    db.collection('gaps').onSnapshot(s => { S.gaps = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); render(); }, () => {});
    db.collection('audit').orderBy('at', 'desc').limit(1000).onSnapshot(s => { S.audit = s.docs.map(d => d.data()); render(); }, () => {});

let ownChain = Promise.resolve(), adminChain = Promise.resolve();
function writeOwn(next){

}

}

  S.own = next; render(); writeOwn(next).then(() => toast(`Ознайомлення відмічено: ${code}${v?' v'+v:''}`));

const QZ = {};
function perm(code, qi, n){ const idx = [...Array(n).keys()]; let h = 7; for (const ch of code + ':' + qi) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  for (let i = n - 1; i > 0; i--){ h = (Math.imul(h, 1103515245) + 12345) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }

function quizHtml(code){

  return `<p class="small">Перевірка розуміння: ${qz.length} питання. Щоб відмітити ознайомлення, дайте правильні відповіді на всі. Неправильні можна виправити й перевірити ще раз.</p>

  <p class="small muted" style="margin:0">Питання — проєкт, підготовлений разом зі створенням вікі; власник документа їх перевіряє.</p>

function checkQuiz(code){

function blockKey(b){ if (b.t === 'h') return 'h:' + b.text.replace(/^\d+\.\s*/, ''); if (b.t === 'p'){ const m = b.text.match(/^(\d+(?:\.\d+)+)\.?\s/); if (m) return 'p:' + m[1]; }
  if (b.t === 'table') return 't:' + (b.rows[0] || []).join('|'); return 'x:' + (b.text || '').slice(0, 80); }
const blockText = b => b.t === 'table' ? b.rows.map(r => r.join(' | ')).join('\n') : (b.text || '');
function wordDiff(a, b){
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/); const n = A.length, m = B.length;
  if (n * m > 600000) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const dp = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = '';
  while (i < n && j < m){ if (A[i] === B[j]){ out += esc(A[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out += `<del>${esc(A[i++])}</del>`; else out += `<ins>${esc(B[j++])}</ins>`; }
  while (i < n) out += `<del>${esc(A[i++])}</del>`; while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return out;
}
function diffHtml(oldB, newB){
  const om = new Map(); oldB.filter(b => !b.passport).forEach(b => om.set(blockKey(b), b));
  const seen = new Set(); let add = 0, rem = 0, chg = 0, h = '', pendingH = '';
  newB.filter(b => !b.passport).forEach(b => {
    const k = blockKey(b); seen.add(k);
    if (b.t === 'h'){ pendingH = `<h3>${esc(b.text)}</h3>`; return; }
    const o = om.get(k); const t = blockText(b); let piece = '';
    if (!o){ add++; piece = `<div class="dblk add"><div class="small">Додано</div><div style="white-space:pre-wrap">${esc(t)}</div></div>`; }
    else if (blockText(o) !== t){ chg++; piece = `<div class="dblk chg"><div class="small">Змінено</div><div class="diff" style="white-space:pre-wrap">${wordDiff(blockText(o), t)}</div></div>`; }
    if (piece){ h += pendingH + piece; pendingH = ''; }
  });
  const removed = [...om.entries()].filter(([k]) => !seen.has(k) && !k.startsWith('h:'));
  if (removed.length) h += `<h3>Видалено</h3>` + removed.map(([, b]) => { rem++; return `<div class="dblk rem"><div style="white-space:pre-wrap">${esc(blockText(b))}</div></div>`; }).join('');
  return `<div class="row" style="margin:8px 0 14px"><span class="chip ok">+${add} додано</span><span class="chip warn">${chg} змінено</span><span class="chip crit">−${rem} видалено</span></div>` + (add + chg + rem ? h : '<div class="empty">Текст не змінився.</div>');
}

  return h;
}

const COLLAPSED = /Паспорт|Пов.?язані документи|Відкриті питання|Історія версій/;
function blocksHtml(blocks, ctx, prefix=''){
  let h = '', list = null, inSec = false, k = 0;
  const closeList = () => { if (list){ h += `</${list}>`; list = null; } };
  blocks.forEach((b, i) => {
    if (b.t !== 'li') closeList();

      const m = b.text.match(/^(\d+)\./); const id = prefix + (m ? 's-'+m[1] : 'h-'+(k++));

    else if (b.t === 'p'){
      const m = b.text.match(/^(\d+(?:\.\d+)+)\.?\s+(.*)$/s);

        h += `<p class="np${b.indent?' ind':''}" id="${prefix}${pid}"><span class="n">${m[1]}</span><span>${inline(m[2], ctx)}</span>${fb}</p>`;
        if (ctx && ctx.flags && FLAG.open === ctx.code + '|' + pid) h += flagBox(ctx.code, pid); }
      else h += `<p id="${prefix}b-${i}" class="${b.indent?'ind':''}${/:$/.test(b.text)?' sub':''}">${inline(b.text, ctx)}</p>`;
    }
    else if (b.t === 'li'){ const t = b.ord ? 'ol' : 'ul'; if (list !== t){ closeList(); h += `<${t}>`; list = t; } h += `<li>${inline(b.text, ctx)}</li>`; }
    else if (b.t === 'quote') h += `<blockquote>${inline(b.text, ctx)}</blockquote>`;
    else if (b.t === 'table'){
      const [head, ...rest] = b.rows;
      h += `<div class="tbl" id="${prefix}b-${i}"><table><thead><tr>${head.map(c => `<th>${inline(c, ctx)}</th>`).join('')}</tr></thead><tbody>${rest.map(r => `<tr>${r.map(c => `<td>${inline(c, ctx)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
  });
  closeList(); if (inSec) h += '</div></details>';

}

function openQuestions(code){

    if (b.t === 'h'){ if (on) break; on = /Відкриті питання/.test(b.text); continue; }
    if (!on || b.t !== 'p') continue;
    const m = b.text.match(/^(\d+(?:\.\d+)+)\.?\s+(.*)$/s);
    if (m) items.push({n:m[1], text:m[2], sub}); else sub = b.text;
  }
  return items;
}

    if (f.ansAt) ev.push({t:'flag-answer', who:f.uid, by:f.ansBy, c:f.c, p:f.p, at:f.ansAt, text:f.answer}); });

/* ---------------- router ---------------- */
let lastRoute = null;
function parseRoute(){
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  if (h.startsWith('doc-')){ const [base, anchor] = h.slice(4).split('--'); return {view:'doc', code:unslug(base), anchor}; }
  if (h.startsWith('prop-')) return {view:'prop', id:h.slice(5)};
  let m = h.match(/^tool-(\d+)$/); if (m) return {view:'tool', p:+m[1]};
  m = h.match(/^ref-([\w]+)$/); if (m) return {view:'ref', id:m[1]};
  m = h.match(/^old-(\d+)$/); if (m) return {view:'old', p:+m[1]};
  return {view:h};
}
function render(){
  const r = parseRoute(); const route = decodeURIComponent(location.hash.slice(1)) || 'home';
  if (r.view === 'old'){ window.show(r.p); return; }
  const oldVer = r.view === 'doc' && /^(ver|diff)-/.test(r.anchor || '');
  const routeKey = r.view === 'doc' && !oldVer ? 'doc-' + slug(r.code) : route;
  $('#side').innerHTML = sideHtml(route);
  const prog = myProgress(); const chip = $('#meChip');
  $('#meCnt').textContent = S.uid && prog.req.length ? `${prog.ok}/${prog.req.length}` : '—';
  chip.classList.toggle('due', prog.overdue.length > 0);
  const keep = routeKey === lastRoute; const y = window.scrollY;
  if (keep && (r.view === 'tool' || (r.view === 'ref' && r.id === 'pitch'))) return; // interactive tools keep their own state
  const openState = {}; if (keep) $('#main').querySelectorAll('details[id]').forEach(d => openState[d.id] = d.open);
  let html;
  switch (r.view){
    case 'doc': html = oldVer ? viewOldVersion(r.code, r.anchor) : viewDoc(r.code); break;
    case 'archive': html = viewArchive(); break;
    case 'flags': html = viewFlags(); break;
    case 'prop': html = viewProposal(r.id); break;
    case 'tool': html = viewTool(r.p); break;
    case 'ref': html = viewRef(r.id); break;
    case 'registry': html = viewRegistry(); break;
    case 'core': html = viewCore(); break;
    case 'ready': html = viewReady(); break;
    case 'streams': html = viewStreams(); break;
    case 'proposals': html = viewProposals(); break;
    case 'decisions': html = viewDecisions(); break;
    case 'demand': html = viewDemand(); break;
    case 'legend': html = viewLegend(); break;
    case 'me': html = viewMe(); break;
    case 'team': html = viewTeam(); break;
    case 'journal': html = viewJournal(); break;
    case 'roles': html = viewRoles(); break;
    case 'newbie': html = viewNewbie(); break;
    case 'questions': html = viewQuestions(); break;
    default: html = viewHome();
  }
  const ae = document.activeElement; const focusId = ae && ae.id && $('#main').contains(ae) ? ae.id : null; const selStart = focusId && ae.selectionStart;
  $('#main').innerHTML = html;
  sectionize($('#main'));
  if (keep) Object.entries(openState).forEach(([id, o]) => { const d = document.getElementById(id); if (d) d.open = o; });
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} } }
  if (keep) window.scrollTo(0, y);
  else {
    lastRoute = routeKey;
    const anchor = r.view === 'doc' && !oldVer && r.anchor;
    const el = anchor && document.getElementById(anchor);
    if (el){ openTo(el); if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({block:'start'});
      if (/^(p|b)-/.test(anchor)){ el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 2200); } }
    else window.scrollTo(0, 0);
    document.title = (r.view==='doc' ? r.code + ' · ' : '') + 'Freitty CS Wiki';
    if (r.view === 'tool' || (r.view === 'ref' && r.id === 'pitch')) legacyInit(r.view === 'tool' ? r.p : 11);
    if (r.view === 'ref' && r.id === '12') setTimeout(() => { try { showP('oo'); } catch {} }, 30);
  }
  fillNames();
  closeDrawer();
}
function legacyInit(p){

    if (p === 4) updProg();
    if (p === 8) rstkInit();
    if (p === 9){ if (typeof netLeafletMap !== 'undefined' && netLeafletMap){ try { netLeafletMap.remove(); } catch {} } netLeafletMap = null; netLeafletInited = false; netActiveServices = new Set(); netActiveTypes = new Set(); netCurrentTab = 'cards'; }
  } catch (e) { console.warn('tool init', e); } }, 30);
}
window.addEventListener('hashchange', () => { lastRoute = null; render(); });

/* ---------------- events ---------------- */
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.sg')){ sgOpen[d.dataset.sg] = d.open; store.set('sg', sgOpen); } }, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rf){ RF[t.dataset.rf] = t.value; render(); }
  if (t.dataset.qz){ const [c, qi, oi] = t.dataset.qz.split('|'); const st = QZ[c] || (QZ[c] = {ans:{}, res:null, tries:0}); st.ans[+qi] = +oi; }
  if (t.dataset.jf !== undefined){ JF[t.dataset.jf] = t.value; render(); }
  if (t.id === 'myRole' && t.value) setMyRole(t.value);
  if (t.id === 'nbRole'){ try { sessionStorage.setItem('nbrole', t.value); } catch {} render(); }
  if (t.id === 'teamRoleFilter'){ TEAM.roleFilter = t.value; render(); }
  if (t.dataset.setrole && t.value) setPersonRole(t.dataset.setrole, t.value, false);
  if (t.dataset.mx){ const [c, role] = t.dataset.mx.split('|'); const m = JSON.parse(JSON.stringify(S.matrix)); const set = new Set(m[c]||[]); t.checked ? set.add(role) : set.delete(role); m[c] = [...set]; saveMatrix(m, c, role, t.checked); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'rf-q'){ RF.q = t.value; render(); }
  if (t.id === 'teamQ'){ TEAM.q = t.value; if (!S.user) return; S.user.search(t.value).then(hits => { const o = $('#teamOpts'); if (!o) return;
    o.innerHTML = hits.map(p => `<button data-addp="${esc(p.id)}"><img src="${esc(p.avatarUrl)}" alt="" width="20" height="20" style="border-radius:50%"><span></span></button>`).join(''); o.hidden = !hits.length;
    o.querySelectorAll('button').forEach((b, i) => b.querySelector('span').textContent = hits[i].name || 'Колега'); }); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'teamQ' && S.user) e.target.dispatchEvent(new Event('input', {bubbles:true})); });
document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) { if (!e.target.closest('.srch')) $('#sres').hidden = true; return; }
  if (t.dataset.sign){ sign(t.dataset.sign); return; }
  if (t.dataset.qcheck){ checkQuiz(t.dataset.qcheck); return; }
  if (t.dataset.flag){ FLAG.open = FLAG.open === t.dataset.flag ? null : t.dataset.flag; render(); if (FLAG.open) setTimeout(() => $('#flText')?.focus(), 0); return; }
  if (t.dataset.flsend){ const [c, pid] = t.dataset.flsend.split('|'); sendFlag(c, pid); return; }
  if (t.dataset.flans){ const [u, id] = t.dataset.flans.split('|'); answerFlag(u, id, false); return; }
  if (t.dataset.flclose){ const [u, id] = t.dataset.flclose.split('|'); answerFlag(u, id, true); return; }
  if (t.dataset.flst){ try { sessionStorage.setItem('flst', t.dataset.flst); } catch {} render(); return; }
  if (t.dataset.sitg){ try { sessionStorage.setItem('sitg', t.dataset.sitg); } catch {} render(); return; }
  if (t.dataset.fold){ const open = t.dataset.fold === 'open'; $('#main').querySelectorAll('details.sec, details.mat, details.lsec, details.blk').forEach(d => d.open = open); return; }
  if (t.dataset.addp){ const role = $('#teamRoleNew').value; TEAM.q = ''; setPersonRole(t.dataset.addp, role, true); return; }
  if (t.dataset.assign){ TEAM.assignFor = TEAM.assignFor === t.dataset.assign ? null : t.dataset.assign; render(); return; }
  if (t.dataset.apsave){ const id = t.dataset.apsave; const panel = document.getElementById('ap-' + id); const due = $('#apDue').value || null;
    const before = S.team.assign[id]?.items || {}; const items = {};
    panel.querySelectorAll('[data-apc]').forEach(cb => { if (cb.checked){ const c = cb.dataset.apc; items[c] = before[c] || {due, at:new Date().toISOString(), by:S.uid}; } });
    TEAM.assignFor = null; saveAssign(id, items); return; }
  if (t.id === 'csvBtn'){ exportCsv(); return; }
  if (t.id === 'menuBtn'){ toggleSide(); return; }
  if (t.classList.contains('srch-it')){ $('#sres').hidden = true; $('#si').value = ''; }
  if (!e.target.closest('.srch')) $('#sres').hidden = true;
});
const isNarrow = () => window.matchMedia('(max-width:900px)').matches;
if (store.get('noside') === true) document.body.classList.add('noside');
function toggleSide(){
  if (!isNarrow()){ const hide = !document.body.classList.contains('noside'); document.body.classList.toggle('noside', hide); store.set('noside', hide); return; }
  const s = $('#side'); const open = !s.classList.contains('open'); s.classList.toggle('open', open);
  let sc = $('.scrim'); if (open && !sc){ sc = document.createElement('div'); sc.className = 'scrim'; sc.onclick = closeDrawer; document.body.appendChild(sc); } if (!open && sc) sc.remove();
}
function closeDrawer(){ $('#side').classList.remove('open'); const sc = $('.scrim'); if (sc) sc.remove(); }

/* search box */
const si = $('#si'), sres = $('#sres'); let sel = -1;
si.addEventListener('input', () => {
  const q = si.value.trim(); sel = -1;
  if (q.length < 2){ sres.hidden = true; return; }
  const res = search(q);
  if (!res.length && q.length >= 3) logGap(q);
  sres.innerHTML = res.length ? `<div class="cnt">Знайдено: ${res.length}${res.length===40?'+':''}</div>` + res.map(it => `<a class="srch-it" href="#${it.route}"><div class="l">${esc(it.label)} · ${esc(it.title)}${it.where?' · '+esc(it.where):''}</div><div class="s">${snippet(it.raw, q)}</div></a>`).join('') : `<div class="cnt">Нічого не знайдено. Спробуйте інше слово або код документа.</div>`;
  sres.hidden = false;
});
si.addEventListener('keydown', e => {
  const items = [...sres.querySelectorAll('.srch-it')];
  if (e.key === 'Escape'){ sres.hidden = true; si.blur(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(0, Math.min(items.length-1, sel + (e.key==='ArrowDown'?1:-1))); items.forEach((x,i) => x.classList.toggle('on', i===sel)); items[sel]?.scrollIntoView({block:'nearest'}); }
  if (e.key === 'Enter'){ const it = items[Math.max(sel,0)]; if (it){ location.hash = it.getAttribute('href'); sres.hidden = true; si.value = ''; si.blur(); } }
});
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); si.focus(); si.select(); } });

render();
initShared().catch(() => { S.ready = true; S.noAccess = true; render(); });
})();
</script>
