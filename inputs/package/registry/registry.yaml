  note: 'Драфт v0.1 від 06.09.2026 як ПОЛІТИКА МЕЖІ. Зміст роботи з carrierами описує брокерська команда окремим документом; тут зафіксована лише роль CS: прийняти, кваліфікувати, передати. Брокер - ввічлива
    відмова; carrier / owner-operator / невизначено - передача в Netcor. Планується IVR з гілкою transport для carrierів. БЛОКУЄ: документа брокерської команди не існує. Правова роль Freitty у транспорті
    (FLAG-4 SOP-S8.1) НЕ передається брокерській команді - визначає режим відповідальності за вантаж, лишається за Havryliuk'
