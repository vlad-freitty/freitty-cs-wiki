  note: 'Драфт v0.2 від 06.09.2026 як СТРУКТУРА: розділи 4 (правова роль за сервісами), 8 (межі) і 9 (виключення) свідомо не заповнені - вимагають рішення власника з юридичним радником і страховиком. Канал:
    усі претензії через claims@freitty.com і через Andy Havryliuk, без порогу за сумою. ГОЛОВНЕ ПИТАННЯ: у транспорті Freitty - перевізник, посередник чи координатор? Заборонені обидві крайності: не визнавати
    і не відкидати відповідальність до зясування'
- code: POL-18
  title: Політика передплати, скасування і повернення коштів
  level: L1 Політика
  stream: Комерція
  tier: 0 - критичний
