  - SOP-2.5
  - TPL-01
  - TPL-14
  note: 'Драфт v0.9 від 06.09.2026. ОПЛАТА ТІЛЬКИ STRIPE. Порядок: операції в ордер Freitty Hub -> інвойс-лінк Stripe -> автоматично на номер телефону ПЛЮС обовязковий лист від CS. RESTACK: склад не починає
    до надходження коштів, робить лише оплачені паллети; при більшій кількості сигналізує CS, робота на додатковий обсяг - лише після апруву І оплати. Реакції до 10 хв. CS не мовчить ні в бік клієнта, ні
    в бік складу: при відсутності відповіді клієнта склад отримує статус. КОНФЛІКТ: TPL-01 озвучує Zelle, EFS, Wire, QuickBooks. БЛОКУЄ затвердження: розділ 8 від Billing, порожні поля STD-16. Наступна
    версія - 1.0'
- code: POL-19
  title: Політика залучення carrier`ів і брокерів
  level: L1 Політика
  stream: Право і безпека
  tier: 0 - критичний
  owner: Sofiia
  format: Сторінка
