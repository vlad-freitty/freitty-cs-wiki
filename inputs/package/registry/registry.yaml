  - POL-14
  note: 'Драфт v0.1 від 06.09.2026. Три категорії: приймаємо, приймаємо з умовами, не приймаємо ніколи. Правило "невпевненість = відмова до перевірки". Агент, який відмовив за правилами, не винен у втраченому
    клієнті. БЛОКУЮТЬ: STD-14 (сам перелік вантажів і hazmat-класів) і власник документа. TPL-01 вимагає відповіді про hazmat під час дзвінка - виконуване лише якщо перелік доступний у CRM'
