  note: 'Драфт документа v0.2 від 09.09.2026 (реєстр веде 0.5). Додано Додаток А — реєстр 20 закріплених компаній з MC і робочою категорією; перелік винесено в REG-09 як єдине джерело. Введено провізорний
    статус до затвердження STD-17, розділено робочу категорію і статус клієнта. БЛОКУЄ: STD-17; двадцять клієнтів на одну ранкову зміну (скоротити / розшарувати статус / додати людину); owner і backup не
    заповнені ні для однієї компанії'
- code: STD-01
  title: Рівень сервісу на вхідній телефонній лінії
  level: L2 Стандарт
  stream: Сервіс
  tier: 0 - критичний
  owner: Oksana
  format: Сторінка
  storage: Notion / Freitty CS
  status: Чернетка
  version: '2'
  approved: null
  next_review: null
  related:
