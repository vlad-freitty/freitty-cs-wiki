<style>
/* ═══ 02-styles.css ═══ */
:root{
  --bg:#09090f;--surf:#111118;--surf2:#18181f;--bord:#252532;
  --red:#ff3d5a;--pur:#6c63ff;--teal:#00d9a3;--amb:#f59e0b;--blue:#378add;
  --tx:#dddde8;--mu:#777790;--wh:#ffffff;
  --sb:290px;--hh:62px;--th:50px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans','Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}

/* Global emoji fallback — buttons/inputs/select inherit emoji-capable fonts so 🧮💰📍✅📝⚙️ render on Win/Linux */
button,input,select,textarea{font-family:'DM Sans','Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji',sans-serif}

/* ─ HEADER ─ */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);background:rgba(9,9,15,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:18px;padding:0 22px;z-index:300}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;line-height:1;flex-shrink:0}
.logo img{height:30px;width:auto;display:block}
.logo .logo-sub{font-family:'Space Mono',monospace;font-size:8px;color:var(--mu);letter-spacing:2px;font-weight:400;white-space:nowrap}
@media(max-width:600px){.logo .logo-sub{display:none}}
.hdiv{width:1px;height:26px;background:var(--bord);flex-shrink:0}
.sw{flex:1;max-width:460px;display:flex;align-items:center;gap:9px}
.sico-ext{flex-shrink:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--mu);background:var(--surf2);border:1.5px solid var(--bord);border-radius:8px}
.si-wrap{flex:1;position:relative;min-width:0}
.si{width:100%;background:var(--surf2);border:1.5px solid var(--bord);color:var(--tx);padding:8px 64px 8px 14px;border-radius:9px;font-family:'DM Sans','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:13.5px;outline:none;transition:border-color .2s,box-shadow .2s}
.si:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
.si::placeholder{color:var(--mu)}
.skbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);background:var(--surf);border:1px solid var(--bord);border-radius:3px;padding:2px 6px;pointer-events:none;letter-spacing:.5px}
.sres{position:absolute;top:calc(100% + 7px);left:0;right:0;background:var(--surf2);border:1px solid var(--bord);border-radius:11px;max-height:420px;overflow-y:auto;display:none;z-index:400;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.sres.on{display:block}
.sri{padding:11px 15px;cursor:pointer;border-bottom:1px solid var(--bord);transition:background .1s}
.sri:last-child{border-bottom:none}
.sri:hover{background:rgba(108,99,255,.07)}
.sri-l{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--pur);margin-bottom:2px}
.sri-t{font-weight:600;font-size:12.5px;color:var(--wh);margin-bottom:3px}
.sri-s{font-size:11.5px;color:var(--mu);line-height:1.45}
.sri-s mark{background:rgba(255,61,90,.18);color:var(--red);border-radius:2px;padding:0 2px;font-style:normal}
.se{padding:18px;text-align:center;color:var(--mu);font-size:12.5px}
.scnt{padding:6px 15px;font-size:10.5px;color:var(--mu);border-bottom:1px solid var(--bord);font-family:'Space Mono',monospace}

/* ─ TABS ─ */
.tabs{position:fixed;top:var(--hh);left:0;right:0;height:var(--th);background:var(--surf);border-bottom:1px solid var(--bord);display:flex;align-items:center;padding:0 14px 0 calc(var(--sb) + 14px);gap:2px;overflow-x:auto;z-index:290;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'DM Sans','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:12.5px;font-weight:600;color:var(--mu);background:transparent;border:1.5px solid transparent;border-radius:7px;padding:4px 13px;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--tx);background:var(--surf2)}
.tab.on{color:var(--red);border-color:rgba(255,61,90,.35);background:rgba(255,61,90,.06)}

/* ─ LAYOUT ─ */
.layout{display:flex;margin-top:calc(var(--hh) + var(--th));min-height:calc(100vh - var(--hh) - var(--th))}

/* ─ SIDEBAR ─ */
.sb{position:fixed;top:calc(var(--hh) + var(--th));left:0;width:var(--sb);height:calc(100vh - var(--hh) - var(--th));overflow-y:auto;background:var(--surf);border-right:1px solid var(--bord);padding:8px 0 24px;scrollbar-width:thin;scrollbar-color:var(--bord) transparent}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:var(--bord);border-radius:2px}
/* Group header — клікабельний, розгортає/згортає */
.sb-grp{border-bottom:1px solid var(--bord)}
.sb-grp-h{display:flex;align-items:center;gap:8px;padding:9px 15px 9px 14px;cursor:pointer;user-select:none;transition:background .12s}
.sb-grp-h:hover{background:rgba(255,255,255,.03)}
.sb-grp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-grp-ttl{font-size:11px;font-weight:700;color:var(--tx);flex:1;letter-spacing:.1px}
.sb-grp-cnt{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);background:var(--surf2);border:1px solid var(--bord);border-radius:6px;padding:1px 5px;white-space:nowrap}
.sb-grp-arr{width:10px;height:10px;color:var(--mu);transition:transform .18s;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.sb-grp-arr svg{width:100%;height:100%;display:block}
.sb-grp-arr.open{transform:rotate(90deg)}
.sb-body{overflow:hidden;transition:max-height .2s ease}
.sb-body.closed{max-height:0!important}
/* Item */
.sb-i{display:flex;align-items:flex-start;gap:0;padding:6px 12px 6px 28px;cursor:pointer;border-left:3px solid transparent;transition:all .11s;line-height:1.35;position:relative}
.sb-i:hover{background:var(--surf2);border-left-color:var(--bord)}
.sb-i.on{border-left-color:var(--red);background:rgba(255,61,90,.05)}
.sb-i.on .sb-t{color:var(--wh);font-weight:600}
.sb-t{font-size:11.5px;color:var(--mu);flex:1;word-break:break-word;line-height:1.4}
.sb-dot{width:5px;height:5px;border-radius:50%;background:var(--bord);flex-shrink:0;margin-right:8px;margin-top:5px;transition:background .11s}
.sb-i.on .sb-dot{background:var(--red)}
.sb-i:hover .sb-dot{background:var(--mu)}
/* Tool items */
.sb-i.tool-item{padding-left:24px}
.sb-i.tool-item .sb-t{color:var(--tx)}
.pill{display:inline-block;padding:1px 5px;border-radius:4px;font-size:8.5px;font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.4px;vertical-align:middle;margin-left:3px}
.p-t{background:rgba(255,61,90,.12);color:var(--red)}
.p-g{background:rgba(0,217,163,.12);color:var(--teal)}
.p-w{background:rgba(245,158,11,.14);color:var(--amb)}
.p-b{background:rgba(108,99,255,.14);color:var(--pur)}
.p-n{background:rgba(55,138,221,.14);color:var(--blue)}

/* ─ MAIN ─ */
.main{margin-left:var(--sb);flex:1;padding:30px 44px 56px;max-width:100%}
.page{display:none}
.page.on{display:block;animation:fu .25s ease}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pi{background:var(--surf);border:1px solid var(--bord);border-radius:15px;padding:34px 42px;max-width:940px}

/* ─ TYPOGRAPHY ─ */
.pi h1{font-family:'Syne','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:25px;font-weight:800;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--bord);background:linear-gradient(135deg,#fff 55%,rgba(108,99,255,.55));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
/* Restore emoji visibility in h1 — break gradient text-clip for icon span */
.pi h1 .h1-icon{-webkit-text-fill-color:initial;background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--wh);margin-right:2px;display:inline-block}
.pi h2{font-family:'Syne','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:19px;font-weight:700;color:var(--wh);margin:26px 0 10px;-webkit-text-fill-color:var(--wh)}
.pi h3{font-size:14.5px;font-weight:700;color:var(--pur);margin:20px 0 8px;display:flex;align-items:center;gap:8px;-webkit-text-fill-color:var(--pur)}
.pi h3::before{content:'';display:inline-block;width:3px;height:13px;background:linear-gradient(180deg,var(--pur),var(--teal));border-radius:2px;flex-shrink:0}
.pi h4{font-size:11px;font-weight:700;color:var(--teal);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.9px;font-family:'Space Mono',monospace;-webkit-text-fill-color:var(--teal)}
.pi p{font-size:14px;line-height:1.75;color:var(--tx);margin-bottom:10px}
.pi blockquote{border-left:3px solid var(--red);background:rgba(255,61,90,.06);padding:12px 16px;border-radius:0 9px 9px 0;margin:14px 0;font-size:13.5px}
.pi code{font-family:'Space Mono',monospace;font-size:11.5px;background:rgba(108,99,255,.11);color:var(--pur);padding:2px 6px;border-radius:4px;border:1px solid rgba(108,99,255,.18)}
.pi ul,.pi ol{margin:8px 0 12px 6px;list-style:none}
.pi li{font-size:13.5px;line-height:1.7;color:var(--tx);padding:3px 0 3px 18px;position:relative}
.pi li::before{content:'▸';color:var(--teal);position:absolute;left:2px;top:5px;font-size:10.5px}
.pi table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px;border-radius:9px;overflow:hidden;border:1px solid var(--bord)}
.pi th{background:var(--surf2);color:var(--wh);font-weight:600;padding:9px 13px;text-align:left;border-bottom:2px solid var(--bord);font-size:12px}
.pi td{padding:8px 13px;border-bottom:1px solid var(--bord);color:var(--tx);vertical-align:top;font-size:12.5px}
.pi tr:last-child td{border-bottom:none}
.pi tr:nth-child(even) td{background:rgba(255,255,255,.012)}
.pi strong{font-weight:700;color:var(--wh)}
.pi em{font-style:italic;color:var(--mu)}

/* ─ BOXES ─ */
.ibox{background:rgba(108,99,255,.07);border:1px solid rgba(108,99,255,.22);border-left:3px solid var(--pur);border-radius:0 9px 9px 0;padding:12px 16px;margin:12px 0;font-size:13.5px}
.wbox{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);border-left:3px solid var(--amb);border-radius:0 9px 9px 0;padding:12px 16px;margin:12px 0;font-size:13.5px}
.sbox{background:rgba(0,217,163,.06);border:1px solid rgba(0,217,163,.22);border-left:3px solid var(--teal);border-radius:0 9px 9px 0;padding:12px 16px;margin:12px 0;font-size:13.5px}
.dbox{background:rgba(255,61,90,.06);border:1px solid rgba(255,61,90,.22);border-left:3px solid var(--red);border-radius:0 9px 9px 0;padding:12px 16px;margin:12px 0;font-size:13.5px}
.phrase{background:rgba(0,217,163,.05);border:1px solid rgba(0,217,163,.18);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:11px 15px;margin:8px 0;font-size:13.5px;font-style:italic;color:var(--wh)}
.phrase .lbl{font-size:9.5px;font-family:'Space Mono',monospace;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;font-style:normal}
.bdg{display:inline-block;padding:2px 8px;border-radius:18px;font-size:10.5px;font-family:'Space Mono',monospace;font-weight:700;margin:0 2px 2px 0}
.bg-g{background:rgba(0,217,163,.13);color:var(--teal);border:1px solid rgba(0,217,163,.28)}
.bg-b{background:rgba(108,99,255,.13);color:var(--pur);border:1px solid rgba(108,99,255,.28)}
.bg-r{background:rgba(255,61,90,.11);color:var(--red);border:1px solid rgba(255,61,90,.28)}
.bg-a{background:rgba(245,158,11,.11);color:var(--amb);border:1px solid rgba(245,158,11,.28)}
.bg-x{background:rgba(119,119,144,.11);color:var(--mu);border:1px solid rgba(119,119,144,.28)}

/* ─ TOOLS ─ */
.tw{background:var(--surf2);border:1px solid var(--bord);border-radius:13px;padding:22px;margin:18px 0}
.tt{font-family:'Syne','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:17px;font-weight:700;color:var(--wh);margin-bottom:5px;display:flex;align-items:center;gap:9px}
.ts{font-size:12.5px;color:var(--mu);margin-bottom:18px}
label{font-size:10.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:4px;font-family:'Space Mono',monospace}
select,input[type=number],input[type=text]{width:100%;background:var(--surf);border:1.5px solid var(--bord);color:var(--tx);padding:8px 12px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s;-webkit-appearance:none;appearance:none}
select:focus,input:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(108,99,255,.09)}
select option{background:var(--surf2)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.fr3{grid-template-columns:1fr 1fr 1fr}
.fr1{grid-template-columns:1fr}
.btn{font-family:'DM Sans',sans-serif;font-weight:700;font-size:12.5px;padding:9px 18px;border-radius:7px;cursor:pointer;border:none;transition:all .15s}
.bp{background:var(--red);color:var(--wh)}
.bp:hover{background:#e0293f;transform:translateY(-1px)}
.bt{background:var(--teal);color:#000}
.bt:hover{background:#00c492}
.bg-btn{background:transparent;color:var(--tx);border:1.5px solid var(--bord)}
.bg-btn:hover{border-color:var(--pur);color:var(--pur)}
.rb{background:var(--surf);border:1px solid var(--bord);border-radius:9px;padding:18px;margin-top:14px;display:none}
.rb.on{display:block;animation:fu .18s ease}
.rn{font-size:34px;font-weight:700;color:var(--teal);font-family:'Syne',sans-serif;margin-bottom:3px}
.rl{font-size:10.5px;color:var(--mu);font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.7px}
.rbd{margin-top:14px;border-top:1px solid var(--bord);padding-top:12px}
.rbr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.04)}
.rbr:last-child{border-bottom:none;font-weight:700;color:var(--wh);padding-top:7px}
.rbv{font-family:'Space Mono',monospace;font-size:12.5px;color:var(--teal)}
.smsbox{background:rgba(0,217,163,.05);border:1px solid rgba(0,217,163,.18);border-radius:9px;padding:14px;margin-top:14px;font-size:12.5px;line-height:1.7;font-family:'Space Mono',monospace;color:var(--tx);white-space:pre-wrap;word-break:break-word}
.cpbtn{margin-top:7px;font-size:10.5px;padding:5px 11px}

/* ─ LINE ITEMS for multi-service calc ─ */
.line-item{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end;margin-bottom:8px}
.rm-btn{background:rgba(255,61,90,.12);border:1px solid rgba(255,61,90,.3);color:var(--red);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13px;transition:all .15s;white-space:nowrap;height:36px;font-family:'DM Sans',sans-serif}
.rm-btn:hover{background:rgba(255,61,90,.22)}
.add-btn{display:flex;align-items:center;gap:6px;background:rgba(108,99,255,.08);border:1.5px dashed rgba(108,99,255,.35);color:var(--pur);border-radius:7px;padding:8px 14px;cursor:pointer;font-size:12.5px;font-weight:600;transition:all .15s;width:100%;justify-content:center;margin-top:4px}

.item-total{font-family:'Space Mono',monospace;font-size:12px;color:var(--teal);padding:8px 10px;background:rgba(0,217,163,.06);border:1px solid rgba(0,217,163,.18);border-radius:6px;white-space:nowrap;height:36px;display:flex;align-items:center}

/* ─ CHECKLIST ─ */
.ckg{margin-bottom:18px}
.ckh{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--wh);margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--bord)}
.cki{display:flex;align-items:flex-start;gap:10px;padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.035);cursor:pointer;transition:background .1s;border-radius:5px}
.cki:hover{background:rgba(255,255,255,.025)}
.cki input[type=checkbox]{width:15px;height:15px;border-radius:3px;cursor:pointer;accent-color:var(--teal);flex-shrink:0;margin-top:2px}
.ck-tx{font-size:13px;color:var(--tx);line-height:1.5;flex:1}
.cki.done .ck-tx{text-decoration:line-through;color:var(--mu)}
.ck-note{font-size:10.5px;color:var(--mu);margin-top:2px;font-style:italic}
.ckprog{background:var(--surf2);border:1px solid var(--bord);border-radius:7px;padding:11px 15px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.pb{flex:1;height:5px;background:var(--bord);border-radius:3px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--teal),var(--pur));border-radius:3px;transition:width .3s ease}
.pt{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--mu);white-space:nowrap}

/* ─ SCRIPT FLOW ─ */
.sf-block{border:1px solid var(--bord);border-radius:9px;overflow:hidden;margin-bottom:6px}
.sfh{padding:10px 13px;display:flex;align-items:center;gap:9px;background:var(--surf2);cursor:pointer;user-select:none}
.sfh:hover{background:rgba(255,255,255,.03)}
.sf-num{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:5px}
.sf-ttl{font-size:12.5px;font-weight:600;color:var(--wh)}
.sf-body{padding:13px 15px;border-top:1px solid var(--bord)}
.branch-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.bc{padding:9px 11px;border-radius:7px;border:1.5px solid var(--bord);cursor:pointer;transition:all .14s}
.bc:hover{border-color:var(--pur)}
.bc.sel{border-color:var(--teal);background:rgba(0,217,163,.05)}
.bc-t{font-size:11.5px;font-weight:700;color:var(--wh);margin-bottom:4px}
.bc-s{font-size:10.5px;color:var(--mu);font-style:italic;line-height:1.4}
.br-result{margin-top:12px;display:none}
.br-result.on{display:block;animation:fu .18s ease}

/* ─ PRICE MATRIX ─ */
.pm-table{width:100%;border-collapse:collapse;font-size:12px}
.pm-table th{background:var(--surf2);color:var(--wh);font-weight:600;padding:8px 10px;text-align:center;border:1px solid var(--bord);font-size:11px;position:sticky;top:0}
.pm-table th:first-child{text-align:left;position:sticky;left:0;z-index:2;background:var(--surf2)}
.pm-table td{padding:7px 10px;border:1px solid var(--bord);text-align:center;color:var(--tx);font-size:12px;vertical-align:top}
.pm-table td:first-child{text-align:left;font-weight:600;color:var(--wh);background:var(--surf);position:sticky;left:0;font-size:11.5px}
.pm-table tr:nth-child(even) td{background:rgba(255,255,255,.012)}
.pm-section{background:var(--surf2);color:var(--pur);font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;padding:6px 10px!important;text-align:left!important}
.pm-wrap{overflow-x:auto;border:1px solid var(--bord);border-radius:9px;margin:14px 0}
.price-hi{color:var(--amb);font-weight:700}
.price-note{font-size:10px;color:var(--mu);font-style:italic;margin-top:2px}
.price-free{color:var(--teal);font-weight:700}
.price-na{color:var(--mu)}

/* ─ HUB CARDS ─ */
.hcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.hcard{background:var(--surf);border:1.5px solid var(--bord);border-radius:11px;padding:0;transition:border-color .14s;cursor:pointer;overflow:hidden}
.hcard:hover,.hcard.hl{border-color:var(--red)}
.hcard.hl{background:rgba(255,61,90,.02)}
.hc-head{padding:14px 15px 10px;border-bottom:1px solid var(--bord)}
.hc-n{font-family:'Syne',sans-serif;font-size:14.5px;font-weight:700;color:var(--wh);margin-bottom:4px}
.hc-a{font-size:11.5px;color:var(--mu);line-height:1.45}
.hc-body{padding:10px 15px}
.hc-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.hc-info{display:flex;flex-direction:column;gap:5px}
.hc-line{display:flex;align-items:flex-start;gap:8px;font-size:12px}
.hc-line-lbl{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;min-width:44px;padding-top:1px;flex-shrink:0}
.hc-line-val{color:var(--tx);line-height:1.5;flex:1}
.hc-gate{font-family:'Space Mono',monospace;font-size:12px;color:var(--teal);font-weight:700}
.hc-note{font-size:11px;color:var(--amb);padding:7px 10px;background:rgba(245,158,11,.06);border-top:1px solid rgba(245,158,11,.15);font-style:italic}

/* ─ HUB FINDER v2 — extended ─ */
.hf-bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px;align-items:center}
.hf-chip{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;color:var(--mu);background:transparent;border:1.5px solid var(--bord);border-radius:6px;padding:5px 11px;cursor:pointer;transition:all .15s;letter-spacing:.5px;text-transform:uppercase}
.hf-chip:hover{border-color:var(--mu);color:var(--tx)}
.hf-chip.on{background:var(--red);border-color:var(--red);color:#fff}
.hf-stats{font-size:11px;color:var(--mu);margin-left:auto;font-family:'Space Mono',monospace;letter-spacing:.5px}
.hc-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px;flex-shrink:0;align-self:flex-start}
.hc-badge.own{background:rgba(255,61,90,.12);color:var(--red);border:1px solid rgba(255,61,90,.3)}
.hc-badge.comp{background:rgba(108,99,255,.1);color:var(--pur);border:1px solid rgba(108,99,255,.25)}
.hc-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.hc-legal{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--mu);font-weight:400;letter-spacing:.5px;display:block;margin-top:2px}
.hc-svc-strip{display:flex;flex-wrap:wrap;gap:4px;padding:8px 15px;background:rgba(255,255,255,.015);border-bottom:1px solid var(--bord)}
.svc-chip{font-family:'Space Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.5px;padding:2px 7px;border-radius:3px}
.svc-chip.yes{background:rgba(0,217,163,.08);color:var(--teal);border:1px solid rgba(0,217,163,.2)}
.svc-chip.no{background:rgba(255,255,255,.025);color:var(--mu);border:1px solid var(--bord);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2);opacity:.6}
.hc-mini-price{margin-top:9px;padding:8px 10px;background:rgba(108,99,255,.04);border:1px solid rgba(108,99,255,.12);border-radius:7px}
.hc-mini-price-row{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;line-height:1.4}
.hc-mini-price-row span:first-child{color:var(--mu)}
.hc-mini-price-row span:last-child{color:var(--tx);font-family:'Space Mono',monospace;font-weight:600}
.hc-contacts{margin-top:10px;padding-top:9px;border-top:1px solid var(--bord)}
.hc-contact{display:flex;gap:6px;font-size:11.5px;padding:3px 0;line-height:1.4;flex-wrap:wrap}
.hc-contact .role{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;min-width:54px}
.hc-contact a{color:var(--teal);text-decoration:none;font-family:'Space Mono',monospace}
.hc-contact a:hover{text-decoration:underline}

/* ─ COVERAGE GAPS ─ */
.gap-list{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.gap-item{padding:8px 12px;border-left:3px solid var(--bord);background:rgba(255,255,255,.015);border-radius:0 6px 6px 0;font-size:12.5px;line-height:1.5}
.gap-item.warn{border-left-color:var(--amb);background:rgba(245,158,11,.04)}
.gap-item.danger{border-left-color:var(--red);background:rgba(255,61,90,.04)}
.gap-item b{color:var(--wh);font-family:'Syne',sans-serif;font-size:12px;font-weight:700}
.gap-item .gap-note{color:var(--mu);margin-top:2px}

/* ─ US MAP ─ */
.usmap-wrap{margin:16px 0;padding:14px;background:var(--surf);border:1.5px solid var(--bord);border-radius:11px}
.usmap{width:100%;max-width:900px;margin:0 auto;display:block}
.usmap-legend{display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap;font-size:11.5px;color:var(--mu)}
.usmap-legend .lg-pin{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.usmap-pin{transition:transform .15s,filter .15s;cursor:pointer}
.usmap-pin:hover{transform:scale(1.4);filter:drop-shadow(0 0 4px rgba(255,255,255,.5))}

/* ─ RESTACK ESTIMATOR — 2-col layout, fits 1 screen ─ */
.rstk-layout{display:grid;grid-template-columns:1fr 320px;gap:14px;margin-top:10px;align-items:start}
.rstk-inputs{display:flex;flex-direction:column;gap:10px;min-width:0}
.rstk-output{position:sticky;top:14px}
.rstk-block{background:var(--surf);border:1.5px solid var(--bord);border-radius:9px;padding:10px 12px}
.rstk-block-h{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-family:'Syne',sans-serif;font-weight:700;font-size:12.5px;color:var(--wh)}
.rstk-num{flex-shrink:0;width:20px;height:20px;border-radius:5px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:11px}
.rstk-grp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rstk-grp-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surf2);border:1.5px solid var(--bord);border-radius:7px;padding:8px 5px;cursor:pointer;transition:all .14s;color:var(--tx);font-family:'DM Sans',sans-serif}
.rstk-grp-btn:hover{border-color:var(--mu)}
.rstk-grp-btn.sel{border-color:var(--red);background:rgba(255,61,90,.06)}
.rstk-grp-icon{font-size:18px;line-height:1}
.rstk-grp-name{font-size:10.5px;font-weight:700;color:var(--wh);text-align:center;line-height:1.2}
.rstk-grp-range{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:.3px}
.rstk-sub-lbl-row{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.rstk-sub-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.rstk-sub-btn{display:grid;grid-template-columns:1fr auto;gap:4px 9px;align-items:center;background:var(--surf2);border:1.5px solid var(--bord);border-radius:7px;padding:7px 10px;cursor:pointer;transition:all .14s;text-align:left;font-family:'DM Sans',sans-serif;color:var(--tx)}
.rstk-sub-btn:hover{border-color:var(--mu)}
.rstk-sub-btn.sel{border-color:var(--teal);background:rgba(0,217,163,.05)}
.rstk-sub-btn.warn{border-color:rgba(245,158,11,.3)}
.rstk-sub-btn.warn.sel{border-color:var(--amb)}
.rstk-sub-name{font-size:11px;font-weight:700;color:var(--wh);grid-column:1;line-height:1.25}
.rstk-sub-desc{font-size:10px;color:var(--mu);grid-column:1;line-height:1.35}
.rstk-sub-price{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:var(--teal);grid-column:2;grid-row:1/3;align-self:center;white-space:nowrap}
.rstk-mods{display:flex;flex-direction:column;gap:7px}
.rstk-mods .rstk-mod-row{display:grid;grid-template-columns:60px 1fr;align-items:center;gap:9px;padding:0;color:inherit;font-size:inherit}
.rstk-mod-lbl{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.rstk-seg{display:flex;gap:3px;background:var(--surf2);border:1px solid var(--bord);border-radius:6px;padding:2px}
.rstk-seg-btn{flex:1;background:transparent;border:none;color:var(--mu);padding:5px 6px;border-radius:4px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:600;transition:all .14s;white-space:nowrap}
.rstk-seg-btn:hover{color:var(--tx)}
.rstk-seg-btn.on{background:var(--red);color:#fff}
.rstk-dmg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.rstk-dmg-btn{display:flex;align-items:flex-start;gap:7px;background:var(--surf2);border:1.5px solid var(--bord);border-radius:6px;padding:6px 8px;cursor:pointer;transition:all .14s;text-align:left;color:var(--tx);font-family:'DM Sans',sans-serif}
.rstk-dmg-btn:hover{border-color:var(--mu)}
.rstk-dmg-btn.on{border-color:var(--pur);background:rgba(108,99,255,.05)}
.rstk-dmg-btn.crit.on{border-color:var(--red);background:rgba(255,61,90,.05)}
.rstk-dmg-code{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;color:var(--mu);background:var(--surf);padding:1px 4px;border-radius:3px;flex-shrink:0;letter-spacing:.4px}
.rstk-dmg-btn.crit .rstk-dmg-code{color:var(--red);background:rgba(255,61,90,.08)}
.rstk-dmg-txt{font-size:10.5px;line-height:1.3}
.rstk-pal{display:flex;align-items:center;gap:9px}
.rstk-pal-btn{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--bord);background:var(--surf2);color:var(--tx);font-size:14px;font-weight:700;cursor:pointer;transition:all .14s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:0}
.rstk-pal-btn:hover{border-color:var(--red);color:var(--red)}
.rstk-pal-num{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--wh);min-width:28px;text-align:center}
.rstk-reset-btn{margin-left:auto;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--mu);background:transparent;border:1px solid var(--bord);border-radius:5px;padding:5px 9px;cursor:pointer;transition:all .14s;letter-spacing:.4px}
.rstk-reset-btn:hover{border-color:var(--red);color:var(--red)}
.rstk-result{background:var(--surf);border:1.5px solid var(--bord);border-radius:9px;padding:14px}
.rstk-empty{text-align:center;padding:24px 12px;color:var(--mu);font-size:11.5px}
.rstk-r-top{text-align:center;padding-bottom:11px;border-bottom:1px solid var(--bord)}
.rstk-r-eyebrow{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.rstk-r-price{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;color:var(--wh);line-height:1;letter-spacing:-1px}
.rstk-r-mid{font-size:10.5px;color:var(--mu);margin-top:4px}
.rstk-r-mid strong{color:var(--teal);font-family:'Space Mono',monospace}
.rstk-r-cx{display:inline-block;margin-top:6px;font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;background:rgba(255,255,255,.04);border-radius:3px}
.rstk-r-floor{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:11.5px;border-bottom:1px solid var(--bord)}
.rstk-r-mods{padding:8px 0;border-bottom:1px solid var(--bord)}
.rstk-r-mods .rstk-mod-row{display:flex;justify-content:space-between;font-size:10.5px;padding:2px 0;color:var(--mu)}
.rstk-r-mods .rstk-mod-row strong{color:var(--tx);font-family:'Space Mono',monospace}
.rstk-r-total{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bord)}
.rstk-r-time{display:flex;gap:11px;padding-top:10px}
.rstk-r-time-cell{flex:1;text-align:center}
@media(max-width:900px){
  .rstk-layout{grid-template-columns:1fr}
  .rstk-output{position:static}
  .rstk-grp-grid{grid-template-columns:repeat(3,1fr)}
  .rstk-sub-list{grid-template-columns:1fr}
  .rstk-dmg-grid{grid-template-columns:repeat(2,1fr)}
  .rstk-mods .rstk-mod-row{grid-template-columns:1fr;gap:4px}
}

/* ─ NETWORK & PARTNERS MODULE (dark adapted) ─ */
.net-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;padding:10px 14px;background:var(--surf);border:1.5px solid var(--bord);border-radius:9px;font-size:11.5px;color:var(--mu);font-family:'Space Mono',monospace;letter-spacing:.4px}
.net-meta-it{padding-right:14px;border-right:1px solid var(--bord)}
.net-meta-it:last-child{border-right:none}
.net-meta-it b{color:var(--wh);font-size:13.5px;font-family:'Syne',sans-serif;font-weight:800;margin-right:4px}
.net-meta-date{margin-left:auto;font-style:italic;color:var(--mu)}

.net-tabs{display:flex;gap:6px;margin:18px 0 14px;border-bottom:1.5px solid var(--bord);padding-bottom:0}
.net-tab{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--mu);background:transparent;border:none;padding:10px 16px;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;margin-bottom:-1.5px}
.net-tab:hover{color:var(--tx)}
.net-tab.on{color:var(--wh);border-bottom-color:var(--red)}

.net-tab-content{display:none}
.net-tab-content.on{display:block}

.net-toolbar{background:var(--surf);border:1.5px solid var(--bord);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.net-search{flex:1;min-width:240px;background:var(--surf2);border:1.5px solid var(--bord);color:var(--tx);padding:8px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.net-search:focus{border-color:var(--pur)}
.net-search::placeholder{color:var(--mu)}

.net-fgroup{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.net-fgroup-lbl{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-right:3px}
.net-chip{font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;color:var(--mu);background:transparent;border:1.5px solid var(--bord);border-radius:6px;padding:5px 11px;cursor:pointer;transition:all .14s}
.net-chip:hover{color:var(--tx);border-color:var(--mu)}
.net-chip-type.on[data-type="own"]{background:var(--red);border-color:var(--red);color:#fff}
.net-chip-type.on[data-type="partner"]{background:var(--teal);border-color:var(--teal);color:#0d0d10}
.net-chip-svc.on{background:var(--pur);border-color:var(--pur);color:#fff}
.net-result-count{margin-left:auto;font-size:11.5px;color:var(--mu);font-family:'Space Mono',monospace}
.net-result-count b{color:var(--wh)}

.net-section-divider{display:flex;align-items:center;gap:10px;margin:24px 0 12px;padding:10px 0;border-bottom:1.5px solid var(--bord);flex-wrap:wrap}
.net-sec-badge{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 9px;border-radius:4px}
.net-sec-own{background:rgba(255,61,90,.12);color:var(--red);border:1px solid rgba(255,61,90,.3)}
.net-sec-partner{background:rgba(0,217,163,.1);color:var(--teal);border:1px solid rgba(0,217,163,.25)}
.net-sec-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--wh);margin:0;-webkit-text-fill-color:var(--wh)}
.net-sec-count{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--mu);background:var(--surf2);padding:2px 8px;border-radius:4px;border:1px solid var(--bord)}
.net-sec-desc{font-size:11.5px;color:var(--mu);margin-left:auto;font-style:italic;flex-basis:100%}
@media (min-width:720px){.net-sec-desc{flex-basis:auto;margin-left:10px}}

.net-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:14px}
.net-card{background:var(--surf);border:1.5px solid var(--bord);border-left:4px solid var(--bord);border-radius:9px;overflow:hidden;transition:all .25s}
.net-card-own{border-left-color:var(--red)}
.net-card-partner{border-left-color:var(--teal)}
.net-card-hl{box-shadow:0 0 0 3px var(--red),0 8px 30px rgba(255,61,90,.3)}

.net-card-head{padding:12px 14px 9px;border-bottom:1px solid var(--bord)}
.net-card-own .net-card-head{background:linear-gradient(180deg,rgba(255,61,90,.04),transparent)}
.net-card-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px}
.net-card-name{font-family:'Syne',sans-serif;font-size:14.5px;font-weight:700;color:var(--wh);line-height:1.3}
.net-legal{display:block;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--mu);font-weight:400;letter-spacing:.4px;margin-top:3px}
.net-card-addr{font-size:11.5px;color:var(--tx);line-height:1.4}
.net-itrst{color:var(--mu);font-size:11px}

.net-market-badge{flex-shrink:0;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}
.net-mb-own{background:rgba(255,61,90,.14);color:var(--red);border:1px solid rgba(255,61,90,.32)}
.net-mb-gap{background:rgba(0,217,163,.12);color:var(--teal);border:1px solid rgba(0,217,163,.28)}
.net-mb-overlap{background:rgba(245,158,11,.14);color:var(--amb);border:1px solid rgba(245,158,11,.32)}
.net-mb-none{background:rgba(255,255,255,.04);color:var(--mu);border:1px solid var(--bord)}

.net-new-badge,.net-unv-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.7px;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle}
.net-new-badge{background:var(--teal);color:#0d0d10}
.net-unv-badge{background:rgba(245,158,11,.15);color:var(--amb);border:1px solid rgba(245,158,11,.3)}

.net-services-strip{padding:8px 14px;background:rgba(255,255,255,.015);border-bottom:1px solid var(--bord);display:flex;flex-wrap:wrap;gap:4px}
.net-svc{font-family:'Space Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.4px;padding:2px 7px;border-radius:3px}
.net-svc.yes{background:rgba(255,61,90,.08);color:var(--red);border:1px solid rgba(255,61,90,.2)}
.net-svc.no{background:rgba(255,255,255,.02);color:var(--mu);border:1px solid var(--bord);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2);opacity:.55}

.net-card-body{padding:11px 14px}
.net-info-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:11.5px;margin:0}
.net-info-grid dt{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.net-info-grid dd{color:var(--tx);margin:0;line-height:1.4}
.net-info-grid dd b{color:var(--wh);font-weight:700}
.net-phone{color:var(--teal);text-decoration:none;font-family:'Space Mono',monospace;font-size:11.5px}
.net-phone:hover{text-decoration:underline}
.net-email{color:var(--pur);text-decoration:none;font-family:'Space Mono',monospace;font-size:10.5px}
.net-email:hover{text-decoration:underline}
.net-gate{font-family:'Space Mono',monospace;color:var(--teal);font-weight:700}

.net-detail-section{margin-top:10px;padding-top:9px;border-top:1px solid var(--bord)}
.net-detail-section h4{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;-webkit-text-fill-color:var(--mu)}
.net-price-mini{width:100%;font-size:11.5px;border-collapse:collapse}
.net-price-mini td{padding:3px 0;color:var(--tx);line-height:1.4;vertical-align:top}
.net-price-mini td:first-child{color:var(--mu)}
.net-price-mini td:last-child{text-align:right;font-family:'Space Mono',monospace;color:var(--tx)}
.net-price-mini td:last-child b{color:var(--wh);font-family:'Space Mono',monospace}

.net-contacts{display:flex;flex-direction:column;gap:5px}
.net-contact-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11.5px;line-height:1.4}
.net-contact-role{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;min-width:54px}
.net-contact-name{color:var(--tx);font-weight:600}

.net-warn-strip{padding:9px 14px;background:rgba(245,158,11,.06);border-top:1px solid rgba(245,158,11,.18);font-size:11.5px;color:var(--amb);line-height:1.5}
.net-warn-strip b{color:var(--amb);font-weight:700}
.net-info-strip{padding:9px 14px;background:rgba(0,217,163,.05);border-top:1px solid rgba(0,217,163,.18);font-size:11.5px;color:var(--teal);line-height:1.5}
.net-info-strip b{color:var(--teal);font-weight:700}
.net-danger-strip{padding:9px 14px;background:rgba(255,61,90,.07);border-top:1px solid rgba(255,61,90,.25);font-size:11.5px;color:var(--red);line-height:1.5;font-weight:600}
.net-danger-strip b{color:var(--red);font-weight:700}

.net-empty{display:none;text-align:center;padding:40px 20px;color:var(--mu);font-style:italic;font-size:13px}
.net-empty.on{display:block}

/* MAP TAB */
.net-map-intro{padding:11px 14px;background:var(--surf2);border:1px solid var(--bord);border-radius:9px;font-size:12px;color:var(--mu);line-height:1.55;margin-bottom:14px}
.net-map-container{width:100%;height:580px;border:1.5px solid var(--bord);border-radius:10px;background:var(--surf);overflow:hidden}
.net-map-legend{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:14px;font-size:11.5px;color:var(--mu);padding:11px 0}
.net-legend-it{display:flex;align-items:center;gap:7px}
.net-pin-mini{display:inline-block;width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);flex-shrink:0}
.net-pin-mini.net-pin-own{background:var(--red)}
.net-pin-mini.net-pin-gap{background:var(--teal)}
.net-pin-mini.net-pin-overlap{background:var(--amb)}

/* Leaflet pins */
.net-pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.net-pin.net-pin-own{background:var(--red)}
.net-pin.net-pin-gap{background:var(--teal)}
.net-pin.net-pin-overlap{background:var(--amb)}
.net-pin span{transform:rotate(45deg);color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;line-height:1}
.net-pin.net-pin-overlap span{color:#0d0d10}

/* Leaflet popup adapted to dark */
.leaflet-popup-content-wrapper{background:var(--surf)!important;color:var(--tx)!important;border:1px solid var(--bord)!important;border-radius:8px!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important}
.leaflet-popup-content{margin:11px 13px!important;font-family:'DM Sans',sans-serif!important}
.leaflet-popup-tip{background:var(--surf)!important;border:1px solid var(--bord)!important}
.leaflet-popup-close-button{color:var(--mu)!important}
.leaflet-popup-close-button:hover{color:var(--wh)!important}
.net-popup-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--wh);margin-bottom:4px;display:block}
.net-popup-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-bottom:6px}
.net-popup-addr{font-size:11.5px;color:var(--tx);margin:5px 0;line-height:1.4}
.net-popup-svc{font-size:11px;color:var(--mu);line-height:1.5;margin-bottom:8px}
.net-popup-svc b{color:var(--tx)}
.net-popup-link{color:var(--teal)!important;text-decoration:none;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.4px;cursor:pointer}
.net-popup-link:hover{text-decoration:underline}

/* MATRIX TAB */
.net-mtx-intro{margin-bottom:18px}
.net-mtx-intro p{color:var(--tx);line-height:1.55;margin-bottom:9px}
.net-mtx-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--mu)}
.net-mb-square{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:5px}
.net-mb-square.net-mb-own{background:var(--red)}
.net-mb-square.net-mb-gap{background:var(--teal)}
.net-mb-square.net-mb-overlap{background:var(--amb)}
.net-mb-square.net-mb-none{background:rgba(255,255,255,.04);border:1px solid var(--bord)}

.net-mtx-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.net-mtx-card{background:var(--surf);border:1.5px solid var(--bord);border-radius:9px;padding:14px}
.net-mtx-num{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--red);line-height:1}
.net-mtx-lbl{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--wh);margin:5px 0 6px;-webkit-text-fill-color:var(--wh)}
.net-mtx-desc{font-size:11px;color:var(--mu);line-height:1.5}

.net-mtx-wrap{margin:18px 0;border:1.5px solid var(--bord);border-radius:9px;overflow-x:auto;background:var(--surf)}
.net-mtx-table{width:100%;border-collapse:collapse;font-size:12px}
.net-mtx-table th{text-align:left;padding:10px 10px;background:var(--surf2);color:var(--mu);font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-bottom:1.5px solid var(--bord);white-space:nowrap}
.net-mtx-table td{padding:9px 10px;border-bottom:1px solid var(--bord);color:var(--tx);vertical-align:top}
.net-mtx-table th.net-mtx-svc,.net-mtx-table td.net-mtx-svc{text-align:center;width:42px;padding:9px 4px}
.net-mtx-table td.net-mtx-svc{font-family:'Space Mono',monospace;font-weight:700}
.net-mtx-region td{background:rgba(255,255,255,.025);font-family:'Syne',sans-serif;font-weight:700;color:var(--wh);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;padding:7px 10px}

.net-gap-block{margin:14px 0;padding:13px 16px;border-left:3px solid var(--bord);background:var(--surf);border-radius:0 8px 8px 0}
.net-gap-green{border-left-color:var(--teal);background:rgba(0,217,163,.03)}
.net-gap-amber{border-left-color:var(--amb);background:rgba(245,158,11,.03)}
.net-gap-red{border-left-color:var(--red);background:rgba(255,61,90,.03)}
.net-gap-h{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--wh);margin-bottom:9px;-webkit-text-fill-color:var(--wh)}
.net-gap-it{padding:6px 0;font-size:12.5px;color:var(--tx);line-height:1.5;border-top:1px solid rgba(255,255,255,.04)}
.net-gap-it:first-of-type{border-top:none}
.net-gap-it b{color:var(--wh);font-weight:700}
.net-gap-note{color:var(--mu);font-size:11.5px}

@media (max-width:720px){
  .net-cards-grid{grid-template-columns:1fr}
  .net-toolbar{flex-direction:column;align-items:stretch}
  .net-map-container{height:420px}
  .net-mtx-wrap{font-size:11px}
}

/* ─ PRICE PAGE — TABS / COMPARISON / RULES ─ */
.price-tabs{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0;border-bottom:1.5px solid var(--bord)}
.price-tab{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--mu);background:transparent;border:none;padding:9px 14px;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;margin-bottom:-1.5px;display:flex;align-items:center;gap:6px}
.price-tab:hover{color:var(--tx)}
.price-tab.on{color:var(--wh);border-bottom-color:var(--red)}
.ptab-cnt{background:var(--surf2);border:1px solid var(--bord);padding:1px 6px;border-radius:9px;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--mu)}
.price-tab.on .ptab-cnt{background:var(--red);color:#fff;border-color:var(--red)}
.price-tab-content{display:none;margin-top:14px}
.price-tab-content.on{display:block}

.price-tbd{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--amb);background:rgba(245,158,11,.1);padding:2px 5px;border-radius:3px;letter-spacing:.4px}
.price-warn-row td{background:rgba(245,158,11,.05);font-size:11px;color:var(--amb);padding:6px 12px;font-style:italic;border-left:3px solid var(--amb)}

.price-cmp-wrap{margin:14px 0;border:1.5px solid var(--bord);border-radius:9px;overflow-x:auto;background:var(--surf)}
.price-cmp-table{width:100%;border-collapse:collapse;font-size:12.5px}
.price-cmp-table th{text-align:left;padding:10px 12px;background:var(--surf2);color:var(--mu);font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-bottom:1.5px solid var(--bord)}
.price-cmp-table td{padding:9px 12px;border-bottom:1px solid var(--bord);color:var(--tx);vertical-align:top;line-height:1.4}
.price-cmp-table tr:hover td{background:rgba(255,255,255,.012)}
.cmp-sep td{background:rgba(108,99,255,.06);color:var(--pur);font-family:'Syne',sans-serif;font-weight:700;font-size:11px;text-align:center;letter-spacing:1px;padding:7px 12px}
.cmp-badge{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase}
.cmp-badge.cmp-own{background:rgba(255,61,90,.12);color:var(--red);border:1px solid rgba(255,61,90,.3)}
.cmp-badge.cmp-partner{background:rgba(108,99,255,.1);color:var(--pur);border:1px solid rgba(108,99,255,.25)}
.cmp-price-green{color:var(--teal)!important}
.cmp-price-amb{color:var(--amb)!important}
.cmp-price-red{color:var(--red)!important}
.cmp-price-tbd{color:var(--mu)!important;font-style:italic}

.cmp-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.cmp-summary-card{padding:14px;border-radius:9px;border:1.5px solid var(--bord);background:var(--surf)}
.cmp-summary-card.cmp-green{border-left:4px solid var(--teal);background:rgba(0,217,163,.04)}
.cmp-summary-card.cmp-amb{border-left:4px solid var(--amb);background:rgba(245,158,11,.04)}
.cmp-summary-card.cmp-red{border-left:4px solid var(--red);background:rgba(255,61,90,.04)}
.cmp-num{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--wh);line-height:1;margin-bottom:6px}
.cmp-lbl{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--wh);margin-bottom:5px;-webkit-text-fill-color:var(--wh)}
.cmp-desc{font-size:11px;color:var(--mu);line-height:1.5}

.rule-block{display:flex;gap:14px;margin:14px 0;padding:14px 16px;background:var(--surf);border:1.5px solid var(--bord);border-left:4px solid var(--pur);border-radius:0 9px 9px 0}
.rule-block.rule-warn{border-left-color:var(--red);background:rgba(255,61,90,.03)}
.rule-block.rule-info{border-left-color:var(--teal);background:rgba(0,217,163,.03)}
.rule-num{flex-shrink:0;width:32px;height:32px;border-radius:8px;background:var(--pur);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px}
.rule-block.rule-warn .rule-num{background:var(--red)}
.rule-block.rule-info .rule-num{background:var(--teal);color:#0d0d10}
.rule-content{flex:1}
.rule-content h3{font-family:'Syne',sans-serif;font-size:14.5px;font-weight:700;color:var(--wh);margin:0 0 6px;-webkit-text-fill-color:var(--wh)}
.rule-content p{font-size:12.5px;color:var(--tx);margin-bottom:7px;line-height:1.5}
.rule-content ul{margin-left:18px;font-size:12.5px;color:var(--tx);line-height:1.6}
.rule-content ul li{margin-bottom:3px}
.rule-content ul ul{margin-top:4px;margin-bottom:4px}

/* ─ VORONKA / FUNNEL STAGES ─ */
.vor-flow{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.vor-stage{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surf);border:1.5px solid var(--bord);border-left-width:4px;border-radius:0 9px 9px 0;gap:14px;flex-wrap:wrap}
.vor-stage.vor-r{border-left-color:var(--red);background:rgba(255,61,90,.04)}
.vor-stage.vor-a{border-left-color:var(--amb);background:rgba(245,158,11,.04)}
.vor-stage.vor-b{border-left-color:var(--teal);background:rgba(0,217,163,.04)}
.vor-stage.vor-g{border-left-color:var(--pur);background:rgba(108,99,255,.04)}
.vor-stage-h{display:flex;align-items:center;gap:9px}
.vor-cnt{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;color:var(--mu);background:var(--surf2);padding:2px 7px;border-radius:4px;border:1px solid var(--bord)}
.vor-act{font-size:12px;color:var(--tx);font-style:italic}
.vor-arrow{text-align:center;font-size:14px;color:var(--mu);font-family:'Space Mono',monospace;line-height:1}

/* ─ PLATFORM PITCH TOOL ─ */
.pp-tabs{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0;border-bottom:1.5px solid var(--bord)}
.pp-tab{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--mu);background:transparent;border:none;padding:9px 14px;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;margin-bottom:-1.5px}
.pp-tab:hover{color:var(--tx)}
.pp-tab.on{color:var(--wh);border-bottom-color:var(--red)}
.pp-tab-content{display:none;margin-top:14px}
.pp-tab-content.on{display:block}
.pp-benefit{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:flex-start;padding:12px 14px;background:var(--surf);border:1.5px solid var(--bord);border-radius:9px;margin:8px 0}
.pp-benefit-num{flex-shrink:0;width:32px;height:32px;border-radius:8px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:15px}
.pp-benefit-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--wh);margin-bottom:4px;-webkit-text-fill-color:var(--wh)}
.pp-benefit-what{font-size:12px;color:var(--tx);margin-bottom:5px;line-height:1.5}
.pp-benefit-what b{color:var(--wh)}
.pp-segment{padding:13px 16px;background:var(--surf);border:1.5px solid var(--bord);border-left:4px solid var(--pur);border-radius:0 9px 9px 0;margin:10px 0}
.pp-segment-h{font-family:'Syne',sans-serif;font-size:14.5px;font-weight:700;color:var(--wh);margin-bottom:5px;-webkit-text-fill-color:var(--wh)}
.pp-segment-pain{font-size:12px;color:var(--mu);font-style:italic;margin-bottom:8px}
.pp-stop-row td{background:rgba(255,61,90,.04)}
.pp-go-row td{background:rgba(0,217,163,.04)}
.pp-soft-row td{background:rgba(245,158,11,.04)}
.pp-stars{font-size:13px;letter-spacing:1px}
.pp-stars.s3{color:var(--teal)}
.pp-stars.s1{color:var(--amb)}
.pp-stars.s0{color:var(--red);font-style:italic}

/* ─ TH DETECTOR ─ */
.th-s{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;border:1.5px solid var(--bord);cursor:pointer;transition:all .14s}
.th-s:hover{border-color:var(--pur)}
.th-s.sel{border-color:var(--teal);background:rgba(0,217,163,.05)}
.th-s input{accent-color:var(--teal);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.th-st{font-size:12.5px;color:var(--tx)}
.th-score{font-size:40px;font-weight:700;font-family:'Syne',sans-serif;margin-bottom:3px}
.scbar{height:7px;border-radius:3px;background:var(--bord);margin:7px 0;overflow:hidden}
.scfill{height:100%;border-radius:3px;transition:width .35s ease}

/* ─ NOL LOG ─ */
.nol-list{margin-top:12px;display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto}
.nol-i{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;background:var(--surf2);border-radius:6px;border:1px solid var(--bord);font-size:12.5px}
.nol-d{background:none;border:none;color:var(--mu);cursor:pointer;font-size:15px;padding:0 3px;transition:color .13s}
.nol-d:hover{color:var(--red)}

/* ─ PERSONA ─ */
.ptabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.ptb{padding:5px 13px;border-radius:18px;border:1.5px solid var(--bord);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .14s;color:var(--mu)}
.ptb:hover{color:var(--tx);border-color:var(--pur)}
.ptb.on{color:var(--red);border-color:var(--red);background:rgba(255,61,90,.07)}
.pp{display:none}
.pp.on{display:block;animation:fu .18s ease}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pg-b{background:var(--surf2);border:1px solid var(--bord);border-radius:9px;padding:13px}
.pg-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;font-family:'Space Mono',monospace}
.pg-i{font-size:12.5px;color:var(--tx);padding:2px 0 2px 13px;position:relative;line-height:1.5}
.pg-i::before{content:'▸';position:absolute;left:0;color:var(--teal);font-size:10px;top:4px}
.sig-box{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);border-left:3px solid var(--amb);border-radius:0 7px 7px 0;padding:9px 13px;margin-top:10px;font-size:12.5px;font-style:italic}
.cs-box{background:rgba(108,99,255,.07);border:1px solid rgba(108,99,255,.22);border-left:3px solid var(--pur);border-radius:0 7px 7px 0;padding:9px 13px;margin-top:7px;font-size:12.5px}

/* ─ STEP CARD ─ */
.step-card{display:flex;gap:0;margin:10px 0;border:1px solid var(--bord);border-radius:9px;overflow:hidden}
.step-num{width:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:22px;font-weight:800;background:var(--surf2)}
.step-body{flex:1;padding:14px 16px}
.step-title{font-size:14px;font-weight:700;color:var(--wh);margin-bottom:5px}
.step-desc{font-size:12.5px;color:var(--mu);margin-bottom:9px;line-height:1.5}
.step-note{font-size:11.5px;color:var(--mu);margin-top:8px;font-style:italic}

/* ─ MOBILE ─ */
@media(max-width:880px){
  :root{--sb:0px}
  .sb{display:none}
  .tabs{padding-left:14px}
  .main{padding:18px 14px 36px}
  .pi{padding:18px 16px}
  .fr,.fr3,.hcards,.branch-grid,.pgrid,.th-sigs{grid-template-columns:1fr}
  .line-item{grid-template-columns:1fr 1fr}
}
</style>

function addLine() {
  lineCount++;
  const id = lineCount;
  const svcOpts = `<option value="reload_std">Reload Standard</option><option value="reload_ubox">Reload U-Box</option><option value="reload_xl">Reload XL</option><option value="reload_xxl">Reload XXL</option><option value="storage">Storage (per day)</option><option value="parking_d">Parking Daily</option><option value="parking_w">Parking Weekly</option><option value="parking_m">Parking Monthly</option><option value="handwork">Handwork (per hr)</option><option value="fix_pallet">Fix Pallet</option><option value="dis_pallet">Disassembled Pallets</option><option value="wrap_low">Wrapping Low</option><option value="wrap_high">Wrapping High</option>`;
  const li = document.getElementById('line-items');
  const div = document.createElement('div');
  div.className = 'line-item';
  div.id = `li-${id}`;
  div.innerHTML = `
    <div><label>Сервіс</label><select class="line-svc" onchange="calcMulti()">${svcOpts}</select></div>
    <div><label>К-ть</label><input type="number" class="line-qty" value="1" min="1" oninput="calcMulti()"></div>
    <div id="li-total-${id}" class="item-total">$0</div>
    <button class="rm-btn" onclick="remLine(${id})">✕</button>`;
  li.appendChild(div);
  calcMulti();
}

function remLine(id) {
  const el = document.getElementById(`li-${id}`);
  if(el) el.remove();
  calcMulti();
}

function getPrice(hub, svc, qty, days) {
  const h = HUBS.find(x=>x.id===hub);
  if(!h) return 0;
  switch(svc) {
    case 'reload_std': return h.reload * qty;
    case 'reload_ubox': return 20 * qty;
    case 'reload_xl': return 10 * qty;
    case 'reload_xxl': return 15 * qty;
    case 'storage': { const free=h.storage_free; const paid=Math.max(0,days-free); return paid*2*qty; }
    case 'parking_d': return h.park_d * qty;
    case 'parking_w': return h.park_w * qty;
    case 'parking_m': return h.park_m * qty;
    case 'handwork': return 60 * qty;
    case 'fix_pallet': return 35 * qty;
    case 'dis_pallet': return 15 * qty;
    case 'wrap_low': return 6 * qty;
    case 'wrap_high': return 8 * qty;
    default: return 0;
  }
}

function calcMulti() {
  const hub = document.getElementById('c-hub')?.value;
  const ah = document.getElementById('c-ah')?.value==='1';
  const days = parseInt(document.getElementById('c-days')?.value)||1;
  if(!hub) return;
  const H = HUBS.find(x=>x.id===hub);
  const lines = document.querySelectorAll('.line-item');
  let subtotal = 0;
  const breakdown = [];
  lines.forEach(li => {
    const svc = li.querySelector('.line-svc').value;
    const qty = parseInt(li.querySelector('.line-qty').value)||1;
    const price = getPrice(hub, svc, qty, days);
    subtotal += price;
    const id = li.id.replace('li-','');
    const el = document.getElementById(`li-total-${id}`);
    if(el) el.textContent = `$${price}`;
    if(price>0) breakdown.push({svc,qty,price});
  });
  const min = H.min;
  const ahFee = ah ? H.ah : 0;
  const total = Math.max(subtotal, min) + ahFee;
  const result = document.getElementById('calc-result');
  if(!result) return;
  result.classList.add('on');
  document.getElementById('c-total').textContent = `$${total}`;
  document.getElementById('c-min-note').textContent = subtotal < min ? `Min charge: $${min} applied` : '';
  // Breakdown
  const bd = document.getElementById('c-bd');
  bd.innerHTML = breakdown.map(b=>`<div class="rbr"><span>${b.svc.replace(/_/g,' ')} × ${b.qty}</span><span class="rbv">$${b.price}</span></div>`).join('')
    + (subtotal < min ? `<div class="rbr"><span>Minimum charge</span><span class="rbv">$${min}</span></div>` : '')
    + (ah ? `<div class="rbr"><span>After-hours fee</span><span class="rbv">$${ahFee}</span></div>` : '')
    + `<div class="rbr"><span>TOTAL</span><span class="rbv">$${total}</span></div>`;
  // Phrase
  const svcNames = breakdown.map(b=>`${b.qty} ${b.svc.replace(/_/g,' ')}`).join(', ');
  const phrase = `The rate for ${svcNames} at ${H.n} is $${total}.${subtotal<min?' Minimum charge $'+min+' applied.':''} First ${H.storage_free===1?'24 hours':'week'} of storage is on us.${ah?' After-hours fee: $'+ahFee+'.':''}`;

<div id="ck-content">
${groups.map(([g,items])=>`<div class="ckg"><div class="ckh">${g}</div>${items.map(([t,n])=>`<div class="cki" onclick="togCk(this)"><input type="checkbox" onclick="event.stopPropagation();togCk(this.parentElement)"><div><div class="ck-tx">${t}</div>${n?`<div class="ck-note">${n}</div>`:''}</div></div>`).join('')}</div>`).join('')}
</div>`;

function togCk(el) {
  if(el.tagName==='INPUT') el = el.closest('.cki');
  const cb = el.querySelector('input');
  if(cb) cb.checked = !cb.checked;
  el.classList.toggle('done', cb?.checked);
  updProg();
}

function updProg() {
  const all = document.querySelectorAll('#ck-content .cki input');
  const done = [...all].filter(c=>c.checked).length;
  const pct = all.length ? Math.round(done/all.length*100) : 0;
  const bar = document.getElementById('ck-bar');
  const pt = document.getElementById('ck-pct');
  if(bar) bar.style.width = pct+'%';
  if(pt) pt.textContent = `${done} / ${all.length}`;
}

function resetCk() {
  document.querySelectorAll('#ck-content .cki').forEach(i=>{i.classList.remove('done');const cb=i.querySelector('input');if(cb)cb.checked=false;});
  updProg();
}

function followupPage() {
  return `<h1><span class="h1-icon">🔁</span> Follow-up Scripts — повернення клієнта</h1>

<p>Більшість дзвінків не закриваються першою розмовою. <strong>Follow-up — це робота яка визначає різницю між 23% і 45% repeat rate.</strong> Не follow-up = втрачений клієнт.</p>

<h2>Сценарій 1 — Scout follow-up (Quote given but not booked)</h2>

<h3>Touch 1 — через 2 години (SMS)</h3>
<div class="phrase"><div class="lbl">SMS — день 1 о +2 години</div>"Hi [NAME], [YOUR_NAME] from FREITTY. <strong>Your quote is still valid for [SERVICE] at [HUB] — $[PRICE]/pallet, in and out included.</strong> Want me to book it for [DATE]? Just reply YES."</div>

<h3>Touch 2 — наступного дня (Дзвінок + SMS якщо не відповів)</h3>
<div class="phrase"><div class="lbl">Дзвінок — день 2 ранок</div>"Hi [NAME], [YOUR_NAME] from FREITTY following up on your [SERVICE] request. Quote is still good — should we lock in [DATE]? Got a quick second?"</div>
<div class="phrase"><div class="lbl">SMS після voicemail</div>"Hi [NAME], left you a voicemail. Quote still valid for [SERVICE] at [HUB]. Reply YES or call [DIRECT NUMBER] when ready. — [YOUR_NAME]"</div>

<div class="dbox" style="margin-top:14px"><strong>Після Touch 3 без відповіді:</strong> HubSpot Contact → Lifecycle = "Lost" · Note: <em>"3 follow-ups, no response"</em>. <strong>Не дзвонити більше 3 разів</strong> — це починає виглядати як спам і шкодить репутації номера.</div>

<h3>Touch 1 — через 30 хв (SMS)</h3>

<h3>Через 15 хв після слоту — дзвінок водію</h3>

<div class="phrase"><div class="lbl">SMS dispatcher</div>"Hi [DISPATCHER], FREITTY [HUB]. Driver [NAME / TRUCK#] missed their <strong>[TIME] slot</strong> for [COMPANY]. Need ETA update. After-hours fee may apply. — [YOUR_NAME]"</div>

<div class="dbox"><strong>Якщо водій з'являється з запізненням > 1 годину:</strong> after-hours fee може застосовуватись (за погодженням з warehouse). Якщо взагалі не з'явився — Note в HubSpot Deal "No-show" + повідомлення Oksana для розгляду паттерну (повторні no-shows від цього carrier).</div>

<h3>Через 24 год після видачі — SMS</h3>

<div class="sbox"><strong>Правило:</strong> Просимо review <strong>один раз і все</strong>. Якщо клієнт не залишив — не нагадуємо повторно. Це знижує irritation і захищає бренд.</div>

<div class="dbox">→ Одразу: HubSpot Note "Post-completion complaint" · Slack alert Oksana · Manager callback within 60 min. <strong>Не прохати review.</strong></div>

<h2>Загальні правила follow-up</h2>
<ul>
  <li><strong>Завжди вказуй ім'я і компанію в кожному touch</strong> — "FREITTY" + твоє ім'я. Тоді клієнт впізнає номер при vibrate.</li>
  <li><strong>Direct line у SMS</strong> — клієнт дзвонить ТОБІ, не на main line, ти знаєш контекст і закриваєш швидше.</li>

function rstkInit() {
  const gGrid = document.getElementById('rstk-groups');
  if (gGrid) {
    gGrid.innerHTML = RESTACK_GROUPS.map(g => `
      <button class="rstk-grp-btn" data-id="${g.id}" onclick="rstkPickGrp('${g.id}')">
        <div class="rstk-grp-icon">${g.icon}</div>
        <div class="rstk-grp-name">${g.name}</div>
        <div class="rstk-grp-range">${g.range}</div>
      </button>
    `).join('');
  }
  const dGrid = document.getElementById('rstk-dmgs');
  if (dGrid) {
    dGrid.innerHTML = RESTACK_DMGS.map(d => `
      <button class="rstk-dmg-btn ${d.crit ? 'crit' : ''}" data-code="${d.code}" onclick="rstkToggleDmg('${d.code}')">
        <span class="rstk-dmg-code">${d.code}</span>
        <span class="rstk-dmg-txt"><strong>${d.name}</strong><br><span style="font-size:10.5px;color:var(--mu)">${d.desc}</span></span>
      </button>
    `).join('');
  }
  rstkCalc();
}

function rstkPickGrp(gid) {
  restackState.grp = RESTACK_GROUPS.find(g => g.id === gid);
  restackState.sub = null;
  document.querySelectorAll('.rstk-grp-btn').forEach(b => b.classList.toggle('sel', b.dataset.id === gid));
  const panel = document.getElementById('rstk-sub-panel');
  panel.style.display = '';
  document.getElementById('rstk-sub-lbl').textContent = restackState.grp.name + ' — підтип';
  const list = document.getElementById('rstk-sub-list');
  list.innerHTML = restackState.grp.subtypes.map(st => `
    <button class="rstk-sub-btn ${st.warn ? 'warn' : ''}" data-id="${st.id}" onclick="rstkPickSub('${st.id}')">
      <span class="rstk-sub-name">${st.name}${st.warn ? ' ⚠' : ''}</span>
      <span class="rstk-sub-desc">${st.desc}</span>
      <span class="rstk-sub-price">$${st.wMin}–$${st.wMax}</span>
    </button>
  `).join('');
  rstkCalc();
}

function rstkPickSub(sid) {
  if (!restackState.grp) return;
  restackState.sub = restackState.grp.subtypes.find(s => s.id === sid);
  document.querySelectorAll('.rstk-sub-btn').forEach(b => b.classList.toggle('sel', b.dataset.id === sid));
  rstkCalc();
}

function rstkToggleDmg(code) {
  if (restackState.dmg.has(code)) restackState.dmg.delete(code);
  else restackState.dmg.add(code);
  document.querySelectorAll('.rstk-dmg-btn').forEach(b => b.classList.toggle('on', restackState.dmg.has(b.dataset.code)));
  rstkCalc();
}

function rstkSetH(v) {
  restackState.hCost = v;
  document.querySelectorAll('#rstk-h .rstk-seg-btn').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  rstkCalc();
}

function rstkSetW(v) {
  restackState.wCost = v;
  document.querySelectorAll('#rstk-w .rstk-seg-btn').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  rstkCalc();
}

function rstkPal(d) {
  restackState.pallets = Math.max(1, restackState.pallets + d);
  document.getElementById('rstk-pal-n').textContent = restackState.pallets;
  rstkCalc();
}

function rstkReset() {
  restackState = {grp:null, sub:null, dmg:new Set(), hCost:0, wCost:0, pallets:1};
  document.querySelectorAll('.rstk-grp-btn,.rstk-sub-btn,.rstk-dmg-btn').forEach(b => b.classList.remove('sel', 'on'));
  document.getElementById('rstk-sub-panel').style.display = 'none';
  document.querySelectorAll('#rstk-h .rstk-seg-btn').forEach(b => b.classList.toggle('on', b.dataset.v === '0'));
  document.querySelectorAll('#rstk-w .rstk-seg-btn').forEach(b => b.classList.toggle('on', b.dataset.v === '0'));
  document.getElementById('rstk-pal-n').textContent = '1';
  rstkCalc();
}

function rstkCalc() {
  const card = document.getElementById('rstk-result');
  if (!card) return;
  const {grp, sub, dmg, hCost, wCost, pallets} = restackState;

  if (!grp) {
    card.innerHTML = `<div class="rstk-empty"><div style="font-size:32px;margin-bottom:8px;opacity:.4">📋</div><div>Виберіть тип вантажу для оцінки</div></div>`;
    return;
  }
  if (!sub) {
    card.innerHTML = `<div class="rstk-empty"><div style="font-size:32px;margin-bottom:8px;opacity:.4">👆</div><div>Тепер виберіть підтип</div></div>`;
    return;
  }

  let dmgLo = 0, dmgHi = 0, nCrit = 0;
  dmg.forEach(code => {
    const d = RESTACK_DMGS.find(x => x.code === code);
    if (!d) return;
    dmgLo += d.lo; dmgHi += d.hi;
    if (d.crit) nCrit++;
  });

  const cLo = Math.max(sub.wMin + hCost + wCost + dmgLo, sub.wMin);
  const cHi = Math.max(sub.wMax + hCost + wCost + dmgHi, sub.wMax);

  const n = dmg.size;
  let cxIdx = sub.baseCx || 0;
  if (nCrit >= 2 || n >= 5) cxIdx = Math.max(cxIdx, 3);
  else if (nCrit >= 1 || n >= 4) cxIdx = Math.max(cxIdx, 2);
  else if (n >= 2) cxIdx = Math.max(cxIdx, 1);
  const cx = RESTACK_CX[cxIdx];
  const cxColors = {'EASY':'var(--teal)', 'MEDIUM':'var(--amb)', 'DIFFICULT':'#FF8C42', 'DIFFICULT+':'var(--red)'};

  const hAdd = RESTACK_H_TIME_ADD[hCost] || 0;
  const dmgT = (n - nCrit) * 3 + nCrit * 8;
  const perLo = sub.tLo + hAdd + dmgT;
  const perHi = sub.tHi + hAdd + Math.round(dmgT * 1.4);
  const totLo = perLo * pallets;
  const totHi = perHi * pallets;

  const fmt = m => m < 60 ? `${m} min` : `${Math.floor(m/60)}h${m%60 ? ' ' + (m%60) + 'min' : ''}`;
  const fmtR = (lo, hi) => lo === hi ? fmt(lo) : `${fmt(lo)} – ${fmt(hi)}`;
  const r5 = n => Math.round(n / 5) * 5;

  const mid = r5((cLo + cHi) / 2);
  const totalLo = cLo * pallets;
  const totalHi = cHi * pallets;

  const mods = [];
  if (hCost > 0) mods.push(`<div class="rstk-mod-row"><span>Висота</span><strong>+$${hCost}/pal</strong></div>`);
  if (wCost > 0) mods.push(`<div class="rstk-mod-row"><span>Вага</span><strong>+$${wCost}/pal</strong></div>`);
  if (n > 0)     mods.push(`<div class="rstk-mod-row"><span>Пошкодження (${n})</span><strong>+$${dmgLo}–$${dmgHi}/pal</strong></div>`);

  card.innerHTML = `
    <div class="rstk-r-top">
      <div class="rstk-r-eyebrow">Quote клієнту — за палету</div>
      <div class="rstk-r-price">$${cLo}<span style="font-size:24px;opacity:.4"> – </span>$${cHi}</div>
      <div class="rstk-r-mid">recommended <strong>$${mid}</strong></div>
      <div class="rstk-r-cx" style="color:${cxColors[cx]}">${cx.replace('+', '+').toLowerCase()}</div>
    </div>
    <div class="rstk-r-floor">
      <span style="color:var(--mu);font-size:11px">Min floor</span>
      <span style="color:var(--teal);font-family:'Space Mono',monospace;font-weight:700">$${sub.wMin} ✓</span>
    </div>
    ${mods.length ? `<div class="rstk-r-mods">${mods.join('')}</div>` : ''}
    ${pallets > 1 ? `
    <div class="rstk-r-total">
      <div><div style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px">Total ${pallets} pal</div><div style="font-size:11px;color:var(--mu)">mid $${(mid * pallets).toLocaleString()}</div></div>
      <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--wh)">$${totalLo.toLocaleString()}–$${totalHi.toLocaleString()}</div>
    </div>
    ${totalHi >= 2000 ? '<div style="padding:9px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:6px;font-size:12px;color:var(--amb);margin-top:8px">⚠ Total &gt; $2,000 — escalate to supervisor</div>' : ''}
    ` : ''}
    ${sub.warn ? '<div style="padding:9px 12px;background:rgba(255,61,90,.08);border:1px solid rgba(255,61,90,.2);border-radius:6px;font-size:12px;color:var(--red);margin-top:8px">⚠ Цей підтип потребує supervisor approval до початку роботи</div>' : ''}
    <div class="rstk-r-time">
      <div class="rstk-r-time-cell">
        <div style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">⏱ За палету</div>
        <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--tx)">${fmtR(perLo, perHi)}</div>
      </div>
      ${pallets > 1 ? `
      <div class="rstk-r-time-cell">
        <div style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${pallets} palets total</div>
        <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--tx)">${fmtR(totLo, totHi)}</div>
      </div>` : ''}
    </div>
  `;
}

function renderNetCard(loc) {
  const SVC_LABELS = {'cross-dock':'Cross-dock','rework':'Rework','storage':'Storage','overweight':'Overweight','reefer':'Reefer','hazmat':'Hazmat'};
  const allSvc = ['cross-dock','rework','storage','overweight','reefer','hazmat'];
  const svcChips = allSvc.map(s => {
    const yes = loc.services.includes(s);
    return `<span class="net-svc ${yes ? 'yes' : 'no'}">${SVC_LABELS[s]}</span>`;
  }).join('');

  const dataServices = loc.services.join(' ');
  const dataName = `${loc.name} ${loc.state||''} ${loc.zip||''} ${loc.legal||''} ${loc.services.join(' ')} ${loc.market?.label||''}`.toLowerCase();

  const facility = loc.facility ? renderFacilityGrid(loc) : '';
  const priceTable = loc.price && Object.keys(loc.price).length ? renderPriceTable(loc) : '';
  const noteBlock = loc.note ? renderNoteStrip(loc.note) : '';
  const noteBlock2 = loc.note2 ? renderNoteStrip(loc.note2) : '';
  const noteBlock3 = loc.note3 ? renderNoteStrip(loc.note3) : '';
  const contacts = loc.contacts && loc.contacts.length ? renderContactsBlock(loc.contacts) : '';
  const newBadge = loc.isNew ? '<span class="net-new-badge">NEW</span>' : '';
  const unverifiedBadge = loc.unverified ? '<span class="net-unv-badge">UNVERIFIED</span>' : '';

  return `<article class="net-card net-card-${loc.type}" data-name="${escH(dataName)}" data-type="${loc.type}" data-services="${dataServices}" data-id="${loc.id}">
  <div class="net-card-head">
    <div class="net-card-title-row">
      <div>
        <div class="net-card-name">${loc.name}${newBadge}${unverifiedBadge} <span class="net-legal">${loc.legal||''}</span></div>
      </div>
      <span class="net-market-badge net-mb-${loc.market.cls}">${loc.market.label}</span>
    </div>
    <div class="net-card-addr">📍 ${loc.addr}${loc.interstate ? ` · <span class="net-itrst">${loc.interstate}</span>` : ''}</div>
  </div>
  <div class="net-services-strip">${svcChips}</div>
  <div class="net-card-body">
    <dl class="net-info-grid">
      <dt>Графік</dt><dd>${escH(loc.hours)}</dd>
      <dt>Phone</dt><dd><a href="tel:${loc.phone.replace(/[^0-9+]/g,'')}" class="net-phone">${loc.phone}</a></dd>
      ${loc.gate ? `<dt>Gate code</dt><dd class="net-gate">${loc.gate}</dd>` : ''}
      ${loc.ah ? `<dt>After-hours</dt><dd>${escH(loc.ah)}</dd>` : ''}
    </dl>
    ${facility}
    ${priceTable}
    ${contacts}
  </div>
  ${noteBlock}
  ${noteBlock2}
  ${noteBlock3}
</article>`;
}

function renderFacilityGrid(loc) {
  const f = loc.facility;
  const rows = [];
  if (f.type) rows.push(['Тип', f.type]);
  if (f.size) rows.push(['Розмір', f.size]);
  if (f.docks) rows.push(['Dock doors', f.docks]);
  if (f.forklifts) rows.push(['Forklifts', f.forklifts]);
  if (f.equipment) rows.push(['Обладнання', f.equipment]);
  if (f.floor) rows.push(['Floor load', f.floor]);
  if (f.height) rows.push(['Pallet height', f.height]);
  if (f.parking) rows.push(['Парковка', f.parking]);
  if (f.capacity) rows.push(['Капасіті', f.capacity]);
  if (f.tempControl) rows.push(['Temp control', f.tempControl]);
  if (f.certifications) rows.push(['Сертифікації', f.certifications]);
  if (f.medical) rows.push(['Medical', f.medical]);
  if (loc.vehicles) rows.push(['ТЗ', loc.vehicles]);
  if (!rows.length) return '';
  return `<div class="net-detail-section">
    <h4>Facility</h4>
    <dl class="net-info-grid">
      ${rows.map(([k,v]) => `<dt>${k}</dt><dd>${escH(v)}</dd>`).join('')}
    </dl>
  </div>`;
}

function renderPriceTable(loc) {
  const heading = loc.type === 'own' ? 'Стандартний прайс' : 'Прайс партнера';
  return `<div class="net-detail-section">
    <h4>${heading}</h4>
    <table class="net-price-mini">
      ${Object.entries(loc.price).map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
    </table>
  </div>`;
}

function renderNoteStrip(note) {
  const cls = note.type === 'danger' ? 'net-danger-strip' : note.type === 'warn' ? 'net-warn-strip' : 'net-info-strip';
  const icon = note.type === 'danger' ? '🚫' : note.type === 'warn' ? '⚠️' : 'ℹ️';
  return `<div class="${cls}"><b>${icon}</b> ${note.text}</div>`;
}

function renderContactsBlock(contacts) {
  if (!contacts.length) return '';
  return `<div class="net-detail-section">
    <h4>Контакти</h4>
    <div class="net-contacts">
      ${contacts.map(c => `<div class="net-contact-line">

        <span class="net-contact-name">${c.name}</span>
        <a href="tel:${c.phone.replace(/[^0-9+]/g,'')}" class="net-phone">${c.phone}</a>
        ${c.email ? `<a href="mailto:${c.email}" class="net-email">${c.email}</a>` : ''}

}

function netInitMap() {
  if (typeof L === 'undefined') {
    console.warn('Leaflet not loaded yet, retrying...');
    setTimeout(netInitMap, 200);
    return;
  }
  const container = document.getElementById('networkMap');
  if (!container) return;
  if (netLeafletInited) {
    setTimeout(() => { if (netLeafletMap) netLeafletMap.invalidateSize(); }, 50);
    return;
  }
  netLeafletInited = true;

  netLeafletMap = L.map('networkMap', { scrollWheelZoom: false }).setView([39.5, -97.5], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 18,
  }).addTo(netLeafletMap);

  // Activate scroll-wheel only on focus

function netSwitchTab(tab) {
  netCurrentTab = tab;
  document.querySelectorAll('.net-tab').forEach(b => b.classList.toggle('on', b.dataset.nettab === tab));
  document.querySelectorAll('.net-tab-content').forEach(c => c.classList.toggle('on', c.id === `net-tab-${tab}`));
  if (tab === 'map') {
    netInitMap();
  }
}

// ─── FILTERING ────────────────────────────────────────

function netToggleType(t) {
  if (netActiveTypes.has(t)) netActiveTypes.delete(t);
  else netActiveTypes.add(t);
  document.querySelectorAll('.net-chip-type').forEach(c => c.classList.toggle('on', netActiveTypes.has(c.dataset.type)));
  netApplyFilters();
}

function netToggleSvc(s) {
  if (netActiveServices.has(s)) netActiveServices.delete(s);
  else netActiveServices.add(s);
  document.querySelectorAll('.net-chip-svc').forEach(c => c.classList.toggle('on', netActiveServices.has(c.dataset.svc)));
  netApplyFilters();
}

function netApplyFilters() {
  const q = (document.getElementById('net-search')?.value || '').trim().toLowerCase();
  const cards = document.querySelectorAll('.net-card');
  let visible = 0, ownVis = 0, partVis = 0;
  cards.forEach(card => {
    const name = card.dataset.name;
    const type = card.dataset.type;
    const svcStr = card.dataset.services;
    const services = svcStr.split(' ');
    const matchSearch = !q || name.includes(q);
    const matchSvc = netActiveServices.size === 0 || [...netActiveServices].every(s => services.includes(s));
    const matchType = netActiveTypes.size === 0 || netActiveTypes.has(type);
    const ok = matchSearch && matchSvc && matchType;
    card.style.display = ok ? '' : 'none';
    if (ok) {
      visible++;
      if (type === 'own') ownVis++;
      else partVis++;
    }
  });
  const cnt = document.getElementById('net-count');
  if (cnt) cnt.innerHTML = `<b>${visible}</b> з ${cards.length}`;
  const dOwn = document.getElementById('net-div-own');
  const gOwn = document.getElementById('net-grid-own');
  const dPar = document.getElementById('net-div-partner');
  const gPar = document.getElementById('net-grid-partner');
  if (dOwn) dOwn.style.display = ownVis === 0 ? 'none' : '';
  if (gOwn) gOwn.style.display = ownVis === 0 ? 'none' : '';
  if (dPar) dPar.style.display = partVis === 0 ? 'none' : '';
  if (gPar) gPar.style.display = partVis === 0 ? 'none' : '';
  const empty = document.getElementById('net-empty');
  if (empty) empty.classList.toggle('on', visible === 0);
}

<p>Скрипт — це гайдлайн, не текст для читання. За кожною фразою стоїть один з трьох принципів. Розумієш принцип → адаптуєш слова до будь-якої ситуації → не загубишся навіть у нестандартному сценарії.</p>

<p>Клієнт дзвонить з проблемою. Перше що він хоче почути — <em>«так, можемо допомогти»</em>. Не <em>«дайте час перевірити»</em>. Не <em>«залежить від...»</em>. Не <em>«може бути»</em>.</p>
<p>Людина у стресі (а crisis клієнт — завжди в стресі) <strong>не здатна слухати деталі поки не отримала підтвердження що проблему вирішать</strong>. Якщо агент починає збирати дані перш ніж сказав <em>"yes"</em> — клієнт мисленно вже дзвонить наступному номеру.</p>
