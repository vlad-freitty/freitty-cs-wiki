<h2>П'ять правил «ніколи»</h2>

<h3>❌ Правило 1: Не коментуємо причину пошкодження вантажу</h3>
<p><strong>Чому:</strong> Юридична відповідальність. Будь-яке припущення агента — потенційний доказ у претензії або суді. Це не наша компетенція — це питання страхової і юристів.</p>
<div class="phrase"><div class="lbl">Що казати</div>"We're here to fix the situation. For questions about the cause, please contact our support team."</div>
<div class="dbox"><strong>Заборонено:</strong> <em>"it looks like"</em> / <em>"probably caused by"</em> / <em>"I think the reason is"</em> / <em>"you should have"</em>. Навіть якщо причина очевидна — мовчимо.</div>

<h3>❌ Правило 2: Не приймаємо hazmat без підтвердженого дозволу хабу</h3>
<p><strong>Чому:</strong> Безпека персоналу і юридична відповідальність. Zero tolerance.</p>
<div class="phrase"><div class="lbl">Стандартна фраза</div>"Let me verify our facility's hazmat capabilities for your specific class — one moment."</div>
<div class="phrase"><div class="lbl">Якщо хаб не може</div>"Unfortunately our facility doesn't accept that hazmat class. I apologize we couldn't help."</div>
<div class="dbox"><strong>Заборонено:</strong> <em>"Probably okay"</em> / <em>"I think we can"</em> / <em>"Let them come and we'll figure it out"</em></div>

<h3>❌ Правило 3: Не відмовляємо без NBA</h3>
<p><strong>Чому:</strong> Кожна відмова без альтернативи = клієнт загублений назавжди. Навіть якщо ми не можемо допомогти — завжди є що запропонувати: партнерська мережа, найближчий хаб, інший час.</p>
<div class="phrase"><div class="lbl">Стандарт</div>"This location is full — but we have space at [NEAREST HUB]. It's [N] miles from you. Would that work?"</div>
<div class="phrase"><div class="lbl">Якщо зовсім нічого</div>"Let me check our partner network — we may have something nearby. One moment."</div>

<h3>❌ Правило 4: Не обіцяємо ціну Rework до отримання фотографій</h3>
<p><strong>Чому:</strong> Ціна rework без огляду = гарантована суперечка після виконання. Або клієнт незадоволений що вийшло більше, або ми втрачаємо на роботі.</p>
<div class="phrase"><div class="lbl">Стандарт — діапазон + таймінг</div>"The range is usually $35 to $150 depending on the damage. Send me photos right now and I'll have your exact quote in 15 minutes."</div>
<p>Конкретний час — завжди. Не <em>"скоро"</em>, не <em>"as soon as possible"</em>.</p>

<h3>❌ Правило 5: Не відпускаємо вантаж без підтвердженого перевізника</h3>
<p><strong>Чому:</strong> Захист від несанкціонованого забору вантажу. Якщо компанія на траку не відповідає компанії в ордері — зупинити і перевірити.</p>
<div class="phrase"><div class="lbl">Стандарт</div>"I need to verify the carrier information before we can release — just one moment."</div>
<p>Перевірка через BrokerSnapshot: активний MC, назва компанії відповідає.</p>

<h2>Додаткові операційні правила</h2>

<h3>Юридичне питання / Claim</h3>
<div class="phrase">"I understand. For any formal claims or legal matters, let me connect you with our management team. Can I get your email so they can reach out directly?"</div>
<p>Нічого не визнавати, нічого не заперечувати. Redirect на management.</p>

<h3>Law enforcement / Government</h3>
<p>Не підтверджувати і не заперечувати нічого про вантаж або клієнтів. Одразу:</p>
<div class="phrase">"Let me transfer you to our management team." → Трансфер на Антона Гаврилюка.</div>

<h3>Питання поза компетенцією агента</h3>
<table>
<tr><th>Тип питання</th><th>Хто відповідає</th></tr>
<tr><td>Страховка вантажу</td><td>Supervisor / Management</td></tr>
<tr><td>Freight broker authority</td><td>Влад</td></tr>
<tr><td>Кредитні умови / відстрочка</td><td>Влад / Management</td></tr>
<tr><td>Portal / API технічні питання</td><td>Dev/Support (Діма/Сергій)</td></tr>
<tr><td>Партнерство / відкриття хабу</td><td>Андрій (CEO)</td></tr>
</table>
<p>Для всіх невідомих сценаріїв:</p>
<div class="phrase">"That's a great question and I want to make sure you get the right answer. Let me connect you with the right person — can I get your contact details?"</div>

<h2>Самоперевірка — 10 тверджень</h2>
<p>Якщо ти засвоїв цей шар — ці речення мають звучати як само собою зрозумілі:</p>
<ol style="list-style:decimal;margin-left:20px;color:var(--tx)">
<li style="padding:3px 0">Наш конкурент — наступний результат у Google Maps, не конкретна компанія.</li>
<li style="padding:3px 0">Клієнт купує не cross-dock — він купує можливість продовжити рейс сьогодні.</li>
<li style="padding:3px 0">Є 5 сегментів. Кожен потребує іншого підходу. Я розпізнаю тип за першими 30 секундами.</li>
<li style="padding:3px 0">Перша фраза після opening завжди <em>"Yes, we can help"</em> — ніколи <em>"let me check"</em>.</li>
<li style="padding:3px 0">$6/pallet in and out, min $50, first 24h free. SB і Stockton — $7. Greenville — тиждень free.</li>
<li style="padding:3px 0">After-hours — one-time fee, не per pallet. Markham/CA: $150. Решта: $100.</li>
<li style="padding:3px 0">Denver не приймає Open Deck. Питати тип трейлера перед підтвердженням.</li>
<li style="padding:3px 0">Кожен дзвінок закінчується конкретним NBA. Навіть відмова має NBA.</li>
<li style="padding:3px 0">Причину пошкодження вантажу не коментую ніколи. Ніколи. Навіть якщо очевидно.</li>
<li style="padding:3px 0">Брокерів ідентифікую мовчки → CRM тег після → AM підхоплює. Не конвертую сам.</li>
</ol>`;
  }
  return null;
}

<h2>1. Що таке NOD</h2>
<p><strong>NOD (Non-Owned Destination)</strong> — хаб або термінал, який належить зовнішньому партнеру, а не Freitty. Ми координуємо через нього замовлення клієнтів, але не керуємо ним напряму.</p>
<div class="wbox"><strong>Ключова відмінність від власного хабу Freitty:</strong> для наших хабів ціна і умови (Hub Declaration, Level 1/2/3, тарифи) зафіксовані в системі й однакові для всіх. Для NOD немає єдиного стандарту в системі — <strong>ціна й умови в кожного партнера свої, згідно контракту з ним</strong>, і саме контракт визначає тариф і умови по цій локації, а не наша тарифна сітка.</div>

<h2>2. Процес — покроково</h2>
<ol style="list-style:decimal;margin-left:20px;color:var(--tx)">
<li style="padding:4px 0"><strong>Вхідний дзвінок від клієнта.</strong> Клієнт телефонує із запитом на сервіс у NOD. Стандартний opening, збираємо мінімум 4 критерії: Company + MC/DOT, Service type, Location (NOD — чітко вказуємо, це не наш хаб), Date + time.</li>
<li style="padding:4px 0"><strong>Створення ордеру.</strong> Ордер створюється в системі з Order#/Hub #. Цей номер супроводжує замовлення протягом усього циклу і використовується у кожному повідомленні партнеру.</li>
<li style="padding:4px 0"><strong>NEW ORDER → партнер ACCEPT / DECLINE.</strong> Надсилаємо шаблон NEW ORDER у Telegram-чат партнера. Партнер має ACCEPT або DECLINE ордер прямо в Hub за посиланням. <strong>SLA на відповідь партнера — 10 хвилин:</strong> немає реакції за 10 хв → пінгуємо партнера в Telegram і паралельно готуємо запасний варіант. Якщо ACCEPTED — партнер призначає worker і dock та чекає прибуття. Якщо DECLINED — партнер обов'язково вказує причину в Hub, а ми <strong>одразу пропонуємо клієнту найближчу альтернативну локацію</strong> (за Network & Partners), не лишаючи його без рішення: <em>"That location can't take this one — but our [HUB/PARTNER] is [X] miles away and can. Want me to book it there?"</em></li>
<li style="padding:4px 0"><strong>ARRIVED — прибуття трака.</strong> Коли партнер повідомляє про прибуття, надсилаємо шаблон ARRIVED. Партнер зобов'язаний виставити статус "Arrived to Hub" протягом 5 хвилин та завантажити фото (truck, trailer, BOL, load) саме в Hub, не в Telegram. Carrier з BOL має збігатись з бронюванням — будь-яка розбіжність = STOP, партнер не продовжує роботу без нашого підтвердження.</li>
<li style="padding:4px 0"><strong>IN PROCESS → нагадування перед Processed.</strong> Поки замовлення виконується, надсилаємо Reminder-шаблон: всі операції та фото мають бути залоговані в Hub, додаткові послуги — залоговані як operations для білінгу, ціну сервісу потрібно підтвердити в Billing. Партнер повідомляє нас за ~10 хв до завершення, щоб ми встигли запустити процес оплати.</li>
<li style="padding:4px 0"><strong>ETA UPDATE — за потреби.</strong> Якщо час прибуття змінюється, надсилаємо окремий шаблон ETA UPDATE з новим орієнтовним часом.</li>
<li style="padding:4px 0"><strong>PROCESSED → CLOSED — оплата підтверджена.</strong> Тільки після підтвердження оплати надсилаємо фінальний шаблон: партнер може відпустити трак, перевіряє що всі фото завантажені в Hub, і виставляє статус "Closed".</li>
</ol>
<div class="dbox"><strong>Два правила, що діють на кожному етапі:</strong><br>1. Партнер НІКОЛИ не відпускає трак без нашого підтвердження — це може призвести до неоплати.<br>2. Партнер НІКОЛИ не приймає оплату від клієнта на місці, якщо Freitty це не узгодило окремо.</div>

/* ═══ 41-core-sidebar.js ═══ */
function buildSB(tab){
  const vis = tab==='all' ? PAGES : PAGES.filter(p=>p.tabs.includes(tab));
  const tools = vis.filter(p=>p.tabs.includes('tools'));
  const wiki = vis.filter(p=>!p.tabs.includes('tools'));

  // Group wiki pages by layer
  const GROUPS = [
    {id:'s0', label:'Шар 0 — Архітектура', dot:'#534AB7', color:'#6c63ff', pages:[]},
    {id:'s1', label:'Шар 1 — Стратегія', dot:'#1D9E75', color:'#00d9a3', pages:[]},
    {id:'s2', label:'Шар 2 — Лід-процес', dot:'#BA7517', color:'#f59e0b', pages:[]},
    {id:'s3', label:'Шар 3 — Комунікація', dot:'#185FA5', color:'#378add', pages:[]},
    {id:'s4', label:'Шар 4 — Скрипти', dot:'#3C3489', color:'#6c63ff', pages:[]},
    {id:'s5', label:'Шар 5 — NOD / Партнерські локації', dot:'#B8438A', color:'#e05aa9', pages:[]},
  ];
  const ungrouped = [];

  wiki.forEach(p=>{
    const g = GROUPS.find(g=>p.tabs.includes(g.id));
    if(g) g.pages.push(p);
    else ungrouped.push(p);
  });

  let h = '';

  // Tools group
  if(tools.length){
    const open = tools.some(p=>p.p===curPage);
    h += `<div class="sb-grp">
      <div class="sb-grp-h" onclick="togGrp(this)">
        <div class="sb-grp-dot" style="background:var(--red)"></div>
        <span class="sb-grp-ttl">Інструменти</span>
        <span class="sb-grp-cnt">${tools.length}</span>
        <span class="sb-grp-arr ${open?'open':'open'}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l5 4-5 4"/></svg></span>
      </div>
      <div class="sb-body" style="max-height:${open||true?'2000px':'0'}">
        ${tools.map(p=>`<div class="sb-i tool-item" data-p="${p.p}" onclick="show(${p.p})">
          <div class="sb-dot"></div>
          <span class="sb-t">${escH(p.t)}<span class="pill p-t">TOOL</span></span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Ungrouped wiki (home page etc)
  if(ungrouped.length){
    ungrouped.forEach(p=>{
      h+=`<div class="sb-i" data-p="${p.p}" onclick="show(${p.p})" style="padding-left:16px;border-left:3px solid transparent">
        <div class="sb-dot"></div>
        <span class="sb-t">${escH(p.t)}</span>
      </div>`;
    });
  }

  // Wiki groups
  GROUPS.forEach(g=>{
    if(!g.pages.length) return;
    const open = g.pages.some(p=>p.p===curPage);
    h += `<div class="sb-grp">
      <div class="sb-grp-h" onclick="togGrp(this)">
        <div class="sb-grp-dot" style="background:${g.dot}"></div>
        <span class="sb-grp-ttl" style="color:${open?g.color:'var(--tx)'}">${g.label}</span>
        <span class="sb-grp-cnt">${g.pages.length}</span>
        <span class="sb-grp-arr ${open?'open':''}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l5 4-5 4"/></svg></span>
      </div>
      <div class="sb-body" style="max-height:${open?'2000px':'0'}">
        ${g.pages.map(p=>{
          const isStar=p.t.includes('★');
          const label = p.t.replace(/^\d+\.\d*\s*★?\s*/,'').replace(/^Шар \d+ — /,'').replace(/^★\s*/,'');
          const num = p.t.match(/^(\d+\.\d*)/)?.[1] || '';
          return `<div class="sb-i" data-p="${p.p}" onclick="show(${p.p})">
            ${num?`<span style="font-family:'Space Mono',monospace;font-size:8.5px;color:${g.color};min-width:22px;flex-shrink:0;padding-top:2px">${num}</span>`:'<div class="sb-dot"></div>'}
            <span class="sb-t">${escH(label)}${isStar?'<span class="pill p-n"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-1px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>':''}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });

  document.getElementById('sbc').innerHTML = h;
  updSB();
}

function togGrp(hdr){
  const body = hdr.nextElementSibling;
  const arr = hdr.querySelector('.sb-grp-arr');
  const isOpen = body.style.maxHeight !== '0px' && body.style.maxHeight !== '0';
  body.style.maxHeight = isOpen ? '0' : '2000px';
  arr.classList.toggle('open', !isOpen);
}

function updSB(){
  document.querySelectorAll('.sb-i').forEach(el=>{
    const isOn = parseInt(el.dataset.p)===curPage;
    el.classList.toggle('on',isOn);
    // open parent group if this item is active
    if(isOn){
      const body = el.closest('.sb-body');
      if(body){
        body.style.maxHeight='2000px';
        const arr = body.previousElementSibling?.querySelector('.sb-grp-arr');
        if(arr) arr.classList.add('open');
      }
    }
  });
  const a=document.querySelector('.sb-i.on');
  if(a)setTimeout(()=>a.scrollIntoView({block:'nearest',behavior:'smooth'}),50);
}
/* ═══ 42-core-search.js ═══ */
const si=document.getElementById('si');
const sres=document.getElementById('sres');

function doSearch(q){
  if(!q||q.length<2){sres.classList.remove('on');return;}
  const results=[];
  PAGES.forEach(p=>{
    const tl=p.t.toLowerCase(),pl=p.pl.toLowerCase();
    const tm=tl.includes(q),bm=pl.includes(q);
    if(!tm&&!bm)return;
    let snip='';
    if(bm){const idx=pl.indexOf(q);const s=Math.max(0,idx-45);const e=Math.min(pl.length,idx+q.length+75);let raw=escH(p.pl.slice(s,e).trim());raw=raw.replace(new RegExp(escH(q),'gi'),m=>`<mark>${m}</mark>`);snip=(s>0?'…':'')+raw+(e<pl.length?'…':'');}
    const layer=p.tabs.find(t=>t.startsWith('s'));
    results.push({p:p.p,t:p.t,snip,layer:p.tabs.includes('tools')?'Інструменти':layer?'Шар '+layer.slice(1):'Головна',score:(tm?2:0)+(bm?1:0)});
  });
  results.sort((a,b)=>b.score-a.score);
  if(!results.length){sres.innerHTML='<div class="se">🔍 Нічого не знайдено</div>';}
  else{sres.innerHTML=`<div class="scnt">Знайдено: ${results.length}</div>`+results.slice(0,9).map(r=>`<div class="sri" onclick="goR(${r.p})"><div class="sri-l">${r.layer}</div><div class="sri-t">${escH(r.t)}</div>${r.snip?`<div class="sri-s">${r.snip}</div>`:''}</div>`).join('');}
  sres.classList.add('on');
}

function goR(p){sres.classList.remove('on');si.value='';curTab='all';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==='all'));buildSB('all');show(p);}

});

// OS-AWARE KEYBOARD SHORTCUT HINT
// ═══════════════════════════════════════════════════════

(function setShortcutHint() {
  const skbd = document.getElementById('skbd');
  if (!skbd) return;
  const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform) || /Mac/.test(navigator.userAgent);
  skbd.textContent = isMac ? '⌘ K' : 'Ctrl K';
  const siEl = document.getElementById('si');
  if (siEl) siEl.placeholder = isMac ? 'Пошук... (⌘K)' : 'Пошук... (Ctrl+K)';
})();

buildSB('all');
show(0);
